# Only for the PRIVATE build (treadmill.yaml). The public build (treadmill-public.yaml) needs no secrets:
# Wi-Fi is entered once in the "Treadmill Setup" hotspot.
# Copy this file to secrets.yaml and replace every placeholder. Never commit the real secrets.yaml.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# 32-byte Base64 key (ESPHome dashboard generates one for a new device).
api_encryption_key: "YOUR_BASE64_API_ENCRYPTION_KEY"

ota_password: "YOUR_OTA_PASSWORD"
fallback_ap_password: "YOUR_FALLBACK_AP_PASSWORD"

# Nextion display firmware (.tft) the board downloads for "Update display".
nextion_tft_url: "https://github.com/samsonovss/ESPHome-Treadmill-FTMS/releases/download/display-v1.0.1/nextion_treadmill_4.3_ips_800x480.tft"
