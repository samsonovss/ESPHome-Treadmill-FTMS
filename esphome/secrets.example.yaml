# Copy this file to secrets.yaml and replace every placeholder.
# Never commit the real secrets.yaml file.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Generate a 32-byte Base64 key in ESPHome or Home Assistant.
api_encryption_key: "YOUR_BASE64_API_ENCRYPTION_KEY"

ota_password: "YOUR_OTA_PASSWORD"
fallback_ap_password: "YOUR_FALLBACK_AP_PASSWORD"

# 64-bit address of the DS18B20 motor-temperature sensor.
motor_temperature_sensor_address: "0x0000000000000000"

# BLE MAC address of the heart-rate monitor.
heart_rate_monitor_mac: "AA:BB:CC:DD:EE:FF"

# URL from which the Nextion display can download its TFT firmware.
nextion_tft_url: "http://YOUR_HOME_ASSISTANT_HOST:8123/local/nextion_treadmill.tft"
