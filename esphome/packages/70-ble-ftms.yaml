esp32_ble_tracker:
  scan_parameters:
    #interval: 1100ms
    #window: 300ms
    active: true


# ble_client (fit_smart)
# 1. Подключается к устройству с MAC-адресом из secrets.yaml.
# 2. При подключении (on_connect):
#    - Публикует статус "Подключен".
#    - Запрашивает модель устройства (name_bt_sensor.update()).
#    - Принудительно обновляет уровень батареи.
#    - Устанавливает hr=1 (флаг подключения пульсометра) и обновляет статус на дисплее Nextion.
#    - Если активна главная страница (mainPage.state):
#        * Показывает сообщение об успешном подключении (p_error).
#        * Через 3 секунды скрывает его и активирует элементы интерфейса (bhr_zone, bhiit).
# 3. При отключении (on_disconnect):
#    - Сбрасывает сенсор пульса (heart_rate_sensor = 0).
#    - Обновляет дисплей Nextion:
#        * hr=0 (отключено).
#        * Сбрасывает отображение батареи, bpm и имени устройства.
#        * Меняет иконки и прозрачность элементов на главной странице.
#    - Публикует battery_level_sensor = 0.
#    - Публикует статус "Отключено".
ble_client:
  - mac_address: !secret heart_rate_monitor_mac
    id: fit_smart
    on_connect:
      - text_sensor.template.publish:
          id: connection_status
          state: "Подключен"
      - delay: 20ms 
      - lambda: |-
          id(name_bt_sensor).update();   // запросить модель

          ESP_LOGI("ble_client", "Connected to fit_smart");
          // Принудительное чтение батареи при подключении
          id(battery_level_sensor).update();
          // Устанавливаем значение hr в 1 (подключено)
          id(display_nextion).send_command_printf("hr=1");
          ESP_LOGI("Nextion", "Sending command for hr=1");
          id(display_nextion).set_component_text("bluetooth.status_bt", "connected");
      - if:
          condition:
            lambda: 'return id(current_page) == 0;'
          then:
            - lambda: |-
                id(display_nextion).send_command_printf("p_error.pic=15");
                id(display_nextion).send_command_printf("vis p_error,1");
                ESP_LOGI("Nextion", "Sending command for p_error.pic and vis p_error 1");
            - delay: 3000ms  # Задержка 3 секунды
            - lambda: |-
                id(display_nextion).send_command_printf("vis p_error,0");
                id(display_nextion).send_command_printf("mainPage.bhr_zone.aph=127"); 
                id(display_nextion).send_command_printf("mainPage.bhiit.aph=127"); 
                ESP_LOGI("Nextion", "Sending command for vis p_error 0 and mainPage.bhr_zone.aph=127 and mainPage.bhiit.aph=127");

                //id(display_nextion).send_command_printf("mainPage.bfit_test.aph=127"); 
    on_disconnect:
      - sensor.template.publish:
          id: heart_rate_sensor
          state: 0 # !lambda 'return NAN;'
      - lambda: |-
          if (id(current_page) == 1) {
            id(display_nextion).set_component_text("b0", "-"); // Устанавливаем строку на дисплей
            id(display_nextion).send_command_printf("b0.pic=7");
            ESP_LOGI("Nextion", "Sending command for b0.pic=7");
          }

          // Устанавливаем значение hr в 0 отключено
          id(display_nextion).send_command_printf("hr=0");
          ESP_LOGI("Nextion", "Sending command for hr=0");
          // Если сейчас на главной — затемняем кнопки программ
          if (id(current_page) == 0) {
            id(display_nextion).send_command_printf("mainPage.bhr_zone.aph=80"); 
            id(display_nextion).send_command_printf("mainPage.bhiit.aph=80"); 
            ESP_LOGI("Nextion", "Sending command for mainPage.bhr_zone.aph=80 and mainPage.bhiit.aph=80");
            //id(display_nextion).send_command_printf("mainPage.bfit_test.aph=80"); 
          }
          id(display_nextion).set_component_text("bluetooth.battery", "-");
          id(display_nextion).set_component_text("bluetooth.bpm", "");
          id(display_nextion).set_component_text("bluetooth.name_bt", "-");
          id(display_nextion).set_component_text("bluetooth.status_bt", "disconnected");
      - sensor.template.publish:
          id: battery_level_sensor
          state: 0 # !lambda 'return NAN;'
      - text_sensor.template.publish:
          id: connection_status
          state: "Отключено"

