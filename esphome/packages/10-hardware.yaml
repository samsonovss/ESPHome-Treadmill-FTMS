#             std::vector<uint8_t> filtered_bytes;
#             filtered_bytes.reserve(30); // Ограничить размер
#             for (auto byte : bytes) {
#               if (byte != 0x00) {
#                 filtered_bytes.push_back(byte);
#               }
#             }
#             if (!filtered_bytes.empty()) {
