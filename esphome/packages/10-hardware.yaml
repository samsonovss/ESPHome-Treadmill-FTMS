i2c:
  sda: GPIO12
  scl: GPIO11
  scan: true
  id: bus_a
  frequency: 400kHz


uart:
  # --- UART 0: дисплей Nextion ---
  # Используется для связи с дисплеем Nextion.
  # Скорость — 921600 бод, только передача/приём команд дисплея.
  - id: uart_0
    rx_pin: GPIO1
    tx_pin: GPIO2
    baud_rate: 921600

# --- UART BUS: плата беговой дорожки ---
# Основной рабочий UART для обмена с контроллером дорожки.
# Используется для получения команд обратной связи скорости и наклона.
#
# Подключение:
#   TX → GPIO17 (от ESP к плате)
#   RX → GPIO18 (от платы к ESP)
#
# Настройки:
#   - Скорость: 4800 бод
#   - Формат: 8N1 (8 бит данных, без чётности, 1 стоп-бит)
#   - Буфер: 512 байт
#
# Логика работы (реализована в блоке interval):
#   1. Принимаем данные и собираем строку (до 30 байт).
#   2. Ищем команды в формате [КОМАНДА:ЗНАЧЕНИЕ].
#   3. Поддерживаемые команды:
#        • [SETSPD:x] → обновляет скорость дорожки (treadmill_speed_feedback).
#        • [SETINC:x] → обновляет наклон дорожки (treadmill_incline_feedback).
#          * Значения ≤1 интерпретируются как 0 (игнорируем «0.1%»).
#   4. Некорректные данные логируются как предупреждение.
#   5. Неизвестные команды просто выводятся в лог.
#
# ⚠️ Отладка:
#   - Блок debug ниже можно включить временно, чтобы видеть «сырые» данные.
#   - Для постоянной работы он не нужен, достаточно interval + парсер.
  - id: uart_bus
    tx_pin: 
      number: GPIO17
      inverted: false
    rx_pin: 
      number: GPIO18
      mode: 
        input: true
        pullup: true
      inverted: false
    baud_rate: 4800
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512
