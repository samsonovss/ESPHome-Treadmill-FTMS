# --- UART debug с фильтрацией ---
# Использовался для отладки обмена с платой (PMS/дорожка).
# Особенности:
#  - Скорость 4800 бод.
#  - Отбрасывает "мусорные" байты 0x00 (часто встречаются в потоке).
#  - Собирает строку и ищет команды в формате [SETSPD:XXX], [SETINC:XXX].
#  - При нахождении сразу обновляет сенсоры обратной связи скорости и наклона.
#  - Удобно для тестов: в логах видно не только «сырые» данные, но и сразу результат парсинга.
#
# ⚠️ Важно:
#  - Это отладочный режим, в рабочей конфигурации можно держать закомментированным.
#  - Для постоянной работы лучше использовать блок interval + read_byte(),
#    так как debug предназначен только для диагностики.
#  - Этот вариант отличается от "без фильтрации" тем, что:
#      • убирает нули (0x00),
#      • сразу парсит команды и обновляет глобальные переменные.

