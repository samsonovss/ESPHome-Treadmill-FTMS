one_wire:
  - platform: gpio
    pin: 21

# Отладочные сенсоры системы (debug)
debug:
  update_interval: 5s  # как часто опрашивать

# Сенсоры
sensor:
  # === BEGIN EXPERIMENTAL_KICKR_RUN ===
  # Zwift Requested Incline — исходный реальный градиент трассы, который
  # присылает Zwift через фирменную характеристику KICKR RUN.
  # Значение может быть отрицательным на спуске.
  # Для удаления эксперимента удалить все блоки с меткой EXPERIMENTAL_KICKR_RUN.
  - platform: template
    name: "Zwift Requested Incline"
    id: zwift_requested_incline
    unit_of_measurement: "%"
    accuracy_decimals: 2
    icon: "mdi:slope-uphill"
    update_interval: never

  # Zwift Mapped Treadmill Incline — рассчитанный уровень дорожки после
  # применения калибровки и интенсивности. Это значение показывает, какую
  # цель автоматика установит на дорожке; при выключенной автоматике сенсор
  # продолжает считать и показывать результат, но мотором не управляет.
  - platform: template
    name: "Zwift Mapped Treadmill Incline"
    id: zwift_mapped_incline
    unit_of_measurement: "level"
    accuracy_decimals: 1
    icon: "mdi:angle-acute"
    update_interval: never
  # === END EXPERIMENTAL_KICKR_RUN ===

  - platform: debug
    free:
      name: "Heap Free"            #    - Heap Free — свободная оперативная память (байты).
      filters:
        - delta: 1
    block:
      name: "Heap Max Block"       #    - Heap Max Block — максимальный непрерывный блок памяти (байты).
      filters:
        - delta: 1
    loop_time:
      name: "Loop Time"            #    - Loop Time — время выполнения основного цикла (мс).
      filters:
        - delta: 1
    psram:
      name: "Free PSRAM"           #    - Free PSRAM — свободная внешняя PSRAM (если доступна).
      filters:
        - delta: 1
    cpu_frequency:
      name: "CPU Frequency"        #    - CPU Frequency — текущая частота процессора (МГц).
      filters:
        - delta: 1

  - platform: template
    name: "Zone1"
    id: last_zone1_time
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:heart-pulse
    lambda: |-
      return id(zone1_time_stored);

  - platform: template
    name: "Zone2"
    id: last_zone2_time
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:heart-pulse
    lambda: |-
      return id(zone2_time_stored);

  - platform: template
    name: "Zone3"
    id: last_zone3_time
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:heart-pulse
    lambda: |-
      return id(zone3_time_stored);

  - platform: template
    name: "Zone4"
    id: last_zone4_time
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:heart-pulse
    lambda: |-
      return id(zone4_time_stored);

  - platform: template
    name: "Zone5"
    id: last_zone5_time
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:heart-pulse
    lambda: |-
      return id(zone5_time_stored);

  # Время тренировки (секунды)
  - platform: template
    name: "Last Time"
    id: last_time
    unit_of_measurement: s
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:timer-outline
    lambda: |-
      return id(last_time_stored);

  # Дистанция
  - platform: template
    name: "Last Distance"
    id: last_distance
    unit_of_measurement: "km"
    accuracy_decimals: 2
    icon: mdi:map-marker-distance
    lambda: |-
      return id(last_distance_stored);

  # Калории
  - platform: template
    name: "Last Calories"
    id: last_calories
    unit_of_measurement: "kcal"
    accuracy_decimals: 0
    icon: mdi:fire
    lambda: |-
