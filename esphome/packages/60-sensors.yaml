  - platform: template
    name: "Treadmill Incline"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 1s
    id: treadmill_incline_goal_sensor
    icon: "mdi:angle-acute"

    lambda: |-
      // 1. На паузе всегда 0.0
      if (id(pause_active)) {
