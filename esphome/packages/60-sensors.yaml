# Treadmill Speed (Goal) — целевая скорость, отображаемая на дисплее.
# При паузе показывает 0, при работе мотора — текущую цель.
  - platform: template
    name: "Treadmill Speed"
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    update_interval: 1s
    id: treadmill_speed_goal_sensor
    icon: "mdi:run"

    lambda: |-
      // 1. Во время паузы всегда показываем 0.0
      if (id(pause_active)) {
        return 0.0;
      }

      // 2. Если мотор работает — показываем целевую скорость
      if (id(motor_running)) {
        return id(target_speed_goal) / 10.0;
      }

      // 3. Если мотор выключен — тоже 0.0
      return 0.0;

    on_value:
      - lambda: |-
          static float last_sent = -100.0f;
          float current = id(treadmill_speed_goal_sensor).state;

          // Обновляем только при изменении ≥ 0.05 км/ч
          if (fabs(current - last_sent) >= 0.05f) {
            last_sent = current;

            // Обновляем Nextion только на странице скорости
            if (id(current_page) == 1) {
              char speed_str[10];
              sprintf(speed_str, "%.1f", current);
              id(display_nextion).set_component_text("t1", speed_str);
              ESP_LOGD("Nextion", "Отправка команды на дисплей - скорость");
            }

            // Синхронизация ползунка
            id(set_speed).publish_state(current);
          }
    filters:
      - delta: 0.05   # публиковать только если изменилась ≥ 0.05 км/ч (чтобы не спамить в логах)



# Treadmill Incline — отображает целевой наклон дорожки (%).
# Значение берётся из target_incline (деление на 10).
# Обновляется каждую секунду, на дисплей отправляется только при изменении ≥0.5%.
# Используется для отображения и синхронизации наклона на Nextion (t4).
