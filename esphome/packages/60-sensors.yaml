# Map ID — сенсор выбора маршрута с дисплея Nextion (переменная mapid).
# При изменении значения публикует в map_select название и длину выбранного маршрута.
# Используется для синхронизации выбора карты между Nextion и ESPHome.
  - platform: nextion
    name: "Map ID"
    id: map_id_sensor
    variable_name: "mapid"
    #update_interval: 1s
    entity_category: diagnostic
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            // 17.10: встроенные трассы убраны из прошивки — маршруты только «свои» (веб-UI, Custom route)
            (void) x;


# Brightness Slider — ползунок яркости с дисплея Nextion.
# Обновляется каждые 2 секунды, сохраняет значение в переменную brightness_level.
  - platform: nextion
    id: nextion_slider
    component_name: display.hbright
    entity_category: diagnostic
    name: "Brightness Slider"
    update_interval: 2s
    on_value:
      then:
        - lambda: |-
            id(brightness_level) = (int)x;

# My Raw Distance (VL53L1X) — лазерный дальномер ToF в режиме long.
# Публикует расстояние в мм, обновляется каждую секунду.
# Используется как источник данных для вычислений и отображения.
  - platform: vl53l1x
    distance_mode: long
    distance:
      entity_category: diagnostic
      name: My Raw Distance
      id: my_raw_distance
      unit_of_measurement: "mm" 
    # range_status:
    #   name: My Range Status
    #   id: my_range_status
    update_interval: 1s

# My Distance — шаблонный сенсор, переводит my_raw_distance из мм в см.
# Округляет до целого, обновляется раз в секунду (только при изменении ≥1 см).
# При каждом обновлении отправляет значение на дисплей Nextion.
# Если активна калибровка — обновляет min/max расстояния (0–150 см) и пишет в лог.
  - platform: template
    id: my_distance
    name: "My Distance"
    unit_of_measurement: "cm"
    state_class: "measurement"
    device_class: "distance"
    accuracy_decimals: 0
    lambda: |-
      return id(my_raw_distance).state / 10.0;
    update_interval: 1s
    on_value:
      then:
        - lambda: |-
            float distance = x;
            int position_value = (int)distance;

            // Обновление дисплея Nextion
            id(display_nextion).send_command_printf("position=%d", position_value);
            //ESP_LOGI("Nextion", "Sending command for position");
            //if (id(caldistspeed).state) {
              //id(display_nextion).send_command_printf("caldistspeed.ndist.val=%d", position_value);
              //ESP_LOGI("Nextion", "Sending command for caldistspeed.ndist.val");
            //}
            // Логика калибровки
            if (id(calibration_active)) {
              // Проверяем, что значение в разумном диапазоне (0–150 см)
              if (distance > 0.0 && distance < 150.0) {
                if (distance < id(calibration_min_distance)) {
                  id(calibration_min_distance) = distance;
                  ESP_LOGI("Calibration", "Новое минимальное расстояние: %.1f см", distance);
                }
                if (distance > id(calibration_max_distance)) {
                  id(calibration_max_distance) = distance;
                  ESP_LOGI("Calibration", "Новое максимальное расстояние: %.1f см", distance);
                }
              }
            }


# Сенсор температуры мотора (DS18B20 через Dallas)
# 1. Читает температуру с датчика по адресу из secrets.yaml.
# 2. Обновление каждые 5 секунд (update_interval: 5s).
# 3. Фильтр: игнорирует ложные нули (возвращает NAN, если x == 0.0).
# 4. При каждом обновлении:
#    - Если значение корректное:
#        * Преобразует температуру в целое число (°C).
#        * Отправляет её на дисплей Nextion:
#            - speed.ntemp (если активна страница скорости).
#            - motor.ntemp (если активна страница мотора).
#        * Обновление происходит только при изменении значения (чтобы не спамить дисплей).
#    - Контроль перегрева:
#        * Если включён режим контроля температуры (bt_tempmode) и мотор работает.
#        * При превышении 85°C:
#            - Логируется предупреждение.
#            - На дисплее переключается страница 24 (страница аварии).
#            - В program_status публикуется "Overheat Emergency Stop".
#            - Выполняется аварийная остановка дорожки (stop_program).
  - platform: template
    name: "Motor Temp Read Errors"
    id: temp_read_errors_sensor
    icon: "mdi:thermometer-alert"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: 'return id(temp_read_errors);'
  - platform: dallas_temp
    name: "Motor"
    id: temp
    force_update: false
    update_interval: 5s
    filters:
      - lambda: |-
          // A DS18B20 misses a read now and then (CRC / bus noise, ~1 per 40 min on some builds). One miss used to
          // make the value NAN and the overheat guard stop the belt at once. Keep the last good value for up to
          // N-1 misses in a row (N = "Motor Temp Fault Reads", default 3 ≈ 15 s); only N misses give NAN (12.10).
          static float last = NAN; static int bad = 0;
          if (isnan(x) || x == 0.0f) {   // 0.0 = false zero, as before
            bad++; id(temp_read_errors) += 1;
            float n = id(temp_fault_reads).state; int lim = isnan(n) || n < 1 ? 3 : (int) n;
            if (bad < lim && !isnan(last)) { ESP_LOGW("Overheat", "Motor temp read failed (%d/%d), keeping %.1f C", bad, lim, last); return last; }
            ESP_LOGE("Overheat", "Motor temp read failed %d times in a row", bad);
            return NAN;
          }
          bad = 0; last = x;
          return x;
    on_value:
      then:
        - lambda: |-
            float temp_value = id(temp).state;
            if (!isnan(temp_value)) {
              int tempmotor = (int)temp_value;

              static int last_sent_temp = -1000;
              if (tempmotor != last_sent_temp) {
                last_sent_temp = tempmotor;

                if (id(current_page) == 1) {
                  id(display_nextion).set_component_value("speed.ntemp", tempmotor);
                  ESP_LOGI("Nextion", "Setting value for speed.ntemp = %d", tempmotor);
                }
                if (id(current_page) == 10) {
                  id(display_nextion).set_component_value("motor.ntemp", tempmotor);
                  ESP_LOGI("Nextion", "Setting value for motor.ntemp = %d", tempmotor);
                }
              }
            }

# ------------------------------------------------------------
# Сенсор "Calories Burned"
# Логика работы:
# 1. Берём данные пользователя (вес, возраст, пол) и вычисляем
#    максимальный пульс по полу и возрасту.
# 2. Считаем средние значения за тренировку: скорость, наклон,
#    пульс, время.
# 3. Переводим скорость и наклон в параметры для формулы ACSM.
#    Она даёт VO₂ (потребление кислорода, мл/кг/мин).
# 4. VO₂ переводим в MET (метаболический эквивалент нагрузки).
# 5. Если пульс высокий (>70% от максимального), добавляем
#    поправку до +10% к MET.
# 6. MET × вес = расход энергии в ккал/час.
# 7. Умножаем на время тренировки → итоговые калории.
# 8. При паузе значение замирает, при остановке дорожки
#    сбрасывается в 0.
# ------------------------------------------------------------
  - platform: template
    name: "Calories Burned"
    id: total_calories
    unit_of_measurement: "kcal"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      // Калории копятся посекундно в 40-intervals (energy_kcal): ACSM по реальному
      // (откалиброванному) уклону, ходьба/бег, поправка по пульсу. Пауза — не растут.
      return id(energy_kcal);
# Average Heart Rate — средний пульс за тренировку.
# Считает сумму всех замеров и делит на их количество.
# Если замеров нет → возвращает 0. Используется для отображения средней нагрузки.
  - platform: template
    name: "Average Heart Rate"
    id: avg_heart_rate_sensor
    unit_of_measurement: "bpm"
    accuracy_decimals: 0
    lambda: |-
      return (id(heart_rate_count) > 0) ? (id(total_heart_rate_sum) / id(heart_rate_count)) : 0;


# Max Heart Rate — максимальный зафиксированный пульс.
# Берёт значение из глобальной переменной max_heart_rate_total.
# Используется для отображения пикового значения нагрузки.
  - platform: template
    name: "Max Heart Rate"
    id: max_heart_rate_sensor
    unit_of_measurement: "bpm"
    accuracy_decimals: 0
    lambda: |-
      return id(max_heart_rate_total);

# Age from Nextion — внутренний сенсор, читает возраст (n_age) с дисплея.
# При корректном значении (16–100 лет) обновляет number‑сенсор age_number.
# При некорректном вводе пишет предупреждение в лог.
  - platform: nextion
    nextion_id: display_nextion
    id: age_sensor
    name: "Age from Nextion"
    internal: true
    component_name: n_age  
    on_value:
      then:
        - lambda: |-
            int new_age = x; // Значение от number_sensor
            if (new_age >= 16 && new_age <= 100) {
              id(age_number).make_call().set_value(new_age).perform();
              //id(age_number).publish_state(new_age); 
              ESP_LOGI("Settings", "Age updated to: %d", new_age);
              //id(update_heart_rate_zones).execute(); // Обновляем зоны пульса
            } else {
              ESP_LOGW("Settings", "Invalid age value: %d", new_age);
            }          


# Weight from Nextion — внутренний сенсор, читает n_weight с дисплея.
# При корректном значении (40–100 кг) обновляет weight_kg, иначе пишет предупреждение.
# Используется для учёта веса в расчётах (калории, MET и т.д.).
  - platform: nextion
    nextion_id: display_nextion
    id: weight_sensor
    name: "Weight from Nextion"
    internal: true
    component_name: n_weight  
    on_value:
      then:
        - lambda: |-
            int new_weight = x; // Значение от Nextion
            if (new_weight >= 40 && new_weight <= 100) {
              id(weight_kg).make_call().set_value(new_weight).perform();
              //id(weight_kg).publish_state(new_weight);
              ESP_LOGI("Settings", "Weight updated to: %d kg", new_weight);
            } else {
              ESP_LOGW("Settings", "Invalid weight value: %d kg", new_weight);
            }


# Time from Nextion — внутренний сенсор, читает n_min (заданное время тренировки).
# При корректном значении (1–999 мин) обновляет set_run_time, иначе пишет предупреждение.
# Используется для задания длительности тренировки через интерфейс Nextion.
  - platform: nextion
    nextion_id: display_nextion
    id: time_sensor
    name: "time from Nextion"
    internal: true
    component_name: n_min  
    on_value:
      then:
        - lambda: |-
            int new_time = x; // Значение от number_sensor
            if (new_time >= 1 && new_time <= 999) {
              //id(set_run_time).publish_state(new_time);
              id(set_run_time).make_call().set_value(new_time).perform();
              ESP_LOGI("Settings", "Age updated to: %d", new_time);
              //id(update_heart_rate_zones).execute(); // Обновляем зоны пульса
            } else {
              ESP_LOGW("Settings", "Invalid age value: %d", new_time);
            }    

# Time Warm from Nextion — внутренний сенсор, читает n_warm (разминка).
# При корректном значении (0–10 мин) обновляет set_warm_up_time, иначе пишет предупреждение.
# Используется для задания длительности разминки.
  - platform: nextion
    nextion_id: display_nextion
    id: warm_sensor
    name: "time warm from Nextion"
    internal: true
    component_name: n_warm
    on_value:
      then:
        - lambda: |-
            int new_time_warm = x; // Значение от number_sensor
            if (new_time_warm >= 0 && new_time_warm <= 10) {
              //id(set_warm_up_time).publish_state(new_time_warm);
              id(set_warm_up_time).make_call().set_value(new_time_warm).perform();
              ESP_LOGI("Settings", "Age updated to: %d", new_time_warm);
              //id(update_heart_rate_zones).execute(); // Обновляем зоны пульса
            } else {
              ESP_LOGW("Settings", "Invalid age value: %d", new_time_warm);
            }    

# Time Cool from Nextion — внутренний сенсор, читает n_cool (заминка).
# При корректном значении (0–10 мин) обновляет set_cool_down_time, иначе пишет предупреждение.
# Используется для задания длительности заминки.
  - platform: nextion
    nextion_id: display_nextion
    id: cool_sensor
    name: "time cool from Nextion"
