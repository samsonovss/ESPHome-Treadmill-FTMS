              id(set_cool_down_time).make_call().set_value(new_time_cool).perform();
              ESP_LOGI("Settings", "Age updated to: %d", new_time_cool);
              //id(update_heart_rate_zones).execute(); // Обновляем зоны пульса
            } else {
              ESP_LOGW("Settings", "Invalid age value: %d", new_time_cool);
            }    

# Treadmill Speed Feedback — обратная связь по скорости от мотора (UART), км/ч.
# Делит значение на 10, обновляется каждые 1.2 секунды, категория diagnostic.
  - platform: template
    name: "Treadmill Speed Feedback"
    id: treadmill_speed_feedback_sensor
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    update_interval: 1s
    entity_category: diagnostic
    icon: "mdi:run"
    lambda: |-
      // the board does not report 0 after a stop: show 0 while the motor is off
      if (!id(motor_running)) return 0.0;
      return id(treadmill_speed_feedback) / 10.0;

# Treadmill Incline Feedback — обратная связь по наклону от мотора (UART), %.
# Делит значение на 10, обновляется каждые 1.1 секунды, категория diagnostic.
  - platform: template
    name: "Treadmill Incline Feedback"
    id: treadmill_incline_feedback_sensor
    unit_of_measurement: "%"
    accuracy_decimals: 1  # tenths: motor-format tests (10.10)
    entity_category: diagnostic
    update_interval: 1s
    icon: "mdi:angle-acute"
    lambda: |-
      return id(treadmill_incline_feedback) / 10.0;


