# Treadmill Time — считает длительность тренировки в минутах.
# При остановке мотора таймер сбрасывается, при работе — идёт подсчёт от момента старта.
# Обновляется каждую секунду, точность до сотых.
# Дополнительно переводит время в формат ММ:СС и отправляет на дисплей (t3).
  - platform: template
    name: "Treadmill Time"
    id: treadmill_time_sec
    lambda: |-
      uint32_t now = millis();
      static uint32_t elapsed_ms = 0;

      if (!id(motor_running) && !id(pause_active)) {
        elapsed_ms = 0;
        id(treadmill_time_last) = 0;
        return 0;
      }

      if (id(motor_running) && !id(pause_active)) {
        if (id(treadmill_time_last) != 0) {
          uint32_t diff = now - id(treadmill_time_last);
          elapsed_ms += diff;   // накапливаем миллисекунды
        }
      }

      id(treadmill_time_last) = now;

      return elapsed_ms / 1000;  // наружу — секунды
    update_interval: 1s
    unit_of_measurement: "s"
    accuracy_decimals: 0
    icon: "mdi:timer-play-outline"
    on_value:
      - component.update: total_calories
      - lambda: |-
          int total = (int)x;
          int hours = total / 3600;
          int minutes = (total % 3600) / 60;
          int seconds = total % 60;

          char buffer[9];
          sprintf(buffer, "%02d:%02d:%02d", hours, minutes, seconds);
          //id(treadmill_time_formatted).publish_state(buffer);

          if ((id(motor_running) || id(pause_active)) && (id(current_page) == 1)) {
            int total_minutes = total / 60;
            char time_str[8];
            snprintf(time_str, sizeof(time_str), "%02d:%02d", total_minutes, seconds);
            id(display_nextion).set_component_text("t3", time_str);
          }
    filters:
      - delta: 0.05   # публиковать только если изменилась ≥ 0.05 (чтобы не спамить в логах)


# Treadmill Distance — расчёт пройденной дистанции.
# При выключенном моторе сбрасывается, при паузе замирает,
# при работе мотора накапливается каждую секунду (км/ч → км/сек).
# Значение хранится во внутренней переменной, обновляется раз в секунду
# и отправляется на дисплей Nextion (t2).
  - platform: template
    name: "Treadmill Distance"
    id: treadmill_distance_km
    lambda: |-
      static float current_distance_km = 0.0;

      // Если пауза активна — дистанция замирает
      if (id(pause_active)) {
        return current_distance_km;
      }

      // Если мотор выключен (и не пауза) — сбрасываем дистанцию
      if (!id(motor_running)) {
        current_distance_km = 0.0;
        return current_distance_km;
      }

      // При работающем моторе и без паузы считаем дистанцию
      float speed_kph = id(target_speed) / 10.0;
      float distance_increment_km = speed_kph / 3600.0;  // км/ч → км/сек
      current_distance_km += distance_increment_km;

      return current_distance_km;
    on_value:
      - lambda: |-
          if (id(current_page) == 1) {
            char distance_str[10];
            sprintf(distance_str, "%.2f", id(treadmill_distance_km).state);
            id(display_nextion).set_component_text("t2", distance_str);
          }
    unit_of_measurement: "km"
    accuracy_decimals: 2
    update_interval: 1s
    icon: "mdi:map-marker-distance"
    state_class: measurement
    filters:
      - delta: 0.01   # публиковать только если изменилась ≥ 0.05 км/ч (чтобы не спамить в логах)

# Raw Treadmill Data — счётчик импульсов энкодера (GPIO16).
# Считает фронты (rising_edge), фильтр 13 мкс от дребезга.
# Публикует частоту импульсов (pulses/s) каждые 250 мс.
# Используется как источник для расчёта скорости.
  - platform: pulse_counter
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
    name: "Raw Treadmill Data"
    id: treadmill_raw_data
    unit_of_measurement: "pulses/s"
    accuracy_decimals: 0
    update_interval: 250ms
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    internal_filter: 13us
    entity_category: diagnostic
    filters:
     # Публикуем только при изменении значения на 1 импульс.
     # Это убирает дубли "0 pulses/s" в логе, при стоящей дорожке
     # значение публикуется только один раз (пока не изменится).
     - delta: 1


# Treadmill Speed Motor — фактическая скорость по данным энкодера.
# Рассчитывается из частоты импульсов с учётом окружности вала и редуктора.
# Если импульсов нет → после 2 циклов treadmill_running = false, скорость = 0.
# Если есть импульсы → treadmill_running = true, скорость пересчитывается.
# Обновляется каждую секунду, используется для отображения реальной скорости.
  - platform: template
    name: "Treadmill Speed Motor"
    id: treadmill_speed_actual
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    lambda: |-
      float rc = id(roller_circumference);
      float pulses_per_rotation = 144.0;
      float gr_r = id(gear_ratio);
      float raw_pulses = id(treadmill_raw_data).state;
      if (raw_pulses == 0.0) {
        if (id(treadmill_running)) {
          id(run_stopped_timer)++;
          if (id(run_stopped_timer) >= 2) {
            id(treadmill_running) = false;
          }
        }
        return 0.0;
      }
      float speed_kph = (raw_pulses / pulses_per_rotation / gr_r) * rc * 3.6;
      id(treadmill_running) = true;
      id(run_stopped_timer) = 0;
      return speed_kph;
    update_interval: 1s
    icon: "mdi:run"
    filters:
      - delta: 0.05   # публиковать только если изменилась ≥ 0.05 (чтобы не спамить в логах)
    # filters:
    #   - exponential_moving_average:
    #       alpha: 0.25
    #       send_every: 1


# Датчик пульса по BLE (GATT characteristic 0x2A37, Heart Rate Measurement)
# 1. Получает данные о пульсе с фитнес-браслета через BLE.
# 2. Если устройство не подключено — сбрасывает отображение на дисплее (серый значок, "-").
# 3. При получении значения:
#    - Определяет текущую зону пульса на основе max_heart_rate:
#        Зона 0: ниже 50% HRmax
#        Зона 1: 50–60% HRmax
#        Зона 2: 60–70% HRmax
#        Зона 3: 70–80% HRmax
#        Зона 4: 80–90% HRmax
#        Зона 5: ≥90% HRmax
#    - Сохраняет номер зоны в переменную current_zone.
#    - Подбирает картинку и цветовую заливку для дисплея Nextion в зависимости от зоны.
#    - Обновляет текст (ЧСС) и иконку только при изменении, чтобы не перегружать дисплей.
  - platform: ble_client
    type: characteristic
    ble_client_id: fit_smart
    name: "Heart Rate"
    id: heart_rate_sensor
    service_uuid: "180d"
    characteristic_uuid: "2a37"
    notify: true
    update_interval: never
    lambda: |-
      if (!id(fit_smart).connected() || x.size() < 2) {
        return NAN; 
      }

      uint8_t flags = x[0];
      uint16_t heart_rate = x[1];
      if (flags & 0x01) {
        heart_rate = (x[2] << 8) | x[1]; // 16-битное значение
      }
      return (float)heart_rate;
    unit_of_measurement: "bpm"
    icon: "mdi:heart-pulse"
    on_value:
      - lambda: |-
          static int last_heart_rate = -1;  // кэш текста
          static int last_zone = -1;        // кэш зоны

          int hr = (int)x;
          if (isnan(x)) {
            if (id(current_page) == 1) {        
              id(display_nextion).send_command_printf("p0.pic=%d;t0.txt=\"-\";t0.bco=%d", 7, 14792);
              ESP_LOGI("Nextion", "BLE disconnected, reset HR display");
            }
            return;
          }

          // зоны
          float max_hr = id(max_heart_rate);
          float min_zone_1 = max_hr * 0.50;
          float max_zone_1 = max_hr * 0.60;
          float max_zone_2 = max_hr * 0.70;
          float max_zone_3 = max_hr * 0.80;
          float max_zone_4 = max_hr * 0.90;

          int heart_rate_zone = 0;
          if (hr < min_zone_1) heart_rate_zone = 0;
          else if (hr < max_zone_1) heart_rate_zone = 1;
          else if (hr < max_zone_2) heart_rate_zone = 2;
          else if (hr < max_zone_3) heart_rate_zone = 3;
          else if (hr < max_zone_4) heart_rate_zone = 4;
          else heart_rate_zone = 5;

          id(current_zone) = heart_rate_zone;

          // обновляем текст пульса всегда при изменении
          if (id(current_page) == 1 && hr != last_heart_rate) {
            id(display_nextion).send_command_printf("t0.txt=\"%d\"", hr);
            ESP_LOGI("Nextion", "Update HR text: %d", hr);
            last_heart_rate = hr;
          }

          // картинка и фон — при смене зоны ИЛИ
          if ((id(current_page) == 1) && heart_rate_zone != last_zone) {
            uint16_t picture_ids[] = {7, 2, 3, 4, 5, 6};
            uint16_t colors[]      = {14792, 15487, 11744, 64992, 64294, 63688};

            uint16_t picture_id = picture_ids[heart_rate_zone];
            uint16_t t0_bco     = colors[heart_rate_zone];

            id(display_nextion).send_command_printf("p0.pic=%d", picture_id);
            id(display_nextion).send_command_printf("t0.bco=%d", t0_bco);

            ESP_LOGI("Nextion", "Update HR zone: %d", heart_rate_zone);
            last_zone = heart_rate_zone;
          }

# Battery Level (BLE) — уровень заряда устройства fit_smart.
# Читает характеристику 0x2A19 из сервиса 0x180F через ble_client.
# Работает по уведомлениям (notify), без активного опроса.
# Если устройство не подключено или данные пустые → возвращает 0.0.
# Значение в процентах (%), отображается иконкой батареи.
  - platform: ble_client
    type: characteristic
    ble_client_id: fit_smart
    name: "Battery Level"
    id: battery_level_sensor
    service_uuid: "180F"
    characteristic_uuid: "2A19"
    notify: true
    update_interval: never  # Отключаем активный опрос
    lambda: |-
      if (!id(fit_smart).connected()) {
        return 0.0;  // Изменено с NAN на 0.0
      }
      if (x.size() < 1) return 0.0;  // Изменено с NAN на 0.0
      uint8_t battery_level = x[0];
      return (float)battery_level;
    unit_of_measurement: "%"
    icon: "mdi:battery"


# esp32_ble_tracker — включает активное сканирование BLE‑устройств.
# При необходимости можно задать параметры интервала и окна (закомментированы).
