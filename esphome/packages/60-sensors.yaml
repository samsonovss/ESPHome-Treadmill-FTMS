# Сенсоры
sensor:
  # 13.10: км, пройденные до конца разминки маршрута (веб вычитает их из позиции на трассе)
  - platform: template
    name: "Route Km Offset"
    id: route_km_offset_sensor
    unit_of_measurement: "km"
    accuracy_decimals: 3
    update_interval: never

  # === BEGIN EXPERIMENTAL_KICKR_RUN ===
  # Zwift Requested Incline — исходный реальный градиент трассы, который
  # присылает Zwift через фирменную характеристику KICKR RUN.
  # Значение может быть отрицательным на спуске.
  # Для удаления эксперимента удалить все блоки с меткой EXPERIMENTAL_KICKR_RUN.
  - platform: template
    name: "Zwift Requested Incline"
    id: zwift_requested_incline
    unit_of_measurement: "%"
    accuracy_decimals: 2
    icon: "mdi:slope-uphill"
    update_interval: never

  # Zwift Mapped Treadmill Incline — рассчитанный уровень дорожки после
  # применения калибровки и интенсивности. Это значение показывает, какую
  # цель автоматика установит на дорожке; при выключенной автоматике сенсор
  # продолжает считать и показывать результат, но мотором не управляет.
  - platform: template
    name: "Zwift Mapped Treadmill Incline"
    id: zwift_mapped_incline
    unit_of_measurement: "level"
    accuracy_decimals: 1
    icon: "mdi:angle-acute"
    update_interval: never
  # === END EXPERIMENTAL_KICKR_RUN ===

  - platform: debug
    free:
      name: "Heap Free"            #    - Heap Free — свободная оперативная память (байты).
    block:
      name: "Heap Max Block"       #    - Heap Max Block — максимальный непрерывный блок памяти (байты).
    loop_time:
      name: "Loop Time"            #    - Loop Time — время выполнения основного цикла (мс).
    psram:
      name: "Free PSRAM"           #    - Free PSRAM — свободная внешняя PSRAM (если доступна).
    cpu_frequency:
      name: "CPU Frequency"        #    - CPU Frequency — текущая частота процессора (МГц).

