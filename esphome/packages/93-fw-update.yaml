# Firmware self-update from GitHub releases (one click in the web UI).
# manifest.json lives in the fixed release "fw-manifest" and is refreshed by tools/fw-release.sh.
http_request:
  id: fw_http
  verify_ssl: true
  timeout: 20s
  follow_redirects: true
  redirect_limit: 5
  buffer_size_rx: 4096  # GitHub redirects to a long signed URL
  buffer_size_tx: 1024

ota:
  - platform: http_request
    id: fw_ota
    # Same as the ESPHome OTA: Bluetooth off during the download.
    on_begin:
      - logger.log: "OTA(http): Bluetooth off for the update"
      - ble.disable:
    on_error:
      - ble.enable:

update:
  - platform: http_request
    id: fw_update
    name: "Firmware Update"
    source: https://github.com/samsonovss/ESPHome-Treadmill-FTMS/releases/download/fw-manifest/manifest.json
    update_interval: 6h

# Web UI "Check" button: ESPHome REST has no /check for update entities, so expose a button.
button:
  - platform: template
    name: "Check Firmware Update"
    on_press:
      - component.update: fw_update
