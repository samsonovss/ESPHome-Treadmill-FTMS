  # RSC Measurement для Zwift Companion.
  # Передаёт заданную скорость раз в секунду, чтобы показания не прыгали
  # вслед за шумом обратной связи FC-33.
  - interval: 1s
    id: rsc_measurement_interval
    then:
      - lambda: |-
          if (!id(ble_client_connected))
            return;

          float speed_kph = id(target_speed_goal) / 10.0f;
          if (speed_kph < 0.0f)
            speed_kph = 0.0f;

          uint16_t speed_raw =
              static_cast<uint16_t>(lroundf((speed_kph / 3.6f) * 256.0f));
          float distance_km = id(treadmill_distance_km).state;
          if (isnan(distance_km) || distance_km < 0.0f)
            distance_km = 0.0f;
          uint32_t distance_raw =
              static_cast<uint32_t>(lroundf(distance_km * 10000.0f));

          // RSC Measurement includes total distance.
          id(rsc_measurement_char).set_value({
              0x02,
              static_cast<uint8_t>(speed_raw & 0xFF),
              static_cast<uint8_t>((speed_raw >> 8) & 0xFF),
              0x00,
              static_cast<uint8_t>(distance_raw & 0xFF),
              static_cast<uint8_t>((distance_raw >> 8) & 0xFF),
              static_cast<uint8_t>((distance_raw >> 16) & 0xFF),
              static_cast<uint8_t>((distance_raw >> 24) & 0xFF)
          });
          id(rsc_measurement_char).notify();

          // Indoor Bike Data is also emitted for Zwift's treadmill incline
          // compatibility path.
          uint16_t speed_hundredths =
              static_cast<uint16_t>(lroundf(speed_kph * 100.0f));
          int heart_rate_value = isnan(id(heart_rate_sensor).state)
                                     ? 0
                                     : static_cast<int>(
                                           lroundf(id(heart_rate_sensor).state));
          if (heart_rate_value < 0)
            heart_rate_value = 0;
          if (heart_rate_value > 255)
            heart_rate_value = 255;
          uint8_t heart_rate = static_cast<uint8_t>(heart_rate_value);
          id(indoor_bike_data_char).set_value({
              0x64, 0x02,
              static_cast<uint8_t>(speed_hundredths & 0xFF),
              static_cast<uint8_t>((speed_hundredths >> 8) & 0xFF),
              0x00, 0x00,  // cadence
              0x00, 0x00,  // resistance
              0x00, 0x00,  // instantaneous power
              heart_rate,
              0x00
          });
          id(indoor_bike_data_char).notify();


