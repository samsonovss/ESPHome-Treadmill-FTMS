    then:
      - lambda: |-
          // Хелпер для отправки текста на Nextion
          auto send_txt = [&](const char* component, const char* fmt, auto value) {
            char buf[20];
            snprintf(buf, sizeof(buf), fmt, value);
            id(display_nextion).send_command_printf("%s.txt=\"%s\"", component, buf);
          };

          // --- Зоны ---
          int zones[5] = {
            std::max(0, id(zone1_time_stored)),
            std::max(0, id(zone2_time_stored)),
            std::max(0, id(zone3_time_stored)),
            std::max(0, id(zone4_time_stored)),
            std::max(0, id(zone5_time_stored))
          };

          int total_zone_time = 0;
          for (int i = 0; i < 5; i++) total_zone_time += zones[i];

          for (int i = 0; i < 5; i++) {
            int percent = total_zone_time > 0 ? (zones[i] * 100) / total_zone_time : 0;
            id(display_nextion).send_command_printf("info.j%d.val=%d", i, percent);

            char buf[10];
            snprintf(buf, sizeof(buf), "%d:%02d", zones[i] / 60, zones[i] % 60);
            id(display_nextion).send_command_printf("info.t%d.txt=\"%s\"", i, buf);
          }

          // --- Общее время ---
          int total_minutes = (int)id(last_time_stored) / 60;
          int total_seconds = (int)id(last_time_stored) % 60;
          char duration[10];
          snprintf(duration, sizeof(duration), "%02d:%02d", total_minutes, total_seconds);
          id(display_nextion).send_command_printf("info.t5.txt=\"%s\"", duration);

          // --- Остальные значения для info ---
          send_txt("info.t6", "%.2f", id(last_distance_stored));
          send_txt("info.t7", "%.0f", id(last_calories_stored));
          send_txt("info.t8", "%.0f", id(avg_heart_rate_stored));
          send_txt("info.t9", "%.0f", id(max_heart_rate_stored));

          // --- avgsummary ---
          const char* avg_components[10] = {
            "avgsummary.t0","avgsummary.t1","avgsummary.t2","avgsummary.t3",
            "avgsummary.t4","avgsummary.t5","avgsummary.t6","avgsummary.t7",
            "avgsummary.t8","avgsummary.t9"
          };

          char values[10][30];

          snprintf(values[0], sizeof(values[0]), "%s", duration);
          snprintf(values[1], sizeof(values[1]), "%.2f", id(last_distance_stored));
          snprintf(values[2], sizeof(values[2]), "%.1f", id(avg_speed_stored));
          snprintf(values[3], sizeof(values[3]), "%.1f", id(avg_incline_stored));
          snprintf(values[4], sizeof(values[4]), "%.2f", id(avg_met_stored));       // MET из глобала
          snprintf(values[5], sizeof(values[5]), "%.1f", id(avg_vo2_stored));       // VO2 из глобала
          snprintf(values[6], sizeof(values[6]), "%.0f", id(last_calories_stored));
          snprintf(values[7], sizeof(values[7]), "%.1f", id(fat_grams_stored));     // жир из глобала
          snprintf(values[8], sizeof(values[8]), "%s %.0f, %.0fkg",
                  id(gender_select).current_option().c_str(),
                  id(age_number).state,
                  id(weight_kg).state);
          snprintf(values[9], sizeof(values[9]), "%.0f", id(avg_heart_rate_stored));

          for (int i = 0; i < 10; i++) {
            id(display_nextion).send_command_printf("%s.txt=\"%s\"", avg_components[i], values[i]);
          }


# log_workout_summary — скрипт формирования и вывода в лог детального текстового отчёта о завершённой тренировке.
# 
# Логика работы:
# 1. Подготовка базовых данных:
#    - Пол, возраст, вес пользователя.
#    - Максимальный пульс (HRmax), общее время, дистанция, калории, средние показатели.
# 2. Форматирование времени по пульсовым зонам (Z1–Z5) в «мм:сс».
# 3. Формирование красивого многострочного отчёта в строку combined_log:
#    - Заголовок и «шапка» с данными пользователя.
#    - Основные показатели: длительность, дистанция, калории, сожжённый жир, средняя скорость, наклон.
#    - Новые показатели: средние VO₂ и MET (берутся из заранее рассчитанных глобальных переменных avg_vo2_stored и avg_met_stored).
#    - Средний темп (pace), если он > 0.
#    - Средний и максимальный пульс.
#    - Время в каждой пульсовой зоне.
#    - Закрывающий блок.
# 4. Вывод всего отчёта одним сообщением через ESP_LOGI (тег "WorkoutSummary").
# 
# Важные уточнения:
# • Расчёт VO₂ и MET **не выполняется** в этом скрипте
# • Расчёт сожжённого жира (fat_grams_stored) также происходит **до** вызова этого скрипта.
# • Скрипт предназначен исключительно для логирования — он ничего не отправляет на дисплей Nextion.
# 
# Вызывается обычно в конце stop_program или finish_workout.
  - id: log_workout_summary
    then:
      - lambda: |-
          std::string combined_log;
          char buffer[256];

          // Форматируем зоны
          char zone1_str[10], zone2_str[10], zone3_str[10], zone4_str[10], zone5_str[10];
          snprintf(zone1_str, sizeof(zone1_str), "%d:%02d", id(zone1_time_stored)/60, id(zone1_time_stored)%60);
          snprintf(zone2_str, sizeof(zone2_str), "%d:%02d", id(zone2_time_stored)/60, id(zone2_time_stored)%60);
          snprintf(zone3_str, sizeof(zone3_str), "%d:%02d", id(zone3_time_stored)/60, id(zone3_time_stored)%60);
          snprintf(zone4_str, sizeof(zone4_str), "%d:%02d", id(zone4_time_stored)/60, id(zone4_time_stored)%60);
          snprintf(zone5_str, sizeof(zone5_str), "%d:%02d", id(zone5_time_stored)/60, id(zone5_time_stored)%60);

          // Форматируем время
          int minutes = (int)id(last_time_stored) / 60;
          int seconds = (int)id(last_time_stored) % 60;

          combined_log += "===== Workout Summary =====\n";

          snprintf(buffer, sizeof(buffer),
                  "  User: Gender=%s, Age=%.0f, Weight=%.1f kg, Max HR=%.0f bpm\n",
                  id(gender_select).current_option().c_str(),
                  id(age_number).state,
                  id(weight_kg).state,
                  id(max_heart_rate_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer), "  Duration: %02d:%02d (%.0f sec)\n",
                  minutes, seconds, id(last_time_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer), "  Distance: %.2f km\n", id(last_distance_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer), "  Calories: %d kcal\n", (int)id(last_calories_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer), "  Fat Burned: %.1f g\n", id(fat_grams_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer), "  Avg Speed: %.2f km/h\n", id(avg_speed_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer), "  Avg Incline: %.2f%%\n", id(avg_incline_stored));
          combined_log += buffer;

          // --- Новые показатели ---
          snprintf(buffer, sizeof(buffer), "  Avg VO2: %.1f ml/kg/min\n", id(avg_vo2_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer), "  Avg MET: %.2f\n", id(avg_met_stored));
          combined_log += buffer;

          if (id(avg_pace_stored) > 0) {
            int pace_min_int = (int)id(avg_pace_stored);
            int pace_sec_int = (int)((id(avg_pace_stored) - pace_min_int) * 60);
            snprintf(buffer, sizeof(buffer), "  Avg Pace: %d:%02d min/km\n", pace_min_int, pace_sec_int);
            combined_log += buffer;
          }

          snprintf(buffer, sizeof(buffer), "  Avg HR: %.0f bpm\n", id(avg_heart_rate_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer), "  Max HR: %.0f bpm\n", id(max_heart_rate_stored));
          combined_log += buffer;

          snprintf(buffer, sizeof(buffer),
                  "  HR Zones: Z1=%s, Z2=%s, Z3=%s, Z4=%s, Z5=%s\n",
                  zone1_str, zone2_str, zone3_str, zone4_str, zone5_str);
          combined_log += buffer;

          combined_log += "===== End of Summary =====\n";

          ESP_LOGI("WorkoutSummary", "%s", combined_log.c_str());


# update_incline_by_map — скрипт обновления наклона по выбранной карте маршрута.
# Логика работы:
# 1. Определение доступных карт:
#    - Каждая карта описана структурой Map2D: имя, массив точек (дистанция–наклон), длина массива.
#    - В массив maps занесены профили реальных маршрутов (Россия, Zwift и др.).
# 2. Получение текущего состояния:
#    - selected = выбранная карта (map_select).
#    - cur_km = текущая дистанция (treadmill_distance_km).
# 3. Поиск карты:
#    - Перебирает все карты и ищет совпадение по имени.
#    - Если карта найдена:
#        a) Проверяет конец маршрута:
#           * Если текущая дистанция ≥ последней точки → наклон сбрасывается в 0%, выполняется stop_program.
#        b) Определяет целевой наклон:
#           * По умолчанию берётся первая точка.
#           * Проходит по массиву точек и выбирает последнюю, не превышающую текущую дистанцию.
#        c) Ограничивает наклон:
#           * Минимум 0.0%, максимум 15.0%.
#        d) Применяет наклон:
#           * Если новое значение отличается от текущего более чем на 0.01 → публикует новое значение set_incline.
#           * Логирует изменение (дистанция → наклон).
#    - Если карта не найдена → пишет в лог debug-сообщение.
# 4. В результате наклон дорожки динамически меняется в зависимости от текущей дистанции и профиля выбранного маршрута.
  - id: update_incline_by_map
    then:
      - lambda: |-
          struct Map2D { const char* name; const float (*arr)[2]; int len; };
          Map2D maps[] = {
            {"Russia, Ufa 3.4km", incline_profile_map_russia_ufa3_4km_2d, 114},
            {"Russia, Ufa Sipailovo 4.4km", incline_profile_map_sipailovo_circle_4_37km_2d, 146},
            {"Russia, Ufa Kashkadan 1.7km", incline_profile_map_sipailovo_Kashkadan_1_72km_2d, 58},
            {"Zwift Epic Run 6.2km", incline_profile_Epic_Run_6_2km, 149},
            {"Zwift 5K loop 5.0km", incline_profile_5K_loop_5_0km, 67},
            {"Zwift Mountain Mash 5.9km", incline_profile_Mountain_Mash_5_9km, 106},
            {"Zwift Chili Pepper 8.0km", incline_profile_Chili_Pepper_8_0km, 156},
            {"Zwift Hilly Route Reverse Run 9.2km", incline_profile_Hilly_Route_Reverse_Run_9_2km, 225},
            {"Zwift Ocean Blvd 11.2km", incline_profile_11_1_Ocean_Blvd_11_2km, 121},
            {"Zwift Beach Island Loop 12.8km", incline_profile_Beach_Island_Loop_12_8km, 125},
            {"Zwift Jon’s Route 12.6km", incline_profile_Jons_Route_12_6km, 135},
          };
          const int map_count = sizeof(maps) / sizeof(maps[0]);

          const char* selected = id(map_select).current_option().c_str();
          float cur_km = id(treadmill_distance_km).state;

          for (int m = 0; m < map_count; m++) {
            if (strcmp(selected, maps[m].name) == 0) {
              float last_dist = maps[m].arr[maps[m].len - 1][0];
              if (cur_km >= last_dist) {
                id(set_incline).publish_state(0.0);
                ESP_LOGI("InclineMap", "Map '%s' end reached (%.3f km >= %.3f km)", selected, cur_km, last_dist);
                id(stop_program).execute();
                return;
              }

              float target_inc = maps[m].arr[0][1]; // по умолчанию — первая точка
              for (int i = 0; i < maps[m].len; i++) {
                if (cur_km >= maps[m].arr[i][0]) {
                  target_inc = maps[m].arr[i][1];
                } else {
                  break; // нашли первую точку дальше текущей дистанции
                }
              }

              // защита от выхода за пределы
              if (target_inc < 0.0) target_inc = 0.0;
              if (target_inc > 15.0) target_inc = 15.0;

              // меняем только если реально изменилось
              if (fabs(id(set_incline).state - target_inc) > 0.01) {
                id(set_incline).publish_state(target_inc);
                ESP_LOGI("InclineMap", "Map '%s' dist=%.3f km -> incline=%.2f%%", selected, cur_km, target_inc);
              }
              return;
            }
          }
          ESP_LOGD("InclineMap", "Map '%s' not found", selected);


# free_running_mode — инициализация режима свободного бега.
# Логика работы:
# 1. Проверяет, что режим ещё не активен (free_running_active=false).
# 2. Включает мотор, сбрасывает manual_stop, отключает auto_mode.
# 3. Сохраняет текущее расстояние от датчика как целевое и сглаженное.
#    - Если датчик вернул ошибку (NaN) → режим не запускается, выполняется stop_program.
# 4. Если цель скорости ещё не задана → устанавливает минимальную (1.0 км/ч).
# 5. Обновляет статус программы ("Free Running Mode").
# 6. Отправляет FTMS‑уведомление: Started or Resumed (0x04).
# 7. При повторном запуске, если режим уже активен → пишет предупреждение в лог.
  - id: free_running_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(bt_tempmode_state) &&
                     (id(overheat_lockout) ||
                      isnan(id(temp).state) ||
                      id(temp).state >= id(overheat_stop_temperature).state);
          then:
            - lambda: |-
                ESP_LOGW("Overheat", "Free Running start blocked by overheat protection");
                id(program_status).publish_state("Start blocked: Overheat");
                id(free_running_active) = false;
                id(free_running_mode_switch).turn_off();
                id(display_nextion).send_command_printf("page 24");
            - script.stop: free_running_mode
      - if:
          condition:
            lambda: |-
              return !id(free_running_active);
          then:
            - lambda: |-
                id(free_running_active) = true;
                id(auto_mode) = false;
                id(motor_running) = true;
                id(manual_stop) = false;
                ESP_LOGI("FreeRunning", "Режим свободного бега запущен");
                float distance_cm = id(my_distance).state; // Используем my_distance (в сантиметрах)
                if (!isnan(distance_cm)) {
                  id(target_distance) = distance_cm; // Целевое расстояние в см
                  id(smoothed_distance) = distance_cm; // Сглаженное расстояние в см
                  //id(display_nextion).set_component_text("speed.tstatus", "Середина");
                  ESP_LOGI("FreeRunning", "Начальная позиция: %.0f см", id(target_distance));
                } else {
                  ESP_LOGW("FreeRunning", "Ошибка датчика расстояния, запуск невозможен");
                  //id(display_nextion).set_component_text("speed.tstatus", "Sensor Error");
                  id(free_running_active) = false;
                  id(free_running_mode_switch).turn_off();
                  id(stop_program).execute();
                  return;
                }
                if (id(target_speed_goal) == 0) {
                    id(target_speed_goal) = 10; // 1.0 км/ч
                    id(set_speed).publish_state(1.0);
                    ESP_LOGI("FreeRunning", "Начальная скорость: 1.0 км/ч");
                }
                id(program_status).publish_state("Free Running Mode");
                //id(display_nextion).send_command("page 1");
                ESP_LOGI("Nextion", "Переключение на страницу 1");
                
                // Уведомление FTMS: Started or Resumed (0x04)
                id(ftms_status_char).set_value({0x04});
                id(ftms_status_char).notify();
                id(last_ftms_status) = {0x04};
                id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x04));
                ESP_LOGI("FTMS", "Режим свободного бега: запущен (0x04)");
          else:
            - lambda: |-
                ESP_LOGW("FreeRunning", "Попытка повторного запуска, игнорируется");




# free_running_logic — основная логика работы режима свободного бега.
# Логика работы:
# 1. Проверяет, что режим активен и переключатель включён.
#    - Если нет → выключает режим и сбрасывает флаги.
# 2. Сглаживает показания датчика расстояния:
#    - Для движения назад фильтр быстрее (0.5/0.5).
#    - Для движения вперёд фильтр мягче (0.3/0.7).
# 3. Делит дорожку на зоны:
#    - Передняя зона (in_front) → ускорение (+шаг скорости каждые ≥1 сек).
#    - Задняя зона (in_back) → замедление (первый шаг сразу, далее каждые ≥1 сек).
#    - Средняя зона → удержание скорости, сброс таймера.
# 4. Шаг изменения скорости задаётся параметром free_run_step (например, 0.1–0.5 км/ч).
# 5. Ограничивает скорость в диапазоне 0.6–18.0 км/ч (6–180 в целых значениях).
# 6. При изменении цели обновляет target_speed_goal и публикует новое значение set_speed.
  - id: free_running_logic
    mode: single
    then:
      - lambda: |-
          if (!id(free_running_mode_switch).state || !id(free_running_active)) {
            ESP_LOGW("FreeRunning", "Режим не активен");
            id(free_running_active) = false;
            id(auto_mode) = false;
            id(free_running_mode_switch).turn_off();
            return;
          }

          // Сглаживание расстояния
          float d_raw = id(my_distance).state;
          if (id(smoothed_distance) == 0.0f) id(smoothed_distance) = d_raw;
          else {
            // Для задней зоны делаем фильтр быстрее
            if (d_raw > id(smoothed_distance)) {
              id(smoothed_distance) = 0.5f * d_raw + 0.5f * id(smoothed_distance);
            } else {
              id(smoothed_distance) = 0.3f * d_raw + 0.7f * id(smoothed_distance);
            }
          }
          float d = id(smoothed_distance);

          // Зоны
          float accel = id(accel_cm).state;
          float decel = id(decel_cm).state;

          bool in_front = (d < accel - 2);
          bool in_back  = (d > decel + 2);

          // Таймер шагов
          static uint32_t last_step_ms = 0;
          static bool first_back = true;
          uint32_t now = millis();

          // Шаг из параметра
          float step_kph = id(free_run_step).state;
          int step_int = (int)(step_kph * 10);

          int goal_int = id(target_speed_goal);
          bool changed = false;

          if (in_front && (now - last_step_ms >= 1000)) {
            goal_int += step_int;
            last_step_ms = now;
            first_back = true; // сбрасываем флаг задней зоны
            changed = true;
            ESP_LOGI("FreeRunning", "Передняя зона: +%.1f км/ч, новая цель %.1f",
                    step_kph, goal_int / 10.0f);
          }
          else if (in_back) {
            if (first_back) {
              // мгновенный первый шаг при входе в заднюю зону
              goal_int -= step_int;
              first_back = false;
              last_step_ms = now;
              changed = true;
              ESP_LOGI("FreeRunning", "Задняя зона (первый шаг): -%.1f км/ч, новая цель %.1f",
                      step_kph, goal_int / 10.0f);
            } else if (now - last_step_ms >= 1000) {
              goal_int -= step_int;
              last_step_ms = now;
              changed = true;
              ESP_LOGI("FreeRunning", "Задняя зона: -%.1f км/ч, новая цель %.1f",
                      step_kph, goal_int / 10.0f);
            }
          }
          else {
            // В средней зоне сбрасываем таймер и флаг
            last_step_ms = now;
            first_back = true;
          }

          // Ограничения скорости
          if (goal_int < 6) goal_int = 6;
          if (goal_int > 180) goal_int = 180;

          if (changed && goal_int != id(target_speed_goal)) {
            id(target_speed_goal) = goal_int;
            id(set_speed).publish_state(goal_int / 10.0f);
          }

# Скрипт авто‑калибровки Free Run
# Назначение:
# 1. Запускает дорожку на фиксированной скорости (4 км/ч) и просит пользователя 30 секунд бежать в передней зоне, затем 30 секунд в задней зоне.
# 2. В процессе собирает минимальное и максимальное расстояние от датчика (передняя и задняя границы).
# 3. По завершении:
#    - Сохраняет min/max расстояния в слайдеры treadmill_slider_min и treadmill_slider_max (с проверкой диапазонов).
#    - Вычисляет длину дорожки (max + 30 см) и сохраняет в treadmill_length.
#    - Определяет зоны ускорения и замедления (min+12 см и max−12 см) и сохраняет в accel_cm и decel_cm.
#    - Обновляет интерфейс Nextion (тексты, картинки, значения зон).
#    - Логирует результаты (min, max, длина, accel, decel).
# 4. Если данные некорректные — выставляет значения по умолчанию и пишет предупреждение.
# 5. В конце останавливает дорожку, сбрасывает флаги калибровки и отправляет статусы FTMS (Stopped/Idle).
  - id: start_calibration
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(bt_tempmode_state) &&
                     (id(overheat_lockout) ||
                      isnan(id(temp).state) ||
                      id(temp).state >= id(overheat_stop_temperature).state);
          then:
            - lambda: |-
                ESP_LOGW("Overheat", "Calibration start blocked by overheat protection");
                id(program_status).publish_state("Start blocked: Overheat");
                id(display_nextion).send_command_printf("page 24");
            - script.stop: start_calibration
      - lambda: |- 
          id(calibration_active) = true;
          id(calibration_min_distance) = 9999.0;  // Сбрасываем минимальное расстояние
          id(calibration_max_distance) = 0.0;    // Сбрасываем максимальное расстояние
          id(calibration_start_time) = millis(); // Запоминаем время начала
          id(motor_running) = true;              // Запускаем мотор
          id(manual_stop) = false;               // Сбрасываем ручную остановку
          id(target_speed_goal) = 40;
          id(set_speed).publish_state(4.0);      // Устанавливаем скорость в интерфейсе
          id(program_status).publish_state("Калибровка: Бегите в передней зоне");
          id(display_nextion).set_component_text("t_info_calib", "    Step 1:\\rFront zone\\r      30s");
          id(display_nextion).send_command_printf("p_zone.pic=74"); // Картинка зоны 
          ESP_LOGI("Calibration", "Калибровка начата, скорость установлена на 4 км/ч");

          // Fitness Machine Status: Started or Resumed (0x04)
          id(ftms_status_char).set_value({0x04});
          id(ftms_status_char).notify();
          id(last_ftms_status) = {0x04};
          id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x04));
          ESP_LOGI("FTMS", "Отправлено уведомление: Started or Resumed (0x04)");

          // Training Status: Other (0x00)
          id(training_status_char).set_value({0x00, 0x00});
          id(training_status_char).notify();
          id(last_training_status) = {0x00, 0x00};
          id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x00));
          ESP_LOGI("FTMS", "Отправлено уведомление: Other (0x00)");
      - delay: 30s  # Первые 30 секунд — бег в передней зоне
      - lambda: |- 
          id(program_status).publish_state("Калибровка: Бегите в задней зоне");
          id(display_nextion).set_component_text("t_info_calib", "   Step 2:\\rRear zone\\r     30s");
          id(display_nextion).send_command_printf("p_zone.pic=75"); // Картинка зоны 
          ESP_LOGI("Calibration", "Переключение на заднюю зону");
      - delay: 30s  # Следующие 30 секунд — бег в задней зоне
      - lambda: |- 
          if (id(calibration_active)) {
            // Проверяем, были ли собраны валидные данные
            if (id(calibration_min_distance) < 9999.0 && id(calibration_max_distance) > 0.0) {
              // Округляем значения для слайдеров
              int min_distance = (int)round(id(calibration_min_distance));
              int max_distance = (int)round(id(calibration_max_distance));

              // Проверяем диапазоны для treadmill_slider_min (0–40)
              if (min_distance >= 0 && min_distance <= 40) {
                auto call = id(treadmill_slider_min).make_call();
                call.set_value(min_distance);
                call.perform();
              } else {
                auto call = id(treadmill_slider_min).make_call();
                call.set_value(25); // Значение по умолчанию
                call.perform();
                ESP_LOGW("Calibration", "Минимальное расстояние вне диапазона: %d см, установлено 25 см", min_distance);
              }

              // Проверяем диапазоны для treadmill_slider_max (60–120)
              if (max_distance >= 60 && max_distance <= 120) {
                auto call = id(treadmill_slider_max).make_call();
                call.set_value(max_distance);
                call.perform();
              } else {
                auto call = id(treadmill_slider_max).make_call();
                call.set_value(85); // Значение по умолчанию
                call.perform();
                ESP_LOGW("Calibration", "Максимальное расстояние вне диапазона: %d см, установлено 85 см", max_distance);
              }

              // Вычисляем длину дорожки: max + 30 см
              float calculated_treadmill_length = id(calibration_max_distance) + 30.0;
              int treadmill_length_int = (int)round(calculated_treadmill_length);
              if (treadmill_length_int >= 80 && treadmill_length_int <= 140) {
                auto call = id(treadmill_length).make_call();
                call.set_value(treadmill_length_int);
                call.perform();
              } else {
                auto call = id(treadmill_length).make_call();
                call.set_value(100); // Значение по умолчанию
                call.perform();
                ESP_LOGW("Calibration", "Длина дорожки вне диапазона: %d см, установлено 100 см", treadmill_length_int);
              }

              // Зоны ускорения и замедления
              float accel_zone = id(calibration_min_distance) + 12.0;
              float decel_zone = id(calibration_max_distance) - 12.0;
              int accel_zone_int = (int)round(accel_zone);
              int decel_zone_int = (int)round(decel_zone);

              // Проверяем диапазоны для accel_cm (20–60)
              if (accel_zone_int >= 20 && accel_zone_int <= 60) {
                auto call = id(accel_cm).make_call();
                call.set_value(accel_zone_int);
                call.perform();
              } else {
                auto call = id(accel_cm).make_call();
                call.set_value(35); // Значение по умолчанию
                call.perform();
                ESP_LOGW("Calibration", "Зона ускорения вне диапазона: %d см, установлено 35 см", accel_zone_int);
              }

              // Проверяем диапазоны для decel_cm (60–90)
              if (decel_zone_int >= 60 && decel_zone_int <= 90) {
                auto call = id(decel_cm).make_call();
                call.set_value(decel_zone_int);
                call.perform();
              } else {
                auto call = id(decel_cm).make_call();
                call.set_value(62); // Значение по умолчанию
                call.perform();
                ESP_LOGW("Calibration", "Зона замедления вне диапазона: %d см, установлено 62 см", decel_zone_int);
              }

              id(program_status).publish_state("Калибровка завершена");
              id(display_nextion).set_component_text("t_info_calib", " Calibration\\r  Complete");
              id(display_nextion).send_command_printf("p_zone.pic=73"); // Картинка зоны 
              ESP_LOGI("Nextion", "Sending command for p_zone.pic=73");

              id(display_nextion).set_component_text_printf("caldistspeed.t_speed_up", "%d", (int)id(accel_cm).state);
              id(display_nextion).set_component_text_printf("caldistspeed.t_speed_down", "%d", (int)id(decel_cm).state);
              id(display_nextion).set_component_text_printf("caldistspeed.t_lenght", "%d", (int)id(treadmill_length).state);
              id(display_nextion).set_component_text("b_cal", "Calibrate");

              ESP_LOGI("Calibration", "Калибровка завершена: min=%d см, max=%d см, длина=%d см, accel=%d см, decel=%d см",
                       min_distance, max_distance, treadmill_length_int, accel_zone_int, decel_zone_int);
            } else {
              id(program_status).publish_state("Калибровка: Ошибка данных");
              id(display_nextion).set_component_text("t_info_calib", "Calibration\\r     Eror");
              ESP_LOGW("Calibration", "Ошибка: недостаточно данных с датчика");
            }

            // Останавливаем дорожку
            id(motor_running) = false;
            id(target_speed) = 0;
            id(set_speed).publish_state(0.0);
            id(treadmill_speed_goal_sensor).publish_state(0.0);
            id(calibration_active) = false;

            // Fitness Machine Status: Stopped or Paused (0x02)
            id(ftms_status_char).set_value({0x02});
            id(ftms_status_char).notify();
            id(last_ftms_status) = {0x02};
            id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x02));
            ESP_LOGI("FTMS", "Отправлено уведомление: Stopped or Paused (0x02)");

            // Training Status: Idle (0x01)
            id(training_status_char).set_value({0x00, 0x01});
            id(training_status_char).notify();
            id(last_training_status) = {0x00, 0x01};
            id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x01));
            ESP_LOGI("FTMS", "Отправлено уведомление: Idle (0x01)");
          }
      - script.execute: stop_program


