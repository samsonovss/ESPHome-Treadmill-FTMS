# кнопка Nextion для вкл/выкл режима автокоррекции скорости по энкодеру
  - platform: nextion
    name: "Speed Correction Mode"
    id: bt_speed_correction
    component_name: system.bt_speed_corr
    on_turn_on:
      - globals.set:
          id: bt_speed_correction_state
          value: !lambda 'return id(bt_speed_correction).state;'
      - lambda: |-
          ESP_LOGI("Adaptive Correction", "enabled");
          // При включении адаптива сбрасываем накопитель в текущую цель
          id(target_speed_goal_float) = id(target_speed) / 10.0;
          id(display_nextion).send_command_printf("speed.p_sync.pic=96");

    on_turn_off:
      - globals.set:
          id: bt_speed_correction_state
          value: !lambda 'return id(bt_speed_correction).state;'
      - lambda: |-
          ESP_LOGI("Adaptive Correction", "disable");
          // При выключении тоже можно синхронизировать
          id(target_speed_goal_float) = id(target_speed) / 10.0;
          id(display_nextion).send_command_printf("speed.p_sync.pic=95");


# кнопка режима Free Run (шаблонный switch)
  - platform: template
    name: "Free Running Mode"
    id: free_running_mode_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          // Сохраняем текущий режим управления, если он не Free Run
          if (id(control_mode) != 1) {
            id(previous_control_mode) = id(control_mode);
          }
          // Переключаемся в режим Free Run
          id(control_mode) = 1;
          id(free_running_active) = true;
          ESP_LOGI("FreeRun", "Free Run включён, предыдущий режим: %d", id(previous_control_mode));
          id(display_nextion).send_command_printf("speed.p_icon_mode.pic=58"); // иконка
      - script.execute: free_running_mode
    on_turn_off:
      - lambda: |-
          // Восстанавливаем предыдущий режим управления
          id(control_mode) = id(previous_control_mode);
          id(free_running_active) = false;
          ESP_LOGI("FreeRun", "Free Run выключен, восстановлен режим: %d", id(control_mode));
          // Если активна программа Pulse Zone, возвращаем управление по пульсу
          if (id(control_mode) == 2) {
            id(auto_mode) = true;
            id(display_nextion).send_command_printf("speed.p_icon_mode.pic=59"); // иконка пульс
            ESP_LOGI("FreeRun", "Возвращено управление по пульсу");
          } else {
            id(auto_mode) = false;
            id(display_nextion).send_command_printf("speed.p_icon_mode.pic=62"); // иконка убрать
            ESP_LOGI("FreeRun", "Возвращено ручное управление");
          }

# ***************** Display (Nextion) *****************
# 1. Подключение Nextion по UART (uart_0)
#    • Автоматическая загрузка TFT-прошивки по HTTP
#    • update_interval: 1s — гарантирует вызов lambda ровно раз в секунду
#    • При переполнении очереди команд — предупреждение в лог
#
# 2. Инициализация при старте (on_setup):
#    • Устанавливает минимальную яркость 20% и синхронизирует слайдер hbright + команда dim
#    • Настраивает пределы слайдеров скорости (min/max) на всех нужных страницах
#    • Обновляет текстовые поля калибровки (ускорение, замедление, длина полотна)
#    • Синхронизирует состояние всех переключателей (display_off, safe_mode, speed_correction, tempmode)
#    • Между командами — задержки 500 мс для стабильной работы Nextion
#
# 3. Отслеживание текущей страницы (on_page):
#    • Сохраняет номер страницы в глобальную переменную id(current_page)
#    • По switch(x) выполняет действия **только один раз при открытии страницы**:
#        – page 0  → сброс выбора карты и программы
#        – page 1  → показ температуры мотора + запрос нового измерения
#        – page 3  → отправка возраста, веса, пола
#        – page 5  → отправка времени тренировки, разминки, заминки
#        – page 16 → отображение версии ESPHome
#        – page 17 → показ температуры мотора (страница Motor)
#
# 4. Периодическое обновление (lambda вызывается каждую секунду благодаря update_interval: 1s):
#    • page 1 (Speed)      → обновление поля speed.tstatus (статус программы, кроме HIIT)
#    • page 19 (Bluetooth) → обновление батареи, пульса и имени устройства при подключении,
#                             очистка полей при отключении
#
# В результате:
# • Инициализация при входе на страницу — мгновенная и без дублирования
# • Часто меняющиеся данные (статус, пульс, батарея) — обновляются ровно раз в секунду
# • Полная совместимость с goto_page() и физическим переключением страниц
# • Код чистый, соответствует официальным рекомендациям ESPHome 2025+
