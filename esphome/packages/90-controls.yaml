  - platform: template
    name: "Diagnostic Mode"
    id: diagnostic_mode_switch
    lambda: |-
      return id(diagnostic_mode);   
    turn_on_action:
      - globals.set:
          id: diagnostic_mode
          value: 'true'
    turn_off_action:
