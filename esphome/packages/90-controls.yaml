          //ESP_LOGI("Settings", "Weight updated to: %d kg", (int)id(weight_kg).state);

# Set Speed — целевая скорость (0.6–18.0 км/ч).
# При изменении обновляет goal и отправляет уведомление FTMS (Target Speed Changed).
  - platform: template
    name: "Set Speed"
    id: set_speed
    min_value: 0.6
    max_value: 18.0
    step: 0.1
    unit_of_measurement: "km/h"
    icon: "mdi:speedometer"
    optimistic: true
    restore_value: no
    initial_value: 0.0
    on_value:
      - lambda: |-
          if (id(auto_mode)) return;

          float speed = x;
          int target = static_cast<int>(speed * 10);  // десятые км/ч
          if (target < 6 && target != 0) target = 6;
          if (target > 180) target = 180;

          if (id(target_speed_goal) != target) {
            id(target_speed_goal) = target;

            // --- FTMS: Target Speed Changed (0x05) ---
            uint16_t ftms_speed = target * 10;  // значение в 0.01 км/ч
            uint8_t low  = ftms_speed & 0xFF;
            uint8_t high = ftms_speed >> 8;

            id(ftms_status_char).set_value({0x05, low, high});
            id(ftms_status_char).notify();
            id(last_ftms_status) = {0x05, low, high};
            id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x05));

            ESP_LOGI("treadmill", "Set Speed → %.1f км/ч (FTMS Target Speed Changed 0x05)", speed);
          }

        
# Set Incline — целевой наклон (0–15%).
# При изменении обновляет goal и отправляет уведомление FTMS (Target Incline Changed).
  - platform: template
    name: "Set Incline"
    id: set_incline
    min_value: 0
    max_value: 15
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:angle-acute"
    optimistic: true
    on_value:
      - lambda: |-
          float incline = x;
          int16_t incline_value = static_cast<int16_t>(incline * 10);  // 0.1% шаг, signed (может быть отрицательным в теории)

          if (id(target_incline) != incline_value) {
            id(target_incline_goal) = incline_value;
            id(target_incline) = incline_value;

            if (id(current_page) == 1) {
              char incline_str[10];
              snprintf(incline_str, sizeof(incline_str), "%.1f", incline);
              id(display_nextion).set_component_text("t4", incline_str);
            }

            // --- FTMS: Target Incline Changed (0x06) ---
            uint8_t low  = static_cast<uint8_t>(incline_value & 0xFF);
            uint8_t high = static_cast<uint8_t>(incline_value >> 8);

            id(ftms_status_char).set_value({0x06, low, high});
            id(ftms_status_char).notify();
            id(last_ftms_status) = {0x06, low, high};
            id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x06));

            ESP_LOGI("treadmill", "Set Incline → %.1f%% (FTMS Target Incline Changed 0x06)", incline);
          }

# Set Warm-up Time — длительность разминки (0–10 мин).
# При изменении обновляет поле на дисплее.
  - platform: template
    name: "Set Warm-up Time"
    id: set_warm_up_time
    min_value: 0
    max_value: 10
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer-play-outline"
    optimistic: true
    restore_value: yes
    initial_value: 0  # По умолчанию 5 минут
    on_value:
      - lambda: |-
          //if (id(age).state) {
          id(display_nextion).send_command_printf("Time.n_warm.val=%d", (int)id(set_warm_up_time).state);
          ESP_LOGI("Nextion", "Sending command for Time.n_warm.val");
          //}

# Set Run Time — длительность основной тренировки (0–240 мин).
# При изменении обновляет оставшееся время (remaining_run_time) и поле на дисплее.
  - platform: template
    name: "Set Run Time"
    id: set_run_time
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer"
    optimistic: true
    restore_value: yes
    initial_value: 0
    on_value:
      - lambda: |- 
          int new_time_seconds = (int)(x * 60);  // Преобразуем минуты в секунды
          if (id(motor_running)) {
            if (id(remaining_warm_up_time) <= 0 && !id(warm_up_active)) {
              // Обновляем только во время основной программы
              id(remaining_run_time) = new_time_seconds;
            } else if (id(remaining_warm_up_time) > 0 || id(warm_up_active)) {
              // Если идет разминка, восстанавливаем исходное значение ползунка
              id(set_run_time).publish_state(id(set_run_time).state);
            }
          } else {
            // Если мотор не работает, задаем начальное значение
            id(remaining_run_time) = new_time_seconds;
          }

          //if (id(age).state) {
          id(display_nextion).send_command_printf("Time.n_min.val=%d", (int)id(set_run_time).state);
          ESP_LOGI("Nextion", "Sending command for Time.n_min.val");
          //}

# Set Cool-down Time — длительность заминки (0–10 мин).
# При изменении обновляет поле на дисплее.
  - platform: template
    name: "Set Cool-down Time"
    id: set_cool_down_time
    min_value: 0
    max_value: 10
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer-stop-outline"
    optimistic: true
    restore_value: yes
    initial_value: 0  # По умолчанию 5 минут
    on_value:
      - lambda: |-
          //if (id(age).state) {
          id(display_nextion).send_command_printf("Time.n_cool.val=%d", (int)id(set_cool_down_time).state);
          ESP_LOGI("Nextion", "Sending command for Time.n_cool.val");
          //}

#Компонент number для эмуляции пульса для отладки
  - platform: template
    name: "Test Heart Rate"
    id: test_heart_rate
    min_value: 60
    max_value: 200
    step: 1
    unit_of_measurement: "bpm"
    icon: "mdi:heart-pulse"
    entity_category: diagnostic
    optimistic: true
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(emulate_ble_connected);'
            then:
              - sensor.template.publish:
                  id: heart_rate_sensor
                  state: !lambda 'return x;'
              - lambda: |-
                  ESP_LOGI("TEST", "Test Heart Rate set to: %.0f bpm", x);
                  // Эмуляция обработки BLE-логики
                  float heart_rate = x;
                  float max_hr = id(max_heart_rate);
                  float min_zone_1 = max_hr * 0.50;
                  float max_zone_1 = max_hr * 0.60;
                  float min_zone_2 = max_hr * 0.60;
                  float max_zone_2 = max_hr * 0.70;
                  float min_zone_3 = max_hr * 0.70;
                  float max_zone_3 = max_hr * 0.80;
                  float min_zone_4 = max_hr * 0.80;
                  float max_zone_4 = max_hr * 0.90;
                  float min_zone_5 = max_hr * 0.90;
                  float max_zone_5 = max_hr;

                  // Определяем текущую зону
                  int heart_rate_zone = 0;
                  if (heart_rate < min_zone_1) {
                    heart_rate_zone = 0;
                  } else if (heart_rate < max_zone_1) {
                    heart_rate_zone = 1;
                  } else if (heart_rate < max_zone_2) {
                    heart_rate_zone = 2;
                  } else if (heart_rate < max_zone_3) {
                    heart_rate_zone = 3;
                  } else if (heart_rate < max_zone_4) {
                    heart_rate_zone = 4;
                  } else {
                    heart_rate_zone = 5;
                  }
                  id(current_zone) = heart_rate_zone;
                  ESP_LOGI("TEST", "Heart Rate: %.0f, Current Zone: %d", heart_rate, heart_rate_zone);

                  // Обновление дисплея
                  if (id(current_page) == 1) {
                    char heart_str[10];
                    sprintf(heart_str, "%.0f", heart_rate);
                    id(display_nextion).send_command_printf("t0.txt=\"%s\"", heart_str);
                    ESP_LOGI("Nextion", "Sending command for t0.txt");

                    uint16_t picture_id = 7; // Серый по умолчанию
                    uint16_t t0_bco = 21162; // Серый по умолчанию
                    if (heart_rate < min_zone_1) {
                      picture_id = 7; // Серый
                    } else if (heart_rate < max_zone_1) {
                      picture_id = 2; // Голубой
                      t0_bco = 15487;
                    } else if (heart_rate < max_zone_2) {
                      picture_id = 3; // Зелёный
                      t0_bco = 11744;
                    } else if (heart_rate < max_zone_3) {
                      picture_id = 4; // Жёлтый
                      t0_bco = 64992;
                    } else if (heart_rate < max_zone_4) {
                      picture_id = 5; // Оранжевый
                      t0_bco = 64294;
                    } else {
                      picture_id = 6; // Красный
                      t0_bco = 64040;
                    }
                    id(display_nextion).send_command_printf("p0.pic=%d", picture_id);
                    id(display_nextion).send_command_printf("t0.bco=%d", t0_bco);
                    ESP_LOGI("Nextion", "Sending command for p0.pic and t0.bco");
                  }

