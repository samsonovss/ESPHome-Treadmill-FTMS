select:
# Профиль разгона дорожки (варианты: Soft / Normal / Fast / Technogym)
  - platform: template
    name: "Acceleration Profile"
    id: accel_profile
    optimistic: true
    options:
      - "Soft"
      - "Normal"
      - "Fast"
      - "Technogym"
    initial_option: "Soft"

# Профиль коррекции скорости (варианты: Soft / Precise / Aggressive)
  - platform: template
    name: "Speed Correction Profile"
    id: speed_corr_profile
    optimistic: true
    options:
      - "Soft"
      - "Precise"
      - "Aggressive"
    initial_option: "Soft"

# Выбор тренировочной программы
# При смене значения автоматически задаются параметры:
#   - время тренировки, разминки и заминки
#   - выбор пульсовой зоны (zone_select)
#   - сброс/инициализация таймеров и флагов (remaining_run_time, manual_stop, interval_phase)
# Таким образом, выбор программы сразу подготавливает дорожку к нужному сценарию.
  - platform: template
    name: "Workout Program"
    id: program_select
    restore_value: no
    options:
      - "None"
      - "Pulse Zone"
      - "Fat Burn"
      - "Recovery run"
      - "HIIT"
    initial_option: "None"
    optimistic: true
    on_value:
      - lambda: |-
          std::string program = x;

          if (program == "None") {
            id(zone_select).publish_state("1");
            id(set_run_time).publish_state(00.0); //время тренировки 
            id(set_warm_up_time).publish_state(00.0); //время разминки
            id(set_cool_down_time).publish_state(00.0); //время заминки
            //id(stop_program).execute();
          } else if (program == "Fat Burn") {
            id(zone_select).publish_state("2");
            id(set_run_time).publish_state(40.0); //время тренировки 
            id(set_warm_up_time).publish_state(03.0); //время разминки
            id(set_cool_down_time).publish_state(03.0); //время заминки
            id(remaining_run_time) = 40 * 60;
            id(manual_stop) = false;
          } else if (program == "Recovery run") {
            id(zone_select).publish_state("1");
            id(set_run_time).publish_state(25.0);
            id(set_warm_up_time).publish_state(03.0); //время разминки
            id(set_cool_down_time).publish_state(03.0); //время заминки
            id(remaining_run_time) = 25 * 60;
            id(manual_stop) = false;
          } else if (program == "HIIT") {
            // --- Устанавливаем зону по умолчанию при выборе---
            id(zone_select).publish_state("4");

            id(set_run_time).publish_state(0.0);      // время тренировки = 0
            id(remaining_run_time) = 0;               // не отсчитываем время
            id(set_warm_up_time).publish_state(0.0);  // при желании можно убрать разминку
            id(set_cool_down_time).publish_state(0.0);// и заминку, если они не нужны
            id(interval_phase) = "high";
            id(interval_time) = 0;
            id(manual_stop) = false;
          
          } else if (program == "Pulse Zone") {
            id(set_run_time).publish_state(30.0);
            id(set_warm_up_time).publish_state(03.0); //время разминки
            id(set_cool_down_time).publish_state(03.0); //время заминки
            id(manual_stop) = false;
          }


# Gender — выбор пола (Male/Female).
# При изменении обновляет Dual State Button на дисплее Nextion
# и запускает пересчёт пульсовых зон.
  - platform: template
    name: "Gender"
    id: gender_select
    restore_value: yes
    options:
      - "Male"
      - "Female"
    initial_option: "Male"
    optimistic: true
    on_value:
      - lambda: |-
          bool is_male = (id(gender_select).current_option() == "Male");
          id(display_nextion).send_command_printf("age.bt0.val=%d", is_male ? 0 : 1);
          ESP_LOGI("Nextion", "Gender synced: %s", is_male ? "Male" : "Female");

      - script.execute: update_heart_rate_zones

# Heart Rate Zone — выбор зоны пульса (1–5).
# При изменении запускает скрипт обновления зон.
  - platform: template
