# Number-сенсоры (числовые параметры)
number:
  # Температура аварийной остановки двигателя.
  # Повторный запуск разрешается после охлаждения на 10 C ниже этого порога.
  - platform: template
    name: "Overheat Stop Temperature"
    id: overheat_stop_temperature
    min_value: 50
    max_value: 110
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature
    entity_category: config
    mode: box
    optimistic: true
    restore_value: yes
    initial_value: 85

  # === BEGIN EXPERIMENTAL_KICKR_RUN ===
  # ------------------------------------------------------------
  # Настройки сопоставления реального уклона Zwift и уровней дорожки
  #
  # 1. Treadmill Maximum Incline Level:
  #    максимальное число, которое принимает контроллер дорожки.
  #    Для текущей дорожки это 15. Если у другой дорожки максимум 12,
  #    пользователь указывает 12.
  #
  # 2. Treadmill Real Grade At Maximum:
  #    реальный уклон полотна в процентах на максимальном уровне.
  #    Пользователь измеряет подъём полотна и вводит полученное значение.
  #    Например, если уровень 15 физически даёт 5%, здесь указывается 5.0.
  #
  # 3. Zwift Incline Intensity:
  #    дополнительная регулировка силы автонаклона.
  #    100% — полное рассчитанное значение, 50% — половина, 0% — всегда 0.
  #
  # Формула:
  #   уровень = уклон Zwift * максимальный уровень / реальный максимум
  #             * интенсивность / 100
  # ------------------------------------------------------------
  - platform: template
    name: "Treadmill Maximum Incline Level"
    id: treadmill_max_incline_level
    min_value: 1
    max_value: 15
    step: 1
    mode: box
    entity_category: config
    optimistic: true
    restore_value: yes
    initial_value: 15

  - platform: template
    name: "Treadmill Real Grade At Maximum"
    id: treadmill_real_max_grade
    min_value: 0.5
    max_value: 30
    step: 0.1
    unit_of_measurement: "%"
    mode: box
    entity_category: config
    optimistic: true
    restore_value: yes
    initial_value: 15

  - platform: template
    name: "Zwift Incline Intensity"
    id: zwift_incline_intensity
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
    optimistic: true
    restore_value: yes
    initial_value: 100
  # === END EXPERIMENTAL_KICKR_RUN ===

# ============================
# Параметр HIIT High Zone (через number)
# ----------------------------
# Этот параметр задаёт максимальную зону пульса для HIIT.
# Вместо выбора из списка (select) теперь можно напрямую указать число.
# ============================
  # - platform: template
  #   name: "HIIT High Zone"
  #   id: hiit_high_zone
  #   optimistic: true
  #   min_value: 1       # минимальная зона
  #   max_value: 5       # максимальная зона
  #   step: 1            # шаг изменения
  #   unit_of_measurement: "zone"
  #   initial_value: 4   # по умолчанию зона 4


  # ============================
  # Параметры для обычных пульсовых программ
  # ----------------------------
  # Pulse Adjust Interval — задаёт, как часто (в секундах) 
  # будет выполняться коррекция скорости по пульсу 
  # в обычных программах (Pulse Zone, Fat Burn, Recovery run).
  # Не влияет на HIIT.
  # ============================
  - platform: template
    name: "Pulse Adjust Interval"
    id: pulse_adjust_interval
    optimistic: true
    min_value: 2       # минимум 2 секунды
    max_value: 12      # максимум 12 секунд
    step: 2            # шаг изменения
    unit_of_measurement: "s"
    initial_value: 4   # по умолчанию 4 секунды

  # ============================
  # Параметры HIIT (можно менять из интерфейса)
  # ----------------------------
  # Эти параметры управляют логикой интервальной тренировки:
  # - HIIT High Duration — длительность фазы высокой интенсивности.
  # - HIIT Low Duration  — длительность фазы низкой интенсивности.
  # - HIIT Low Speed     — скорость в фазе низкой интенсивности.
  # - HIIT Cycles        — количество повторов (high+low).
  # ============================
  - platform: template
    name: "HIIT High Duration"
    id: hiit_high_duration
    optimistic: true
    min_value: 30
    max_value: 600
    step: 30
    unit_of_measurement: "s"
    initial_value: 120   # по умолчанию 2 минуты

  - platform: template
    name: "HIIT Low Duration"
    id: hiit_low_duration
    optimistic: true
    min_value: 30
    max_value: 600
    step: 30
    unit_of_measurement: "s"
    initial_value: 120   # по умолчанию 2 минуты

  - platform: template
    name: "HIIT Low Speed"
    id: hiit_low_speed
    optimistic: true
    min_value: 3.0
    max_value: 8.0
    step: 0.5
    unit_of_measurement: "km/h"
    initial_value: 5.0   # по умолчанию 5 км/ч

  - platform: template
    name: "HIIT Cycles"
    id: hiit_cycles
    optimistic: true
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 6     # по умолчанию 6 повторов


# Free Run Step — шаг изменения скорости в свободном режиме (0.1–1.0 км/ч).
