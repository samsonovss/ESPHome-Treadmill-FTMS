# Gender Switch — переключатель пола с дисплея Nextion (bt0).
# При значении 1 устанавливает "Female", при 0 — "Male".
# При изменении обновляет gender_select и запускает пересчёт пульсовых зон.
  - platform: nextion
    id: gender_switch
    name: "Gender Switch"
    internal: true
    component_name: bt0  # Соответствует имени в Nextion
    on_turn_on:  # bt0.val = 1 (Female)
      - lambda: |-
          if (id(gender_select).current_option() != "Female") {
            id(gender_select).publish_state("Female");
            ESP_LOGI("Settings", "Gender set to Female from bt0");
            id(update_heart_rate_zones).execute();
          }
    on_turn_off:  # bt0.val = 0 (Male)
      - lambda: |-
          if (id(gender_select).current_option() != "Male") {
            id(gender_select).publish_state("Male");
            ESP_LOGI("Settings", "Gender set to Male from bt0");
            id(update_heart_rate_zones).execute();
          }


