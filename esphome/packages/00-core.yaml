# Enable logging
logger:
  level: INFO
  baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# Local status and control interface. Keep port 80 inside a trusted LAN.
# Web OTA is intentionally not enabled.
web_server:
  port: 80

# safe_mode:
#   num_attempts: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none  # Отключает энергосбережение
  fast_connect: true     # Быстрое подключение

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Treadmill Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:


