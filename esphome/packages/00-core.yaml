esphome:
  name: treadmill
  friendly_name: treadmill
  platformio_options:
    board_build.arduino.memory_type: qio_opi
  includes:
  - incline_profiles.h

  on_boot:
    - priority: 600
      then:
        - script.execute: update_heart_rate_zones
        - globals.set:
            id: ble_client_connected
            value: 'false'
        - text_sensor.template.publish:
            id: ble_server_status
            state: "Отключен"
        - text_sensor.template.publish:
            id: connection_status
            state: "Отключено"
        - sensor.template.publish:
            id: heart_rate_sensor
            state: 0  
        - sensor.template.publish:
            id: battery_level_sensor
            state: 0  
        - globals.set:
            id: treadmill_running
            value: 'false'
        - globals.set:
            id: current_distance_km
            value: '0.0'
        - globals.set:
            id: current_speed
            value: '0.0'
        - lambda: |-
            // Инициализация Training Status: Idle (0x01)
            id(training_status_char).set_value({0x00, 0x01});
            //id(training_status_char).notify();
            id(last_training_status) = {0x00, 0x01};
            id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x01));
            ESP_LOGI("FTMS", "Инициализация при старте: Training Status = Idle (0x01)");
        # - lambda: |-
        #     // Устанавливаем начальную скорость UART на 9600
        #     id(uart_0).set_baud_rate(9600);
        #     id(uart_0).load_settings();
        #     ESP_LOGI("UART", "Установлена начальная скорость UART: 9600");
        # - delay: 2s  # Ждём 2 секунды для стабилизации дисплея
        # - lambda: |-
        #     // Переключаем скорость UART на 921600
        #     id(uart_0).set_baud_rate(921600);
        #     id(uart_0).load_settings();
        #     ESP_LOGI("UART", "Скорость UART изменена на: 921600");

    # === BEGIN EXPERIMENTAL_KICKR_RUN ===
    # The virtual treadmill advertises FTMS service data 01 01 00.
    # Apply it after BLE setup so Zwift can validate the CONTROLLABLE profile.
    - priority: -100
      then:
        - lambda: |-
            if (esphome::esp32_ble::global_ble != nullptr) {
              esphome::esp32_ble::global_ble->advertising_set_service_data_and_name(
                  std::vector<uint8_t>{0x01, 0x01, 0x00}, true);
              ESP_LOGI("KICKR_RUN",
                       "FTMS advertising name and service data set: 01 01 00");
            } else {
              ESP_LOGW("KICKR_RUN",
                       "BLE component unavailable; service data not set");
            }
    # === END EXPERIMENTAL_KICKR_RUN ===


external_components:
  - source: github://mrtoy-me/esphome-vl53l1x@main
  #- source: github://samsonovss/esphome-vl53l1x@main
    components: [ vl53l1x ]
    refresh: 0s
  # ESPHome 2026.5.3 downgrades indications to unconfirmed notifications.
  # Zwift requires confirmed FTMS Control Point responses to pair CONTROLLABLE.
  - source:
      type: local
      path: components
    components: [ esp32_ble_server ]


esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      # 🔹 Оптимизация под скорость
      COMPILER_OPTIMIZATION_PERF: "y"                 # -O2 для максимальной производительности
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"        # Макс. частота CPU
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"             # Увеличенный D-кэш
      CONFIG_ESP32S3_DATA_CACHE_LINE_32B: "y"         # 32B линия кэша — быстрее без графики

      # 🔹 PSRAM (только под данные)
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"           # Код в IRAM/Flash — быстрее
      CONFIG_SPIRAM_RODATA: "n"                        # Константы в DRAM для скорости
      CONFIG_SPIRAM_MODE_OCT: "y"                      # Octal PSRAM
      CONFIG_SPIRAM_USE_MALLOC: "y"                    # malloc() может выделять в PSRAM
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"   # Разрешить стек в PSRAM
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y" # Разрешить глобальные буферы в PSRAM

      # ❌ LVGL — убрано
      CONFIG_LV_MEM_CUSTOM: "n"
      CONFIG_LV_MEMCPY_MEMSET_STD: "n"
      CONFIG_LV_ATTRIBUTE_FAST_MEM: "n"

esp32_ble:
  # KICKR RUN compatibility: this is the GAP advertising name.
  # It is independent from the ESPHome node name used by Home Assistant.
  name: "KICKR RUN"
  max_connections: 3

# Включение PSRAM (octal, 80 МГц) для расширенной памяти ESP32
psram:
  mode: octal
  speed: 80MHz

# Safe Mode — количество попыток перезапуска при ошибке (1 = сразу в безопасный режим)
safe_mode:
  num_attempts: 1

