binary_sensor:

# Treadmill Usage — логический индикатор активности.
# Возвращает true, если целевая скорость > 0.0 (дорожка используется).
  - platform: template
    name: "Treadmill Usage"
    id: treadmill_usage
    lambda: |-
      return id(treadmill_speed_goal_sensor).state > 0.0;

# Speed Up Button — физическая кнопка на GPIO13, увеличивает скорость.
  - platform: gpio
    pin:
      number: 13
      mode: INPUT_PULLUP
      inverted: true
    name: "Speed Up Button"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          // шаг из Handrail Speed Step (12.10)
          if (!id(motor_running)) return;
          int st = (int) lroundf(id(handrail_speed_step).state * 10);
          if (st < 1) st = 5;
          int g = id(target_speed_goal) + st;
          if (g < 6) g = 6;
          if (g > 180) g = 180;
          id(target_speed_goal) = g;
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

# Speed Down Button — физическая кнопка на GPIO14, уменьшает скорость.
  - platform: gpio
    pin:
      number: 14
      mode: INPUT_PULLUP
      inverted: true
    name: "Speed Down Button"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          // шаг из Handrail Speed Step (12.10)
          if (!id(motor_running)) return;
          int st = (int) lroundf(id(handrail_speed_step).state * 10);
          if (st < 1) st = 5;
          int g = id(target_speed_goal) - st;
          if (g < 6) g = 6;
          if (g > 180) g = 180;
          id(target_speed_goal) = g;
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

# Incline Up Button — физическая кнопка на GPIO9, увеличивает наклон.
  - platform: gpio
    pin:
      number: 9
      mode: INPUT_PULLUP
      inverted: true
    name: "Incline Up Button"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          // шаг из Handrail Incline Step (12.10)
          if (!id(motor_running)) return;
          float st = id(handrail_incline_step).state;
          if (!(st > 0)) st = 1.0f;
          float v = roundf((id(set_incline).state + st) * 10.0f) / 10.0f;
          if (v < 0) v = 0;
          if (v > 15) v = 15;
          id(set_incline).publish_state(v);
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

# Incline Down Button — физическая кнопка на GPIO10, уменьшает наклон.
  - platform: gpio
    pin:
      number: 10
      mode: INPUT_PULLUP
      inverted: true
    name: "Incline Down Button"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          // шаг из Handrail Incline Step (12.10)
          if (!id(motor_running)) return;
          float st = id(handrail_incline_step).state;
          if (!(st > 0)) st = 1.0f;
          float v = roundf((id(set_incline).state - st) * 10.0f) / 10.0f;
          if (v < 0) v = 0;
          if (v > 15) v = 15;
          id(set_incline).publish_state(v);
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms

# Текстовые сенсоры
text_sensor:

  # Web UI diagnostic snapshot: read-only firmware flags, NOT motor movement proof.
  # Published only when the value changes (no per-second spam in HA/logs).
  # Web UI liveness comes from web_server SSE ping/events, not from this sensor.
  - platform: template
    name: "UI Control State"
    id: ui_control_state
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      const char *state = id(pause_active)
          ? (id(motor_running) ? "unknown" : "paused")
          : (id(motor_running) ? "running" : "stopped");
      std::string snapshot = std::string(state) + "|" + (id(auto_mode) ? "auto" : "manual");
      static std::string last_published;
      if (snapshot == last_published) return {};
      last_published = snapshot;
      return snapshot;
  # - platform: template
  #   name: "Last Time"
  #   id: last_time_text
  #   icon: mdi:timer-outline
  #   update_interval: never
  #   lambda: |-
  #     return std::string("00:00:00"); 

  - platform: template
    name: "Training Start"
    id: start_training_date
    icon: mdi:calendar-start
    update_interval: never
    lambda: |-
      return id(start_training_date_stored);
  - platform: template
    name: "Training End"
    id: last_training_date
    icon: mdi:calendar-clock
    update_interval: never
    lambda: |-
      return id(last_training_date_stored);

  # Модель BLE‑устройства (fit_smart)
  - platform: ble_client
    name: "BT Model"
    id: name_bt_sensor
    ble_client_id: fit_smart
    service_uuid: "180A"
    characteristic_uuid: "2A29"
    update_interval: never

  # Версия прошивки ESPHome
  - platform: version
    id: ESPHomeVersion
    name: "ESPHome version"
    hide_timestamp: true

  # Отладочная информация (устройство, причина сброса)
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

  # Статус подключения пульсометра
  - platform: template
    name: "Pulse monitor"
    id: connection_status
    icon: "mdi:bluetooth"

  # Статус BLE‑сервера (например, Zwift)
  - platform: template
    name: "Zwift"
    id: ble_server_status
    icon: "mdi:bluetooth"

  # Границы зон пульса для веб-интерфейса: "max=176;rest=0;b=88,106,123,141,158,176"
  # (b = 50,60,70,80,90,100 % — по формуле/своему максимуму, % или Карвонен). Пишет update_heart_rate_zones.
  - platform: template
    name: "HR Zones"
    id: hr_zones_text
    icon: "mdi:heart-settings"
    entity_category: diagnostic

  # Выбранные данные (отображение текущего выбора)
  - platform: template
    name: "Selected Data"
    id: selected_data
    icon: "mdi:information"
    lambda: |-
      return {};

  # «локальный» статус для дорожки и дисплея. Статус программы (ручной/авто и т.п.)
  - platform: template
    name: "Status"
    id: program_status
    icon: "mdi:monitor-dashboard"
    lambda: |-
      return id(program_status).state;  // Просто возвращаем текущее значение
    on_value:
      - lambda: |-
          // 24.10: phase clock — the Treadmill Time second this phase began (pause keeps the phase running)
          if (id(pause_active)) return;
          const char ph = treadmill_recorder::phase_of(x);
          const int seg = x.rfind("Fartlek ", 0) == 0 ? atoi(x.c_str() + 8) : 0;   // fartlek: each segment is a phase (two Fast in a row too)
          static int seg_cur = -1;
          if (ph == treadmill_recorder::phase_cur && seg == seg_cur) return;
          treadmill_recorder::phase_cur = ph;
          seg_cur = seg;
          const float T = id(treadmill_time_sec).state;
          treadmill_recorder::phase_start_t = std::isnan(T) ? 0 : (int) T;
          id(phase_start_sensor).publish_state(treadmill_recorder::phase_start_t);

  # Статус FTMS (BLE‑протокол тренажёра)
  - platform: template
    name: "FTMS Status"
    id: ftms_status_sensor
    icon: "mdi:information-outline"
    entity_category: diagnostic
    update_interval: never  # Обновляем только вручную

  # Статус FTMS тренировки (Idle, Running и т.п.)
  - platform: template
    name: "Training Status"
    id: ftms_training_status_sensor
    icon: "mdi:information-outline"
    update_interval: never

