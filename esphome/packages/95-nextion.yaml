esphome:
  includes:
    - treadmill_nextion_output.h
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            treadmill_display::nextion = id(display_nextion);
            treadmill_display::phase_beep = []() { id(nx_beep).execute(); };

display:
  - platform: nextion
    uart_id: uart_0
    id: display_nextion
    tft_url: ${tft_url}
    tft_upload_http_buffer_size_tx: 1024   # 25.10: GitHub release redirect → ~600-char signed URL; the 512-B IDF default fails «Out of buffer»
    update_interval: 1s
    # command_spacing: 20ms        # Быстрее, но безопасно
    # max_queue_size: 50           # очередь — до 50 команд
    # max_commands_per_loop: 10    # Обрабатываем всё за раз
    on_buffer_overflow:
      then:
        - logger.log: "⚠️ Переполнение очереди Nextion!"
    # --- Синхронизация при старте ---
    on_setup:
      then:
        - lambda: 'id(nx_controls_ready) = false;'
        - delay: 500ms
        - lambda: |-
            int brightness = id(brightness_level);
            if (brightness < 20) {
              brightness = 20;
              id(brightness_level) = 20;
            }
            ESP_LOGI("Nextion", "Setting value for hbright");
            id(display_nextion).set_component_value("display.hbright", brightness);
            ESP_LOGI("Nextion", "Setting dim value");
            id(display_nextion).send_command_printf("dim=%d", brightness);
        - delay: 500ms
        - lambda: |-
            id(nx_safe_mode_switch).set_state(id(safe_mode_switch_state), true, true);
            id(nx_bt_tempmode).set_state(id(bt_tempmode_state), true, true);
            id(nx_bt_speed_correction).set_state(id(bt_speed_correction_state), true, true);
            id(nx_controls_ready) = true;

    # Глобальное отслеживание всех страниц — всё в одном месте
    on_page:
      then:
        - delay: 100ms
        - lambda: |-
            id(current_page) = x;                                    // сохраняем текущую страницу
            ESP_LOGI("Nextion", "Переход на страницу → %d", x);

            switch (x) {

              case 0:   // mainPage — главная
                id(map_select).publish_state("None");
                id(program_select).publish_state("None");
                break;

              case 1:   // speed — страница Speed
                id(display_nextion).send_command_printf("speed.h_position.maxval=%d",  (int)id(treadmill_slider_max).state);
                id(display_nextion).send_command_printf("speed.h_position.minval=%d",  (int)id(treadmill_slider_min).state);
                id(display_nextion).send_command_printf("speed.h_position1.maxval=%d", (int)id(treadmill_slider_max).state);
                id(display_nextion).send_command_printf("speed.h_position1.minval=%d", (int)id(treadmill_slider_min).state);

                {
                  int tempmotor = (int)id(temp).state;
                  if (tempmotor > 0) {
                    id(display_nextion).set_component_value("speed.ntemp", tempmotor);
                  }
                  id(temp).update();
                }
                break;

              case 2:   // pulsezone
                break;

              case 3:   // age
                {
                  id(display_nextion).send_command_printf("n_age.val=%d", (int)id(age_number).state);
                  id(display_nextion).send_command_printf("n_weight.val=%d", (int)id(weight_kg).state);
                  bool is_male = (id(gender_select).current_option() == "Male");
                  id(display_nextion).send_command_printf("age.bt0.val=%d", is_male ? 0 : 1);
                }
                break;

              case 5:   // Time
                id(display_nextion).send_command_printf("n_min.val=%d", (int)id(set_run_time).state);
                id(display_nextion).send_command_printf("n_warm.val=%d", (int)id(set_warm_up_time).state);
                id(display_nextion).send_command_printf("n_cool.val=%d", (int)id(set_cool_down_time).state);
                {
                  auto *d = id(display_nextion);
                  const bool route = id(map_select).current_option() == treadmill_routes::CUSTOM_NAME;
                  if (route) {
                    const int n = treadmill_routes::count.load();
                    const float km = (n >= 2) ? treadmill_routes::points[n - 1][0] : 0.0f;
                    d->set_component_text_printf("tRoute", "%.2f km", km);
                  }
                  d->send_command_printf("vis n_min,%d", route ? 0 : 1);
                  d->send_command_printf("tsw m1,%d", route ? 0 : 1);
                  d->send_command_printf("tsw m2,%d", route ? 0 : 1);
                  d->send_command_printf("vis tRoute,%d", route ? 1 : 0);
                }
                break;

              case 7:   // info
                //id(update_info_display).execute();
                break;

              case 8:   // avgsummary
                //id(update_info_display).execute();
                break;

              case 9:   // delayPage
                break;

              case 10:  // map
                break;

              case 11:  // modeselect
                break;

              case 12:  // mapmain: my routes list (rows r0..r4, paging)
                treadmill_routes::nx_build();
                treadmill_routes::nx_off = 0;
                id(nx_routes_render).execute();
                break;

              case 13:  // settings
                break;

              case 14:  // display
                id(display_nextion).set_component_value("bt_display_off", id(bt_display_off_state) ? 1 : 0);
                break;

              case 15:  // caldistspeed
                id(display_nextion).send_command_printf("caldistspeed.h_position.maxval=%d", (int)id(treadmill_slider_max).state);
                id(display_nextion).send_command_printf("caldistspeed.h_position.minval=%d", (int)id(treadmill_slider_min).state);
                id(display_nextion).set_component_text_printf("caldistspeed.t_speed_up", "%d", (int)id(accel_cm).state);
                id(display_nextion).set_component_text_printf("caldistspeed.t_speed_down", "%d", (int)id(decel_cm).state);
                id(display_nextion).set_component_text_printf("caldistspeed.t_lenght", "%d", (int)id(treadmill_length).state);
                break;

              case 16:  // info_page
                { std::string v = id(ESPHomeVersion).state; v = v.substr(0, v.find(' '));   // "2026.10.1 (config hash ...)" -> "2026.10.1"
                  id(display_nextion).set_component_text("tVersion", v.c_str()); }
                break;

              case 17:  // motor_page
                {
                  int tempmotor = (int)id(temp).state;
                  if (tempmotor > 0) {
                    id(display_nextion).set_component_value("motor.ntemp", tempmotor);
                  }
                  id(temp).update();
                }
                break;

              case 18:  // HIIT presets list
                id(nx_pre_load).execute(0);
                break;

              case 19:  // bluetooth
                break;

              case 20:  // Fartlek presets list
                id(nx_pre_load).execute(1);
                break;

              case 21:  // calibration
                break;

              case 22:  // system
                id(display_nextion).set_component_value("system.bt_savemode", id(safe_mode_switch_state) ? 1 : 0);
                id(display_nextion).set_component_value("system.bt_speed_corr", id(bt_speed_correction_state) ? 1 : 0);
                id(display_nextion).set_component_value("system.bt_tempmode", id(bt_tempmode_state) ? 1 : 0);
                break;


              case 23:  // calspeed
                break;

              case 24:  // temp_alert
                break;

              case 25:  // pause/resume_page
                break;


              default:
                break;
            }

        - lambda: |-
            // 1. Обновляем tstatus на странице Speed (page 1)
            if (id(current_page) == 1) {
              if (id(program_select).current_option() != "HIIT") {
                id(display_nextion).set_component_text("speed.tstatus", id(program_status).state.c_str());
              }
            }

            // 2. Bluetooth page (19) is filled every second by nx_hr_render (94-nextion-hr.yaml).

# Wake the display on every start (12.10): the start may come from the web, HA or Zwift while the screen is asleep.
# Only a wake-up + brightness; the display's own auto-off (TOF distance) works as before.
interval:
  - interval: 2s
    then:
      - lambda: |-
          if (id(current_page) == 12 &&
              (treadmill_routes::nx_owner != treadmill_profiles::library_owner() ||
               treadmill_routes::nx_revision != treadmill_routes::revision.load())) id(nx_routes_render).execute();
      - lambda: |-
          static bool was = false;
          bool run = id(motor_running);
          if (run && !was) {
            id(display_nextion).send_command_printf("sleep=0");
            id(display_nextion).send_command_printf("dim=%d", id(brightness_level) < 20 ? 20 : id(brightness_level));
            ESP_LOGI("Nextion", "Start: display woken, brightness restored");
          }
          was = run;

  # Main page (0) status bar: tTime (HH:MM), tHr (bpm) and pHr (heart: grey = no monitor, red = connected).
  # Sent only on change; caches reset on every page change so a fresh page 0 is filled at once.
  - interval: 250ms
    then:
      - lambda: |-
          static const int HR_PIC_OFF = 104, HR_PIC_ON = 103;   // Nextion picture ids: grey / red heart
          static int page = -1, hr_shown = -2, pic_shown = -2;
          static char time_shown[8] = "";
          static std::string user_shown;
          static bool user_dirty = true;
          if (id(current_page) != page) { page = id(current_page); hr_shown = pic_shown = -2; time_shown[0] = 0; user_dirty = true; }
          if (page == 19) id(nx_hr_render).execute();   // HR monitor picker (94-nextion-hr.yaml)
          if (page != 0) return;
          auto *d = id(display_nextion);
          // Applied profile only; display changes do not switch users.
          std::string user = treadmill_profiles::applied_owner_name;
          // Protect the Nextion quoted text command against user-entered quotes/backslashes.
          for (char &c : user) if (c == '"' || c == '\\') c = ' ';
          if (user_dirty || user != user_shown) {
            d->set_component_text("mainPage.tUser", user.c_str());
            user_shown = user;
            user_dirty = false;
          }
          auto now = id(sntp_time).now();
          char t[8] = "--:--";
          if (now.is_valid()) snprintf(t, sizeof t, "%02u:%02u", (unsigned) (now.hour % 24), (unsigned) (now.minute % 60));
          if (strcmp(t, time_shown) != 0) { d->set_component_text("mainPage.tTime", t); strcpy(time_shown, t); }
          const bool conn = id(fit_smart).connected();
          const float v = id(heart_rate_sensor).state;
          const int hr = (conn && !isnan(v) && v > 0) ? (int) lroundf(v) : -1;
          if (hr != hr_shown) {
            if (hr > 0) d->set_component_text_printf("mainPage.tHr", "%d", hr);
            else d->set_component_text("mainPage.tHr", "");
            hr_shown = hr;
          }
          const int pic = conn ? HR_PIC_ON : HR_PIC_OFF;
          if (pic >= 0 && pic != pic_shown) { d->send_command_printf("mainPage.pHr.pic=%d", pic); pic_shown = pic; }

# Display (TFT) version: string variable "ver" on page "load" (global). Read once at boot, then rarely.
text_sensor:
  - platform: nextion
    nextion_id: display_nextion
    id: display_version
    name: "Display Version"
    entity_category: diagnostic
    component_name: load.ver
    update_interval: 60s

# Training page HR display. The common sensor updates current_zone first.
sensor:
  - id: !extend heart_rate_sensor
    on_value:
      - lambda: |-
          static int last_heart_rate = -1;  // кэш текста
          static int last_zone = -1;        // кэш зоны

          if (isnan(x)) {
            if (id(current_page) == 1) {
              id(display_nextion).send_command_printf("p0.pic=%d;t0.txt=\"-\";t0.bco=%d", 7, 14792);
              ESP_LOGI("Nextion", "BLE disconnected, reset HR display");
            }
            return;
          }

          const int hr = (int)x;
          const int heart_rate_zone = id(current_zone);

          // обновляем текст пульса всегда при изменении
          if (id(current_page) == 1 && hr != last_heart_rate) {
            id(display_nextion).send_command_printf("t0.txt=\"%d\"", hr);
            ESP_LOGI("Nextion", "Update HR text: %d", hr);
            last_heart_rate = hr;
          }

          // картинка и фон — при смене зоны ИЛИ
          if ((id(current_page) == 1) && heart_rate_zone != last_zone) {
            uint16_t picture_ids[] = {7, 2, 3, 4, 5, 6};
            uint16_t colors[]      = {14792, 15487, 11744, 64992, 64294, 63688};

            uint16_t picture_id = picture_ids[heart_rate_zone];
            uint16_t t0_bco     = colors[heart_rate_zone];

            id(display_nextion).send_command_printf("p0.pic=%d", picture_id);
            id(display_nextion).send_command_printf("t0.bco=%d", t0_bco);

            ESP_LOGI("Nextion", "Update HR zone: %d", heart_rate_zone);
            last_zone = heart_rate_zone;
          }

  - id: !extend treadmill_speed_goal_sensor
    on_value:
      - lambda: |-
          static float last_sent = -100.0f;
          const float current = id(treadmill_speed_goal_sensor).state;
          if (fabs(current - last_sent) >= 0.05f) {
            last_sent = current;
            // Обновляем Nextion только на странице скорости
            if (id(current_page) == 1) {
              char speed_str[10];
              sprintf(speed_str, "%.1f", current);
              id(display_nextion).set_component_text("t1", speed_str);
              ESP_LOGD("Nextion", "Отправка команды на дисплей - скорость");
            }
          }

  - id: !extend treadmill_incline_goal_sensor
    on_value:
      - lambda: |-
          float current = id(treadmill_incline_goal_sensor).state;

          if (id(current_page) == 1) {
            char incline_str[10];
            sprintf(incline_str, "%.1f", current);
            id(display_nextion).set_component_text("t4", incline_str);
            ESP_LOGD("Nextion", "Отправка команды на дисплей - наклон");
          }

  - id: !extend treadmill_time_sec
    on_value:
      - lambda: |-
          const int total = (int)x;
          const int seconds = total % 60;

          if ((id(motor_running) || id(pause_active)) && (id(current_page) == 1)) {
            int total_minutes = total / 60;
            char time_str[32];
            snprintf(time_str, sizeof(time_str), "%02d:%02d", total_minutes, seconds);
            id(display_nextion).set_component_text("t3", time_str);
          }

  - id: !extend treadmill_distance_km
    on_value:
      - lambda: |-
          if (id(current_page) == 1) {
            char distance_str[10];
            sprintf(distance_str, "%.2f", id(treadmill_distance_km).state);
            id(display_nextion).set_component_text("t2", distance_str);
          }

# Display buttons delegate to the existing treadmill scripts.

# Map ID — сенсор выбора маршрута с дисплея Nextion (переменная mapid).
# При изменении значения публикует в map_select название и длину выбранного маршрута.
# Используется для синхронизации выбора карты между Nextion и ESPHome.
  - platform: nextion
    name: "Map ID"
    id: map_id_sensor
    variable_name: "mapid"
    #update_interval: 1s
    entity_category: diagnostic
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            // 17.10: встроенные трассы убраны из прошивки — маршруты только «свои» (веб-UI, Custom route)
            (void) x;


# Brightness Slider — ползунок яркости с дисплея Nextion.
# Обновляется каждые 2 секунды, сохраняет значение в переменную brightness_level.
  - platform: nextion
    id: nextion_slider
    component_name: display.hbright
    entity_category: diagnostic
    name: "Brightness Slider"
    update_interval: 2s
    on_value:
      then:
        - lambda: |-
            id(brightness_level) = (int)x;

# Age from Nextion — внутренний сенсор, читает возраст (n_age) с дисплея.
# При корректном значении (16–100 лет) обновляет number‑сенсор age_number.
# При некорректном вводе пишет предупреждение в лог.
  - platform: nextion
    nextion_id: display_nextion
    id: age_sensor
    name: "Age from Nextion"
    internal: true
    component_name: n_age
    on_value:
      then:
        - lambda: |-
            int new_age = x; // Значение от number_sensor
            if (new_age >= 16 && new_age <= 100) {
              id(age_number).make_call().set_value(new_age).perform();
              //id(age_number).publish_state(new_age);
              ESP_LOGI("Settings", "Age updated to: %d", new_age);
              //id(update_heart_rate_zones).execute(); // Обновляем зоны пульса
            } else {
              ESP_LOGW("Settings", "Invalid age value: %d", new_age);
            }


# Weight from Nextion — внутренний сенсор, читает n_weight с дисплея.
# При корректном значении (40–100 кг) обновляет weight_kg, иначе пишет предупреждение.
# Используется для учёта веса в расчётах (калории, MET и т.д.).
  - platform: nextion
    nextion_id: display_nextion
    id: weight_sensor
    name: "Weight from Nextion"
    internal: true
    component_name: n_weight
    on_value:
      then:
        - lambda: |-
            int new_weight = x; // Значение от Nextion
            if (new_weight >= 40 && new_weight <= 100) {
              id(weight_kg).make_call().set_value(new_weight).perform();
              //id(weight_kg).publish_state(new_weight);
              ESP_LOGI("Settings", "Weight updated to: %d kg", new_weight);
            } else {
              ESP_LOGW("Settings", "Invalid weight value: %d kg", new_weight);
            }


# Time from Nextion — внутренний сенсор, читает n_min (заданное время тренировки).
# При корректном значении (1–999 мин) обновляет set_run_time, иначе пишет предупреждение.
# Используется для задания длительности тренировки через интерфейс Nextion.
  - platform: nextion
    nextion_id: display_nextion
    id: time_sensor
    name: "time from Nextion"
    internal: true
    component_name: n_min
    on_value:
      then:
        - lambda: |-
            int new_time = x; // Значение от number_sensor
            if (new_time >= 1 && new_time <= 999) {
              //id(set_run_time).publish_state(new_time);
              id(set_run_time).make_call().set_value(new_time).perform();
              ESP_LOGI("Settings", "Age updated to: %d", new_time);
              //id(update_heart_rate_zones).execute(); // Обновляем зоны пульса
            } else {
              ESP_LOGW("Settings", "Invalid age value: %d", new_time);
            }

# Time Warm from Nextion — внутренний сенсор, читает n_warm (разминка).
# При корректном значении (0–10 мин) обновляет set_warm_up_time, иначе пишет предупреждение.
# Используется для задания длительности разминки.
  - platform: nextion
    nextion_id: display_nextion
    id: warm_sensor
    name: "time warm from Nextion"
    internal: true
    component_name: n_warm
    on_value:
      then:
        - lambda: |-
            int new_time_warm = x; // Значение от number_sensor
            if (new_time_warm >= 0 && new_time_warm <= 10) {
              //id(set_warm_up_time).publish_state(new_time_warm);
              id(set_warm_up_time).make_call().set_value(new_time_warm).perform();
              ESP_LOGI("Settings", "Age updated to: %d", new_time_warm);
              //id(update_heart_rate_zones).execute(); // Обновляем зоны пульса
            } else {
              ESP_LOGW("Settings", "Invalid age value: %d", new_time_warm);
            }

# Time Cool from Nextion — внутренний сенсор, читает n_cool (заминка).
# При корректном значении (0–10 мин) обновляет set_cool_down_time, иначе пишет предупреждение.
# Используется для задания длительности заминки.
  - platform: nextion
    nextion_id: display_nextion
    id: cool_sensor
    name: "time cool from Nextion"
    internal: true
    component_name: n_cool
    on_value:
      then:
        - lambda: |-
            int new_time_cool = x; // Значение от number_sensor
            if (new_time_cool >= 0 && new_time_cool <= 10) {
              //id(set_cool_down_time).publish_state(new_time_cool);
              id(set_cool_down_time).make_call().set_value(new_time_cool).perform();
              ESP_LOGI("Settings", "Age updated to: %d", new_time_cool);
              //id(update_heart_rate_zones).execute(); // Обновляем зоны пульса
            } else {
              ESP_LOGW("Settings", "Invalid age value: %d", new_time_cool);
            }

binary_sensor:
  - platform: nextion
    page_id: 1
    component_id: 15
    id: m0_stop
    on_press:
      then:
        - logger.log: "pause pressed"
        - script.execute: pause_training
        - lambda: id(m0_stop).publish_state(false);

  - platform: nextion
    page_id: 25
    component_id: 2
    id: bstop
    on_press:
      then:
        - logger.log: "bstop pressed, scheduling stop_program"
        - if:
            condition:
              lambda: 'return id(free_running_mode_switch).state || id(motor_running) || id(pause_active);'
            then:
              - script.execute: stop_program
              - lambda: id(bstop).publish_state(false);
            else:
              - logger.log: "bstop: Treadmill already stopped, skipping"

        - lambda: |-
            ESP_LOGI("Nextion", "Button (bstop) press");

  # bresume — кнопка на странице 13
  # Логирует событие, востанавливает тренировку
  - platform: nextion
    page_id: 25
    component_id: 1
    id: bresume
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("Nextion", "Button (bresume) press");
            id(bresume).publish_state(false);
        - script.execute: resume_training

  # bquick_start — кнопка быстрого старта на главной странице.
  # Запускает ручной режим после задержки, сбрасывает выбор программы.
  - platform: nextion
    page_id: 0
    component_id: 3
    id: bquick_start
    on_press:
      then:
        - lambda: 'ESP_LOGI("Nextion", "Button (bquick_start) press, start in 3.4 s");'
        - delay: 3400ms
        - script.execute: start_manual
        - lambda: |-
            id(program_select).publish_state("None");
            id(bquick_start).publish_state(false);

  # bfartlek — плитка Fartlek на главной странице (как bhiit): выбирает программу Fartlek.
  - platform: nextion
    page_id: 0
    component_id: 8
    id: bfartlek
    on_press:
      then:
        - lambda: |-
            id(program_select).publish_state("Fartlek");
            id(bfartlek).publish_state(false);

  # b_cal — кнопка калибровки (страница caldistspeed).
  # Меняет надписи на дисплее, показывает обратный отсчёт, запускает скрипт калибровки.
  - platform: nextion
    page_id: 15
    component_id: 4
    id: b_cal
    on_press:
      then:
        - lambda: |-
           id(display_nextion).set_component_text("b_cal", "Running...");
           id(display_nextion).set_component_text("caldistspeed.t_info_calib", "3");
           id(display_nextion).send_command_printf("p_zone.pic=76"); // картинка зоны
           ESP_LOGI("Nextion", "Sending command for p_zone.pic=76");
           id(display_nextion).set_component_text("caldistspeed.t_speed_up", "");
           id(display_nextion).set_component_text("caldistspeed.t_speed_down", "");
           id(display_nextion).set_component_text("caldistspeed.t_lenght", "");
        - delay: 1000ms
        - lambda: id(display_nextion).set_component_text("caldistspeed.t_info_calib", "2");
        - delay: 1000ms
        - lambda: id(display_nextion).set_component_text("caldistspeed.t_info_calib", "1");
        - delay: 1000ms
        - script.execute: start_calibration
        - lambda: |-
            id(b_cal).publish_state(false);
            ESP_LOGI("Nextion", "Button (b_cal) press");

  # bstart_program — кнопка запуска программы (страница Time).
