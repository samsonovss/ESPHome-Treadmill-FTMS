button:
# Update Nextion — обновляет прошивку дисплея Nextion (загрузка TFT‑файла).
  - platform: template
    id: update_nextion_button
    name: Update Nextion
    entity_category: diagnostic
    on_press:
      then:
        - lambda: 'id(display_nextion)->upload_tft();'

switch:
# Gender Switch — переключатель пола с дисплея Nextion (bt0).
# При значении 1 устанавливает "Female", при 0 — "Male".
# При изменении обновляет gender_select и запускает пересчёт пульсовых зон.
  - platform: nextion
    id: gender_switch
    name: "Gender Switch"
    internal: true
    component_name: bt0  # Соответствует имени в Nextion
    on_turn_on:  # bt0.val = 1 (Female)
      - lambda: |-
          if (id(gender_select).current_option() != "Female") {
            id(gender_select).publish_state("Female");
            ESP_LOGI("Settings", "Gender set to Female from bt0");
            id(update_heart_rate_zones).execute();
          }
    on_turn_off:  # bt0.val = 0 (Male)
      - lambda: |-
          if (id(gender_select).current_option() != "Male") {
            id(gender_select).publish_state("Male");
            ESP_LOGI("Settings", "Gender set to Male from bt0");
            id(update_heart_rate_zones).execute();
          }


#кнопка nextion для вкл/выкл дисплея по датчику растояния через 1 минуту
  - platform: nextion
    name: "Disp. auto on-off"
    id: bt_display_off
    component_name: display.bt_display_off
    on_turn_on:
      - globals.set:
          id: bt_display_off_state
          value: !lambda 'return id(bt_display_off).state;'
    on_turn_off:
      - globals.set:
          id: bt_display_off_state
          value: !lambda 'return id(bt_display_off).state;'

  - platform: nextion
    id: nx_safe_mode_switch
    internal: true
    component_name: system.bt_savemode
    on_turn_on:
      - lambda: 'if (id(nx_controls_ready) && !id(safe_mode_switch_state)) id(safe_mode_switch).turn_on();'
    on_turn_off:
      - lambda: 'if (id(nx_controls_ready) && id(safe_mode_switch_state)) id(safe_mode_switch).turn_off();'

  - id: !extend safe_mode_switch
    on_turn_on:
      - lambda: 'if (id(nx_controls_ready)) id(nx_safe_mode_switch).set_state(true, true, true);'
    on_turn_off:
      - lambda: 'if (id(nx_controls_ready)) id(nx_safe_mode_switch).set_state(false, true, true);'

  - platform: nextion
    id: nx_bt_tempmode
    internal: true
    component_name: system.bt_tempmode
    on_turn_on:
      - lambda: 'if (id(nx_controls_ready) && !id(bt_tempmode_state)) id(bt_tempmode).turn_on();'
    on_turn_off:
      - lambda: 'if (id(nx_controls_ready) && id(bt_tempmode_state)) id(bt_tempmode).turn_off();'

  - id: !extend bt_tempmode
    on_turn_on:
      - lambda: 'if (id(nx_controls_ready)) id(nx_bt_tempmode).set_state(true, true, true);'
    on_turn_off:
      - lambda: 'if (id(nx_controls_ready)) id(nx_bt_tempmode).set_state(false, true, true);'

  - platform: nextion
    id: nx_bt_speed_correction
    internal: true
    component_name: system.bt_speed_corr
    on_turn_on:
      - lambda: 'if (id(nx_controls_ready) && !id(bt_speed_correction_state)) id(bt_speed_correction).turn_on();'
    on_turn_off:
      - lambda: 'if (id(nx_controls_ready) && id(bt_speed_correction_state)) id(bt_speed_correction).turn_off();'

  - id: !extend bt_speed_correction
    on_turn_on:
      - lambda: 'if (id(nx_controls_ready)) id(nx_bt_speed_correction).set_state(true, true, true);'
    on_turn_off:
      - lambda: 'if (id(nx_controls_ready)) id(nx_bt_speed_correction).set_state(false, true, true);'

# Display feedback for the shared heart-rate BLE client.
ble_client:
  - id: !extend fit_smart
    on_connect:
      - then:
          - delay: 20ms
          - lambda: |-
              id(display_nextion).send_command_printf("hr=1");
              ESP_LOGI("Nextion", "Sending command for hr=1");
          - if:
              condition:
                lambda: 'return id(current_page) == 0;'
              then:
                - lambda: |-
                    id(display_nextion).send_command_printf("p_error.pic=15");
                    id(display_nextion).send_command_printf("vis p_error,1");
                    ESP_LOGI("Nextion", "Sending command for p_error.pic and vis p_error 1");
                - delay: 3000ms  # Задержка 3 секунды
                - lambda: |-
                    id(display_nextion).send_command_printf("vis p_error,0");
                    id(display_nextion).send_command_printf("mainPage.bhr_zone.aph=127");
                    id(display_nextion).send_command_printf("mainPage.bhiit.aph=127");
                    ESP_LOGI("Nextion", "Sending command for vis p_error 0 and mainPage.bhr_zone.aph=127 and mainPage.bhiit.aph=127");

                    //id(display_nextion).send_command_printf("mainPage.bfit_test.aph=127");
    on_disconnect:
      - then:
          - lambda: |-
              if (id(current_page) == 1) {
                id(display_nextion).set_component_text("b0", "-"); // Устанавливаем строку на дисплей
                id(display_nextion).send_command_printf("b0.pic=7");
                ESP_LOGI("Nextion", "Sending command for b0.pic=7");
              }

              // Устанавливаем значение hr в 0 отключено
              id(display_nextion).send_command_printf("hr=0");
              ESP_LOGI("Nextion", "Sending command for hr=0");
              // Если сейчас на главной — затемняем кнопки программ
              if (id(current_page) == 0) {
                id(display_nextion).send_command_printf("mainPage.bhr_zone.aph=80");
                id(display_nextion).send_command_printf("mainPage.bhiit.aph=80");
                ESP_LOGI("Nextion", "Sending command for mainPage.bhr_zone.aph=80 and mainPage.bhiit.aph=80");
                //id(display_nextion).send_command_printf("mainPage.bfit_test.aph=80");
              }
              id(display_nextion).set_component_text("bluetooth.tBatt", "-");
              id(display_nextion).set_component_text("bluetooth.tHr", "");
              id(display_nextion).set_component_text("bluetooth.tModel", "-");

globals:
  - id: nx_controls_ready
    type: bool
    restore_value: no
    initial_value: 'false'
