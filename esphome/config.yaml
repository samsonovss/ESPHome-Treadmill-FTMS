# Number-сенсоры (числовые параметры)
number:
# ============================
# Параметр HIIT High Zone (через number)
# ----------------------------
# Этот параметр задаёт максимальную зону пульса для HIIT.
# Вместо выбора из списка (select) теперь можно напрямую указать число.
# ============================
  # - platform: template
  #   name: "HIIT High Zone"
  #   id: hiit_high_zone
  #   optimistic: true
  #   min_value: 1       # минимальная зона
  #   max_value: 5       # максимальная зона
  #   step: 1            # шаг изменения
  #   unit_of_measurement: "zone"
  #   initial_value: 4   # по умолчанию зона 4


  # ============================
  # Параметры для обычных пульсовых программ
  # ----------------------------
  # Pulse Adjust Interval — задаёт, как часто (в секундах) 
  # будет выполняться коррекция скорости по пульсу 
  # в обычных программах (Pulse Zone, Fat Burn, Recovery run).
  # Не влияет на HIIT.
  # ============================
  - platform: template
    name: "Pulse Adjust Interval"
    id: pulse_adjust_interval
    optimistic: true
    min_value: 4       # минимум 4 секунды
    max_value: 12      # максимум 12 секунд
    step: 2            # шаг изменения
    unit_of_measurement: "s"
    initial_value: 10   # по умолчанию 4 секунды

  # ============================
  # Параметры HIIT (можно менять из интерфейса)
  # ----------------------------
  # Эти параметры управляют логикой интервальной тренировки:
  # - HIIT High Duration — длительность фазы высокой интенсивности.
  # - HIIT Low Duration  — длительность фазы низкой интенсивности.
  # - HIIT Low Speed     — скорость в фазе низкой интенсивности.
  # - HIIT Cycles        — количество повторов (high+low).
  # ============================
  - platform: template
    name: "HIIT High Duration"
    id: hiit_high_duration
    optimistic: true
    min_value: 30
    max_value: 600
    step: 30
    unit_of_measurement: "s"
    initial_value: 120   # по умолчанию 2 минуты

  - platform: template
    name: "HIIT Low Duration"
    id: hiit_low_duration
    optimistic: true
    min_value: 30
    max_value: 600
    step: 30
    unit_of_measurement: "s"
    initial_value: 120   # по умолчанию 2 минуты

  - platform: template
    name: "HIIT Low Speed"
    id: hiit_low_speed
    optimistic: true
    min_value: 3.0
    max_value: 8.0
    step: 0.5
    unit_of_measurement: "km/h"
    initial_value: 5.0   # по умолчанию 5 км/ч

  - platform: template
    name: "HIIT Cycles"
    id: hiit_cycles
    optimistic: true
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 6     # по умолчанию 6 повторов


# Free Run Step — шаг изменения скорости в свободном режиме (0.1–1.0 км/ч).
  - platform: template
    name: "Free Run Step"
    id: free_run_step
    optimistic: true
    min_value: 0.1
    max_value: 1.0
    step: 0.1
    unit_of_measurement: "км/ч"
    initial_value: 0.2   # по умолчанию 0.2 км/ч за секунду

# Age — возраст пользователя (16–100 лет).
# При изменении обновляет поле на дисплее и пересчитывает пульсовые зоны.
  - platform: template
    name: "Age"
    id: age_number
    min_value: 16
    max_value: 100
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: yes
    on_value:
      - lambda: |-
          //if (id(age).state) {
          id(display_nextion).send_command_printf("age.n_age.val=%d", (int)id(age_number).state);
          ESP_LOGI("Nextion", "Sending command for age.n_age.val");
          //}
      - script.execute: update_heart_rate_zones

# Weight — вес пользователя (40–100 кг).
# При изменении отправляется на дисплей Nextion.
  - platform: template
    name: "weight"
    id: weight_kg
    min_value: 40
    max_value: 100
    step: 1
    initial_value: 70
    optimistic: true
    restore_value: yes
    on_value:
      - lambda: |-
          // Отправляем вес на дисплей 
          id(display_nextion).send_command_printf("age.n_weight.val=%d", (int)id(weight_kg).state);
          ESP_LOGI("Nextion", "Sending weight to age.n_weight: %d kg", (int)id(weight_kg).state);
          //ESP_LOGI("Settings", "Weight updated to: %d kg", (int)id(weight_kg).state);

# Set Speed — целевая скорость (0.6–18.0 км/ч).
# При изменении обновляет goal и отправляет уведомление FTMS (Target Speed Changed).
  - platform: template
    name: "Set Speed"
    id: set_speed
    min_value: 0.6
    max_value: 18.0
    step: 0.1
    unit_of_measurement: "km/h"
    icon: "mdi:speedometer"
    optimistic: true
    restore_value: no
    initial_value: 0.0
    on_value:
      - lambda: |-
          if (id(auto_mode)) return;

          float speed = x;
          int target = static_cast<int>(speed * 10);  // десятые км/ч
          if (target < 6 && target != 0) target = 6;
          if (target > 180) target = 180;

          if (id(target_speed_goal) != target) {
            id(target_speed_goal) = target;

            // --- FTMS: Target Speed Changed (0x05) ---
            uint16_t ftms_speed = target * 10;  // значение в 0.01 км/ч
            uint8_t low  = ftms_speed & 0xFF;
            uint8_t high = ftms_speed >> 8;

            id(ftms_status_char).set_value({0x05, low, high});
            id(ftms_status_char).notify();
            id(last_ftms_status) = {0x05, low, high};
            id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x05));

            ESP_LOGI("treadmill", "Set Speed → %.1f км/ч (FTMS Target Speed Changed 0x05)", speed);
          }

        
# Set Incline — целевой наклон (0–15%).
# При изменении обновляет goal и отправляет уведомление FTMS (Target Incline Changed).
  - platform: template
    name: "Set Incline"
    id: set_incline
    min_value: 0
    max_value: 15
    step: 1
    unit_of_measurement: "%"
    icon: "mdi:angle-acute"
    optimistic: true
    on_value:
      - lambda: |-
          float incline = x;
          int16_t incline_value = static_cast<int16_t>(incline * 10);  // 0.1% шаг, signed (может быть отрицательным в теории)

          if (id(target_incline) != incline_value) {
            id(target_incline_goal) = incline_value;
            id(target_incline) = incline_value;

            // --- FTMS: Target Incline Changed (0x06) ---
            uint8_t low  = static_cast<uint8_t>(incline_value & 0xFF);
            uint8_t high = static_cast<uint8_t>(incline_value >> 8);

            id(ftms_status_char).set_value({0x06, low, high});
            id(ftms_status_char).notify();
            id(last_ftms_status) = {0x06, low, high};
            id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x06));

            ESP_LOGI("treadmill", "Set Incline → %.1f%% (FTMS Target Incline Changed 0x06)", incline);
          }

# Set Warm-up Time — длительность разминки (0–10 мин).
# При изменении обновляет поле на дисплее.
  - platform: template
    name: "Set Warm-up Time"
    id: set_warm_up_time
    min_value: 0
    max_value: 10
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer-play-outline"
    optimistic: true
    restore_value: yes
    initial_value: 0  # По умолчанию 5 минут
    on_value:
      - lambda: |-
          //if (id(age).state) {
          id(display_nextion).send_command_printf("Time.n_warm.val=%d", (int)id(set_warm_up_time).state);
          ESP_LOGI("Nextion", "Sending command for Time.n_warm.val");
          //}

# Set Run Time — длительность основной тренировки (0–240 мин).
# При изменении обновляет оставшееся время (remaining_run_time) и поле на дисплее.
  - platform: template
    name: "Set Run Time"
    id: set_run_time
    min_value: 0
    max_value: 240
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer"
    optimistic: true
    restore_value: yes
    initial_value: 0
    on_value:
      - lambda: |- 
          int new_time_seconds = (int)(x * 60);  // Преобразуем минуты в секунды
          if (id(motor_running)) {
            if (id(remaining_warm_up_time) <= 0 && !id(warm_up_active)) {
              // Обновляем только во время основной программы
              id(remaining_run_time) = new_time_seconds;
            } else if (id(remaining_warm_up_time) > 0 || id(warm_up_active)) {
              // Если идет разминка, восстанавливаем исходное значение ползунка
              id(set_run_time).publish_state(id(set_run_time).state);
            }
          } else {
            // Если мотор не работает, задаем начальное значение
            id(remaining_run_time) = new_time_seconds;
          }

          //if (id(age).state) {
          id(display_nextion).send_command_printf("Time.n_min.val=%d", (int)id(set_run_time).state);
          ESP_LOGI("Nextion", "Sending command for Time.n_min.val");
          //}

# Set Cool-down Time — длительность заминки (0–10 мин).
# При изменении обновляет поле на дисплее.
  - platform: template
    name: "Set Cool-down Time"
    id: set_cool_down_time
    min_value: 0
    max_value: 10
    step: 1
    unit_of_measurement: "min"
    icon: "mdi:timer-stop-outline"
    optimistic: true
    restore_value: yes
