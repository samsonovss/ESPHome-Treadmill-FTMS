# Логика работы (реализована в блоке interval):
#   1. Принимаем данные и собираем строку (до 30 байт).
#   2. Ищем команды в формате [КОМАНДА:ЗНАЧЕНИЕ].
#   3. Поддерживаемые команды:
#        • [SETSPD:x] → обновляет скорость дорожки (treadmill_speed_feedback).
#        • [SETINC:x] → обновляет наклон дорожки (treadmill_incline_feedback).
#          * Значения ≤1 интерпретируются как 0 (игнорируем «0.1%»).
#   4. Некорректные данные логируются как предупреждение.
#   5. Неизвестные команды просто выводятся в лог.
