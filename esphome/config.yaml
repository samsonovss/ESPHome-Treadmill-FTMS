# кнопка Nextion для вкл/выкл режима автокоррекции скорости по энкодеру
  - platform: nextion
    name: "Speed Correction Mode"
    id: bt_speed_correction
    component_name: system.bt_speed_corr
    on_turn_on:
      - globals.set:
          id: bt_speed_correction_state
          value: !lambda 'return id(bt_speed_correction).state;'
      - lambda: |-
          ESP_LOGI("Adaptive Correction", "enabled");
          // При включении адаптива сбрасываем накопитель в текущую цель
          id(target_speed_goal_float) = id(target_speed) / 10.0;
          id(display_nextion).send_command_printf("speed.p_sync.pic=96");

    on_turn_off:
      - globals.set:
          id: bt_speed_correction_state
          value: !lambda 'return id(bt_speed_correction).state;'
      - lambda: |-
          ESP_LOGI("Adaptive Correction", "disable");
          // При выключении тоже можно синхронизировать
          id(target_speed_goal_float) = id(target_speed) / 10.0;
          id(display_nextion).send_command_printf("speed.p_sync.pic=95");


# кнопка режима Free Run (шаблонный switch)
  - platform: template
    name: "Free Running Mode"
    id: free_running_mode_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          // Сохраняем текущий режим управления, если он не Free Run
          if (id(control_mode) != 1) {
            id(previous_control_mode) = id(control_mode);
          }
          // Переключаемся в режим Free Run
          id(control_mode) = 1;
          id(free_running_active) = true;
          ESP_LOGI("FreeRun", "Free Run включён, предыдущий режим: %d", id(previous_control_mode));
          id(display_nextion).send_command_printf("speed.p_icon_mode.pic=58"); // иконка
      - script.execute: free_running_mode
    on_turn_off:
      - lambda: |-
          // Восстанавливаем предыдущий режим управления
          id(control_mode) = id(previous_control_mode);
          id(free_running_active) = false;
          ESP_LOGI("FreeRun", "Free Run выключен, восстановлен режим: %d", id(control_mode));
          // Если активна программа Pulse Zone, возвращаем управление по пульсу
          if (id(control_mode) == 2) {
            id(auto_mode) = true;
            id(display_nextion).send_command_printf("speed.p_icon_mode.pic=59"); // иконка пульс
            ESP_LOGI("FreeRun", "Возвращено управление по пульсу");
          } else {
            id(auto_mode) = false;
            id(display_nextion).send_command_printf("speed.p_icon_mode.pic=62"); // иконка убрать
            ESP_LOGI("FreeRun", "Возвращено ручное управление");
          }

# ***************** Display (Nextion) *****************
# 1. Подключение Nextion по UART (uart_0)
#    • Автоматическая загрузка TFT-прошивки по HTTP
#    • update_interval: 1s — гарантирует вызов lambda ровно раз в секунду
#    • При переполнении очереди команд — предупреждение в лог
#
# 2. Инициализация при старте (on_setup):
#    • Устанавливает минимальную яркость 20% и синхронизирует слайдер hbright + команда dim
#    • Настраивает пределы слайдеров скорости (min/max) на всех нужных страницах
#    • Обновляет текстовые поля калибровки (ускорение, замедление, длина полотна)
#    • Синхронизирует состояние всех переключателей (display_off, safe_mode, speed_correction, tempmode)
#    • Между командами — задержки 500 мс для стабильной работы Nextion
#
# 3. Отслеживание текущей страницы (on_page):
#    • Сохраняет номер страницы в глобальную переменную id(current_page)
#    • По switch(x) выполняет действия **только один раз при открытии страницы**:
#        – page 0  → сброс выбора карты и программы
#        – page 1  → показ температуры мотора + запрос нового измерения
#        – page 3  → отправка возраста, веса, пола
#        – page 5  → отправка времени тренировки, разминки, заминки
#        – page 16 → отображение версии ESPHome
#        – page 17 → показ температуры мотора (страница Motor)
#
# 4. Периодическое обновление (lambda вызывается каждую секунду благодаря update_interval: 1s):
#    • page 1 (Speed)      → обновление поля speed.tstatus (статус программы, кроме HIIT)
#    • page 19 (Bluetooth) → обновление батареи, пульса и имени устройства при подключении,
#                             очистка полей при отключении
#
# В результате:
# • Инициализация при входе на страницу — мгновенная и без дублирования
# • Часто меняющиеся данные (статус, пульс, батарея) — обновляются ровно раз в секунду
# • Полная совместимость с goto_page() и физическим переключением страниц
# • Код чистый, соответствует официальным рекомендациям ESPHome 2025+
display:
  - platform: nextion
    uart_id: uart_0
    id: display_nextion
    update_interval: 1s
    tft_url: http://192.168.1.189:8123/local/nextion_treadmill_4.3_ips_800x480.tft
    # command_spacing: 20ms        # Быстрее, но безопасно
    # max_queue_size: 50           # очередь — до 50 команд
    # max_commands_per_loop: 10    # Обрабатываем всё за раз
    on_buffer_overflow:
      then:
        - logger.log: "⚠️ Переполнение очереди Nextion!"
    # --- Синхронизация при старте ---
    on_setup:
      then:
        - lambda: |-
            int brightness = id(brightness_level);
            if (brightness < 20) {
              brightness = 20;
              id(brightness_level) = 20;
            }
            ESP_LOGI("Nextion", "Setting value for hbright");
            id(display_nextion).set_component_value("display.hbright", brightness);
            ESP_LOGI("Nextion", "Setting dim value");
            id(display_nextion).send_command_printf("dim=%d", brightness);

        - delay: 500ms
        - switch.nextion.publish:
            id: bt_display_off
            state: !lambda 'return id(bt_display_off_state);'
            publish_state: true
            send_to_nextion: false
        - delay: 500ms
        - switch.nextion.publish:
            id: safe_mode_switch
            state: !lambda 'return id(safe_mode_switch_state);'
            publish_state: true
            send_to_nextion: false
        - delay: 500ms
        - switch.nextion.publish:
            id: bt_speed_correction
            state: !lambda 'return id(bt_speed_correction_state);'
            publish_state: true
            send_to_nextion: false
        - delay: 500ms
        - switch.nextion.publish:
            id: bt_tempmode
            state: !lambda 'return id(bt_tempmode_state);'
            publish_state: true
            send_to_nextion: false


    # Глобальное отслеживание всех страниц — всё в одном месте
    on_page:
      then:
        - lambda: |-
            id(current_page) = x;                                    // сохраняем текущую страницу
            ESP_LOGI("Nextion", "Переход на страницу → %d", x);

            switch (x) {

              case 0:   // mainPage — главная
                id(map_select).publish_state("None");
                id(program_select).publish_state("None");
                break;

              case 1:   // speed — страница Speed
                id(display_nextion).send_command_printf("speed.h_position.maxval=%d",  (int)id(treadmill_slider_max).state);
                id(display_nextion).send_command_printf("speed.h_position.minval=%d",  (int)id(treadmill_slider_min).state);
                id(display_nextion).send_command_printf("speed.h_position1.maxval=%d", (int)id(treadmill_slider_max).state);
                id(display_nextion).send_command_printf("speed.h_position1.minval=%d", (int)id(treadmill_slider_min).state);

                {
                  int tempmotor = (int)id(temp).state;
                  if (tempmotor > 0) {
                    id(display_nextion).set_component_value("speed.ntemp", tempmotor);
                  }
                  id(temp).update();
                }
                break;

              case 2:   // pulsezone
                break;

              case 3:   // age
                {
                  id(display_nextion).send_command_printf("n_age.val=%d", (int)id(age_number).state);
                  id(display_nextion).send_command_printf("n_weight.val=%d", (int)id(weight_kg).state);
                  bool is_male = (id(gender_select).current_option() == "Male");
                  id(display_nextion).send_command_printf("age.bt0.val=%d", is_male ? 0 : 1);
                }
                break;

              case 5:   // Time
                id(display_nextion).send_command_printf("n_min.val=%d", (int)id(set_run_time).state);
                id(display_nextion).send_command_printf("n_warm.val=%d", (int)id(set_warm_up_time).state);
                id(display_nextion).send_command_printf("n_cool.val=%d", (int)id(set_cool_down_time).state);
                break;

              case 7:   // info
                break;

              case 8:   // avgsummary
                break;

              case 9:   // delayPage
                break;

              case 10:  // map
                break;

              case 11:  // modeselect
                break;

              case 12:  // mapmain
                break;

              case 13:  // settings
                break;

              case 14:  // display
                break;

              case 15:  // caldistspeed
                id(display_nextion).send_command_printf("caldistspeed.h_position.maxval=%d", (int)id(treadmill_slider_max).state);
                id(display_nextion).send_command_printf("caldistspeed.h_position.minval=%d", (int)id(treadmill_slider_min).state);
                id(display_nextion).set_component_text_printf("caldistspeed.t_speed_up", "%d", (int)id(accel_cm).state);
                id(display_nextion).set_component_text_printf("caldistspeed.t_speed_down", "%d", (int)id(decel_cm).state);
                id(display_nextion).set_component_text_printf("caldistspeed.t_lenght", "%d", (int)id(treadmill_length).state);
                break;

              case 16:  // info_page
                id(display_nextion).set_component_text_printf("tVersion", id(ESPHomeVersion).state.c_str());
                break;

              case 17:  // motor_page
                {
                  int tempmotor = (int)id(temp).state;
                  if (tempmotor > 0) {
                    id(display_nextion).set_component_value("motor.ntemp", tempmotor);
                  }
                  id(temp).update();
                }
                break;

              case 18:  // zwift
                break;

              case 19:  // bluetooth
                break;

              case 20:  // zwift1
                break;

              case 21:  // calibration
                break;

              case 22:  // system
                break;

              case 23:  // calspeed
                break;

              case 24:  // temp_alert
                break;

              case 25:  // pause/resume_page
                break;


              default:
                break;
            }

        - lambda: |-
            // 1. Обновляем tstatus на странице Speed (page 1)
            if (id(current_page) == 1) {
              if (id(program_select).current_option() != "HIIT") {
                id(display_nextion).set_component_text("speed.tstatus", id(program_status).state.c_str());
              }
            }

            // 2. Обновляем Bluetooth-страницу (page 19) каждую секунду
            if (id(current_page) == 19) {
              if (id(fit_smart).connected()) {
                char buf[12];
                sprintf(buf, "%.0f%%", id(battery_level_sensor).state);
                id(display_nextion).set_component_text("bluetooth.battery", buf);

                char hr_str[10];
                sprintf(hr_str, "%.0f", id(heart_rate_sensor).state);
                id(display_nextion).set_component_text("bluetooth.bpm", hr_str);

                id(display_nextion).set_component_text("bluetooth.name_bt", id(name_bt_sensor).state.c_str());
              } else {
                id(display_nextion).set_component_text("bluetooth.bpm", "");
                id(display_nextion).set_component_text("bluetooth.name_bt", "-");
                id(display_nextion).set_component_text("bluetooth.battery", "-");
              }
            }






