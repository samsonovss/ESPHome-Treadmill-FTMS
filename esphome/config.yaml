# ESP32 BLE Server — реализация протокола FTMS (Fitness Machine Service) для беговой дорожки
# 
# 1. Общие сведения:
#    - Модель: "Treadmill Controller", производитель: "ESP32-S3", версия прошивки: 1.0.0.
#    - Реализует стандартный сервис FTMS (UUID 0x1826), полностью совместимый с Zwift, Kinomap, Garmin, Polar, Wahoo и др.
#
# 2. События подключения:
#    - on_connect:
#        • Устанавливает флаг ble_client_connected = true
#        • Публикует статус "Подключен"
#        • Если мотор не работает — отправляет Training Status = Idle (0x01)
#    - on_disconnect:
#        • Сбрасывает флаг ble_client_connected = false
#        • Публикует статус "Отключен"
#
# 3. Характеристики FTMS (все реализованы корректно):
#    - 2ACD  Treadmill Data            → notify, поток телеметрии (скорость, дистанция, наклон, пульс, время)
#    - 2ACC  Fitness Machine Feature   → фиксированные возможности (поддержка скорости, дистанции, наклона, пульса)
#    - 2ADA  Fitness Machine Status    → уведомления о смене цели (Target Speed/Incline Changed и др.)
#    - 2AD3  Training Status           → текущее состояние тренировки (Idle, Running, Paused, Finished)
#    - 2AD4  Supported Speed Range     → 0.0 – 18.0 км/ч, шаг 0.1 км/ч
#    - 2AD5  Supported Inclination     → 0.0 – 15.0 %, шаг 1.0 %
#    - 2AD9  Fitness Machine Control Point → основная точка управления
#
# 4. Обработка команд Control Point (2AD9) — полностью соответствует спецификации FTMS v1.0:
#    - 0x00 Request Control          → всегда Success
#    - 0x07 Start / Resume           → запускает выбранную программу или ручной режим (если не стоит manual_stop)
#    - 0x08 Stop / Pause             → вызывает stop_program
#    - 0x02 Set Target Speed         → принимает значение в 0.01 км/ч (0.6–18.0), сохраняет в target_speed_goal
#                                        и отправляет уведомление 0x05 (Target Speed Changed)
#    - 0x03 Set Target Incline       → принимает значение в 0.1 %, с защитой от спама (<500 мс)
#                                        и отправляет уведомление 0x06 (Target Incline Changed)
#    - Все остальные опкоды           → Op Code Not Supported (0x06)
#
# 5. Ответы и уведомления:
#    - На каждую команду всегда отправляется ответ {0x80, op_code, result_code}
#    - При успешной смене цели — дополнительно notify в Fitness Machine Status (2ADA)
#    - Training Status (2AD3) обновляется вручную в других местах (например, при старте/паузе/финише)
#
# В результате ESP32 выступает как полноценный FTMS-тренажёр: внешние приложения могут
# подключаться, управлять скоростью и наклоном, получать телеметрию в реальном времени.
esp32_ble_server:
  model: Treadmill Controller
  manufacturer: "ESP32-S3"
  firmware_version: "1.0.0"
  on_connect:
    - globals.set:
        id: ble_client_connected
        value: 'true'
    - text_sensor.template.publish:
        id: ble_server_status
        state: "Подключен"
    - lambda: |-
        // Отправка Training Status: Idle (0x01) при подключении
        if (!id(motor_running)) {
          id(training_status_char).set_value({0x00, 0x01});
          id(training_status_char).notify();
          id(last_training_status) = {0x00, 0x01};
          id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x01));
          ESP_LOGI("FTMS", "BLE клиент подключён: Training Status = Idle (0x01)");
        }
  on_disconnect:
    - globals.set:
        id: ble_client_connected
        value: 'false'
    - text_sensor.template.publish:
        id: ble_server_status
        state: "Отключен"
  services:
    - uuid: "1826"  # FTMS
      advertise: true
      characteristics:
        - uuid: "2ACD"  # Treadmill Data
          id: treadmill_data_char
          notify: true
          read: true
          value: !lambda 'return id(treadmill_data_char).get_value();'
        - uuid: "2ACC"  # Fitness Machine Feature
          id: ftms_feature_char
          read: true
          value: !lambda |-
            // 32бита (0000 0000 0000 0000 0001 0100 0000 1101)
            uint32_t features = 0x140D; // Speed, Distance, Incline, Heart Rate, Time supported
            // 32бита (0000 0000 0000 0000 0000 0000 0000 0011)
            uint32_t target_features = 0x0003;  // Speed Target + Incline Target supported
            std::vector<uint8_t> data;
            data.push_back(features & 0xFF);         // 0x0D
            data.push_back((features >> 8) & 0xFF);  // 0x14
            data.push_back((features >> 16) & 0xFF); // 0x00
            data.push_back((features >> 24) & 0xFF); // 0x00
            data.push_back(target_features & 0xFF);  // 0x03
            data.push_back((target_features >> 8) & 0xFF);  // 0x00
            data.push_back((target_features >> 16) & 0xFF); // 0x00
            data.push_back((target_features >> 24) & 0xFF); // 0x00
            return data;
        - uuid: "2ADA"  # Fitness Machine Status
          id: ftms_status_char
          notify: true
          read: true
          value: !lambda |-
            return id(last_ftms_status);
        - uuid: "2AD3"  # Training Status
          id: training_status_char
          notify: true
          read: true
          value: !lambda |-
            return id(last_training_status);
        - uuid: "2AD4"  # Supported Speed Range
          id: supported_speed_range
          read: true
          value: !lambda |-
            // min: 0.0 км/ч (0), max: 12.0 км/ч (1200), increment: 0.1 км/ч (10)
            //return std::vector<uint8_t>{0x00, 0x00, 0xB0, 0x04, 0x0A, 0x00};
            // min: 0.0 км/ч (0), max: 18.0 км/ч (1800), increment: 0.1 км/ч (10)
            return std::vector<uint8_t>{0x00, 0x00, 0x08, 0x07, 0x0A, 0x00};
        - uuid: "2AD5"  # Supported Inclination Range
          id: supported_incline_range
          read: true
          value: !lambda |-
            // min: 0.0% (0), max: 15.0% (150), increment: 1.0% (10)
            return std::vector<uint8_t>{0x00, 0x00, 0x96, 0x00, 0x0A, 0x00};
        - uuid: "2AD9"  # Fitness Machine Control Point
          id: ftms_control_point_char
          write: true
          on_write:
            then:
              - lambda: |-
                  if (x.empty()) return;

                  uint8_t op_code = x[0];
                  uint8_t result_code = 0x06;  // По умолчанию: Op Code Not Supported

                  // Логирование команды
                  std::string hex_data;
                  for (size_t i = 0; i < x.size(); ++i) {
                    char buf[4];
                    snprintf(buf, sizeof(buf), "%02X ", x[i]);
                    hex_data += buf;
                  }
                  ESP_LOGI("FTMS", "Control Point ← 0x%02X (%d байт): %s", op_code, x.size(), hex_data.c_str());

                  // === Обработка команд ===
                  if (op_code == 0x00) {  // Request Control
                    result_code = 0x01;  // Success
                    ESP_LOGI("FTMS", "Request Control — успех");

                  } else if (op_code == 0x07) {  // Start / Resume
                    if (id(manual_stop)) {
                      result_code = 0x02;  // Invalid Parameter
                      ESP_LOGW("FTMS", "Start отклонён: ручная остановка");
                    } else if (id(motor_running)) {
                      result_code = 0x01;
                      ESP_LOGI("FTMS", "Start — тренажёр уже работает");
                    } else {
                      if (id(program_select).current_option() != "None")
                        id(start_program).execute();
                      else
                        id(start_manual).execute();
                      result_code = 0x01;
                      ESP_LOGI("FTMS", "Start — запуск выполнен");
                    }

                  } else if (op_code == 0x08) {  // Stop / Pause
                    id(stop_program).execute();
                    result_code = 0x01;
                    ESP_LOGI("FTMS", "Stop — выполнен");

                  } else if (op_code == 0x02 && x.size() >= 3) {  // Set Target Speed
                    float kmh = (x[1] | (x[2] << 8)) / 100.0f;
                    if (kmh >= 0.6f && kmh <= 18.0f) {
                      id(target_speed_goal) = (int)(kmh * 10);
                      result_code = 0x01;

                      id(ftms_status_char).set_value({0x05, x[1], x[2]});
                      id(ftms_status_char).notify();
                      id(last_ftms_status) = {0x05, x[1], x[2]};
                      id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x05));

                      ESP_LOGI("FTMS", "Target Speed → %.2f км/ч", kmh);
                    } else {
                      result_code = 0x02;
                      ESP_LOGW("FTMS", "Target Speed отклонён: %.2f км/ч", kmh);
                    }

                  } else if (op_code == 0x03 && x.size() >= 3) {  // Set Target Incline
                    static uint32_t last_time = 0;
                    if (millis() - last_time < 500) {
                      ESP_LOGI("FTMS", "Incline команда слишком часто — игнор");
                      return;
                    }
                    last_time = millis();

                    float incline = (static_cast<int16_t>(x[1] | (x[2] << 8))) / 10.0f;
                    if (incline >= 0.0f && incline <= 15.0f) {
                      id(set_incline).publish_state(incline);
                      id(target_incline_goal) = (int)(incline * 10);
                      id(target_incline) = id(target_incline_goal);
                      result_code = 0x01;

                      id(ftms_status_char).set_value({0x06, x[1], x[2]});
                      id(ftms_status_char).notify();
                      id(last_ftms_status) = {0x06, x[1], x[2]};
                      id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x06));

                      ESP_LOGI("FTMS", "Target Incline → %.1f%%", incline);
                    } else {
                      result_code = 0x02;
                      ESP_LOGW("FTMS", "Target Incline отклонён: %.1f%%", incline);
                    }

                  } else {
                    ESP_LOGW("FTMS", "Неизвестная команда Control Point: 0x%02X", op_code);
                  }

                  // Ответ всегда 3 байта: 0x80 + op_code + result_code (FTMS v1.0, Table 4.20)
                  id(ftms_control_point_char).set_value({0x80, op_code, result_code});
                  id(ftms_control_point_char).notify();
                  ESP_LOGI("FTMS", "Control Point → ответ 0x80 0x%02X 0x%02X", op_code, result_code);

