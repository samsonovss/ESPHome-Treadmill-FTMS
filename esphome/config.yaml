    tx_pin: 
      number: GPIO17
      inverted: false
    rx_pin: 
      number: GPIO18
      mode: 
        input: true
        pullup: true
      inverted: false
    baud_rate: 4800
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512
