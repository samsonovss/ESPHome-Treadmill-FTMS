    # range_status:
    #   name: My Range Status
    #   id: my_range_status
    update_interval: 1s


# My Distance — шаблонный сенсор, переводит my_raw_distance из мм в см.
# Округляет до целого, обновляется раз в секунду (только при изменении ≥1 см).
# При каждом обновлении отправляет значение на дисплей Nextion.
# Если активна калибровка — обновляет min/max расстояния (0–150 см) и пишет в лог.
  - platform: template
    id: my_distance
    name: "My Distance"
    unit_of_measurement: "cm"
    state_class: "measurement"
    device_class: "distance"
    accuracy_decimals: 0
    lambda: |-
      return id(my_raw_distance).state / 10.0;
    filters:
      - delta: 1.0
    update_interval: 1s
    on_value:
      then:
        - lambda: |-
            float distance = x;
            int position_value = (int)distance;

            // Обновление дисплея Nextion
            id(display_nextion).send_command_printf("position=%d", position_value);
            //ESP_LOGI("Nextion", "Sending command for position");
            //if (id(caldistspeed).state) {
              //id(display_nextion).send_command_printf("caldistspeed.ndist.val=%d", position_value);
              //ESP_LOGI("Nextion", "Sending command for caldistspeed.ndist.val");
            //}
            // Логика калибровки
            if (id(calibration_active)) {
              // Проверяем, что значение в разумном диапазоне (0–150 см)
              if (distance > 0.0 && distance < 150.0) {
                if (distance < id(calibration_min_distance)) {
                  id(calibration_min_distance) = distance;
                  ESP_LOGI("Calibration", "Новое минимальное расстояние: %.1f см", distance);
                }
                if (distance > id(calibration_max_distance)) {
                  id(calibration_max_distance) = distance;
                  ESP_LOGI("Calibration", "Новое максимальное расстояние: %.1f см", distance);
                }
              }
            }


# Сенсор температуры мотора (DS18B20 через Dallas)
# 1. Читает температуру с датчика по адресу 0xdf3ce0f64959df28.
# 2. Обновление каждые 5 секунд (update_interval: 5s).
# 3. Фильтр: игнорирует ложные нули (возвращает NAN, если x == 0.0).
# 4. При каждом обновлении:
#    - Если значение корректное:
#        * Преобразует температуру в целое число (°C).
#        * Отправляет её на дисплей Nextion:
#            - speed.ntemp (если активна страница скорости).
#            - motor.ntemp (если активна страница мотора).
#        * Обновление происходит только при изменении значения (чтобы не спамить дисплей).
#    - Контроль перегрева:
#        * Если включён режим контроля температуры (bt_tempmode) и мотор работает.
#        * При превышении 85°C:
#            - Логируется предупреждение.
#            - На дисплее переключается страница 24 (страница аварии).
#            - В program_status публикуется "Overheat Emergency Stop".
#            - Выполняется аварийная остановка дорожки (stop_program).
  - platform: dallas_temp
    address: 0xdf3ce0f64959df28
    name: "Motor"
    id: temp
    force_update: false
    update_interval: 5s
    filters:
      - lambda: |-
          if (x == 0.0) return NAN;   // игнорируем ложные нули
          return x;
    on_value:
      then:
        - lambda: |-
            float temp_value = id(temp).state;
            if (!isnan(temp_value)) {
              int tempmotor = (int)temp_value;

              static int last_sent_temp = -1000;
              if (tempmotor != last_sent_temp) {
                last_sent_temp = tempmotor;

                if (id(current_page) == 1) {
                  id(display_nextion).set_component_value("speed.ntemp", tempmotor);
                  ESP_LOGI("Nextion", "Setting value for speed.ntemp = %d", tempmotor);
                }
                if (id(current_page) == 10) {
                  id(display_nextion).set_component_value("motor.ntemp", tempmotor);
                  ESP_LOGI("Nextion", "Setting value for motor.ntemp = %d", tempmotor);
                }
              }
            }

            // --- контроль перегрева ---
            if (id(current_page) == 1) {
              if (id(bt_tempmode).state && !isnan(temp_value) && temp_value > 85.0) {
                ESP_LOGW("Overheat", "Температура мотора >85°C! Остановка дорожки.");
                id(display_nextion).send_command_printf("page 24");
                id(program_status).publish_state("Overheat Emergency Stop");
                id(stop_program).execute();
              }
            }


# ------------------------------------------------------------
# Сенсор "Calories Burned"
# Логика работы:
# 1. Берём данные пользователя (вес, возраст, пол) и вычисляем
#    максимальный пульс по полу и возрасту.
# 2. Считаем средние значения за тренировку: скорость, наклон,
#    пульс, время.
# 3. Переводим скорость и наклон в параметры для формулы ACSM.
#    Она даёт VO₂ (потребление кислорода, мл/кг/мин).
# 4. VO₂ переводим в MET (метаболический эквивалент нагрузки).
# 5. Если пульс высокий (>70% от максимального), добавляем
#    поправку до +10% к MET.
# 6. MET × вес = расход энергии в ккал/час.
# 7. Умножаем на время тренировки → итоговые калории.
# 8. При паузе значение замирает, при остановке дорожки
#    сбрасывается в 0.
# ------------------------------------------------------------
  - platform: template
    name: "Calories Burned"
    id: total_calories
    unit_of_measurement: "kcal"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      // Если мотор выключен — тренировка закончена, сбрасываем калории
      //if (!id(motor_running)) {
        //return 0.0f;
      //}

      // Если активна пауза — калории замирают, возвращаем предыдущее значение
      if (id(pause_active)) {
        return id(total_calories).state;
      }

      // --- 1. Базовые данные пользователя ---
      float weight = id(weight_kg).state;                          // Вес в кг
      int age = id(age_number).state;                              // Возраст
      bool is_male = (id(gender_select).current_option() == "Male");
      // формула для максимального пульса (разные для мужчин и женщин)
      float max_hr = (is_male) ? (214 - 0.8 * age) : (209 - 0.7 * age); 

      // --- 2. Средние значения за тренировку ---
      float time_sec = id(treadmill_time_sec).state;                                                             // Время в секундах
      float avg_speed = (id(speed_count) > 0) ? (id(total_speed_sum) / id(speed_count)) : 0;                     // средняя скорость
      float avg_incline = (id(incline_count) > 0) ? (id(total_incline_sum) / id(incline_count)) : 0;             // средний наклон
      float avg_heart_rate = (id(heart_rate_count) > 0) ? (id(total_heart_rate_sum) / id(heart_rate_count)) : 0; // средний пульс

      // --- 3. Пересчёт наклона дорожки в реальный наклон ---
      float real_incline = avg_incline / 3.0f;                     // 15% дорожки ≈ 5% реального уклона

      // --- 4. Пересчёт скорости и уклона ---
      float speed_m_per_min = avg_speed * 1000.0f / 60.0f;         // км/ч → м/мин
      float grade = real_incline / 100.0f;                         // % → доля

      // --- 5. Уравнение ACSM для VO₂ (мл/кг/мин) ---
      // формула учитывает горизонтальную составляющую, наклон и базовый обмен
      float vo2 = 0.1f * speed_m_per_min
                + 1.8f * speed_m_per_min * grade
                + 3.5f;

      // --- 6. Перевод VO₂ в MET ---
      // 1 MET = 3.5 мл/кг/мин
      float met = vo2 / 3.5f;

      // --- 7. Коррекция по пульсу ---
      // если пульс выше 70% от максимального, добавляем до +10% к MET
      float hr_ratio = avg_heart_rate / max_hr;
      if (hr_ratio > 0.7f) {
        float hr_factor = 1.0f + (hr_ratio - 0.7f) * 0.2f;         // рост до 10% при 90% HR
        if (hr_factor > 1.1f) hr_factor = 1.1f;
        met *= hr_factor;
      }

      // --- 8. Перевод MET в калории ---
      float calories_per_hour = met * weight;                      // ккал/час
      float calories = (calories_per_hour * time_sec) / 3600.0f; // ккал за прошедшее время

      // --- 9. Ограничение на отрицательные значения ---
      if (calories < 0) calories = 0;

      // --- 10. Логирование для отладки ---
      //ESP_LOGI("Calories",
        //"VO₂: %.2f, MET: %.2f, Weight: %.1f, Time: %.2f min, Avg Speed: %.2f, Avg Incline: %.2f, Real Incline: %.2f, Avg HR: %.0f, Calories: %.0f",
        //vo2, met, weight, time_sec / 60.0f, avg_speed, avg_incline, real_incline, avg_heart_rate, calories);

      return calories;

# Average Heart Rate — средний пульс за тренировку.
# Считает сумму всех замеров и делит на их количество.
# Если замеров нет → возвращает 0. Используется для отображения средней нагрузки.
  - platform: template
    name: "Average Heart Rate"
