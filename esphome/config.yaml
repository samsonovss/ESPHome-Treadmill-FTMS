# Treadmill Speed (Goal) — целевая скорость, отображаемая на дисплее.
# При паузе показывает сохранённое значение, при работе мотора — текущую цель.
  - platform: template
    name: "Treadmill Speed"
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    update_interval: 1s
    id: treadmill_speed_goal_sensor
    icon: "mdi:run"
    lambda: |-
      if (id(pause_active)) {
        // во время паузы показываем 0.0
        return 0.0;

        return id(saved_speed) / 10.0;
      } else if (id(motor_running)) {
        // при работе мотора — текущую цель
        return id(target_speed_goal) / 10.0;
      } else {
        // если мотор выключен и паузы нет — 0
        return 0.0;
      }
    on_value:
      - lambda: |-
          static float last_sent = -100.0f;
          float current = id(treadmill_speed_goal_sensor).state;

          // обновляем только при изменении ≥0.05 км/ч
          if (fabs(current - last_sent) >= 0.05f) {
            last_sent = current;

            // обновляем Nextion
            if (id(current_page) == 1) {
              char speed_str[10];
              sprintf(speed_str, "%.1f", current);
              id(display_nextion).set_component_text("t1", speed_str);
              ESP_LOGD("Nextion", "Отправка команды на дисплей - скорость");
            }

            // синхронизация ползунка
            id(set_speed).publish_state(current);
          }

# Treadmill Incline — отображает целевой наклон дорожки (%).
# Значение берётся из target_incline (деление на 10).
# Обновляется каждую секунду, на дисплей отправляется только при изменении ≥0.5%.
# Используется для отображения и синхронизации наклона на Nextion (t4).
  - platform: template
    name: "Treadmill Incline"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 1s
    id: treadmill_incline_goal_sensor
    icon: "mdi:angle-acute"
    lambda: |-
      return id(target_incline) / 10.0;
    on_value:
      - lambda: |-
          static float last_sent = -100.0f;   // хранит последнее отправленное значение
          float current = id(treadmill_incline_goal_sensor).state;

          // обновляем только если разница >= 0.5% (или 1.0%)
          if (fabs(current - last_sent) >= 0.5f) {
            last_sent = current;

            if (id(current_page) == 1) {
              char incline_str[10];
              sprintf(incline_str, "%.1f", current);
              id(display_nextion).set_component_text("t4", incline_str);
              ESP_LOGD("Nextion", "Отправка команды на дисплей - наклон");
            }
          }

