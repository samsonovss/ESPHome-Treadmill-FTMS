# --- UART debug без фильтрации ---
# Чисто отладочный режим для просмотра "сырых" данных.
# Особенности:
#  - Скорость 4800 бод.
#  - Не фильтрует байты 0x00, выводит весь поток как есть.
#  - Использовался для анализа протокола и диагностики шума.
#  - Значения не парсятся, только логируются.
#
# ⚠️ Важно:
#  - Этот блок нужен только для отладки, в рабочей конфигурации его можно держать закомментированным.
#  - Для нормальной работы сенсоров скорости/наклона используется блок interval + парсер.
#  - Debug можно включить временно, если нужно глазами посмотреть поток или проверить шум.
#
# Пример использования:
#  - Раскомментировать этот блок.
#  - Перезапустить ESPHome.
#  - В логах будут видны все байты, приходящие по UART.
#  - После анализа снова закомментировать, чтобы не дублировать обработку.

