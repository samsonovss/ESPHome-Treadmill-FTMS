  - platform: ble_client
    type: characteristic
    ble_client_id: fit_smart
    name: "Heart Rate"
    id: heart_rate_sensor
    service_uuid: "180d"
    characteristic_uuid: "2a37"
    notify: true
    update_interval: never
    lambda: |-
      if (!id(fit_smart).connected() || x.size() < 2) {
        return NAN; 
      }

      uint8_t flags = x[0];
      uint16_t heart_rate = x[1];
      if (flags & 0x01) {
        heart_rate = (x[2] << 8) | x[1]; // 16-битное значение
      }
      return (float)heart_rate;
    unit_of_measurement: "bpm"
    icon: "mdi:heart-pulse"
    on_value:
      - lambda: |-
          static int last_heart_rate = -1;  // кэш текста
          static int last_zone = -1;        // кэш зоны

          int hr = (int)x;
          if (isnan(x)) {
            if (id(current_page) == 1) {        
              id(display_nextion).send_command_printf("p0.pic=%d;t0.txt=\"-\";t0.bco=%d", 7, 14792);
              ESP_LOGI("Nextion", "BLE disconnected, reset HR display");
            }
            return;
          }

          // зоны
          float max_hr = id(max_heart_rate);
          float min_zone_1 = max_hr * 0.50;
          float max_zone_1 = max_hr * 0.60;
          float max_zone_2 = max_hr * 0.70;
          float max_zone_3 = max_hr * 0.80;
          float max_zone_4 = max_hr * 0.90;

          int heart_rate_zone = 0;
          if (hr < min_zone_1) heart_rate_zone = 0;
          else if (hr < max_zone_1) heart_rate_zone = 1;
          else if (hr < max_zone_2) heart_rate_zone = 2;
          else if (hr < max_zone_3) heart_rate_zone = 3;
          else if (hr < max_zone_4) heart_rate_zone = 4;
          else heart_rate_zone = 5;

          id(current_zone) = heart_rate_zone;

          // обновляем текст пульса всегда при изменении
          if (id(current_page) == 1 && hr != last_heart_rate) {
            id(display_nextion).send_command_printf("t0.txt=\"%d\"", hr);
            ESP_LOGI("Nextion", "Update HR text: %d", hr);
            last_heart_rate = hr;
          }

          // картинка и фон — при смене зоны ИЛИ
          if ((id(current_page) == 1) && heart_rate_zone != last_zone) {
            uint16_t picture_ids[] = {7, 2, 3, 4, 5, 6};
            uint16_t colors[]      = {14792, 15487, 11744, 64992, 64294, 63688};

            uint16_t picture_id = picture_ids[heart_rate_zone];
            uint16_t t0_bco     = colors[heart_rate_zone];

            id(display_nextion).send_command_printf("p0.pic=%d", picture_id);
            id(display_nextion).send_command_printf("t0.bco=%d", t0_bco);

            ESP_LOGI("Nextion", "Update HR zone: %d", heart_rate_zone);
            last_zone = heart_rate_zone;
          }

# Battery Level (BLE) — уровень заряда устройства fit_smart.
# Читает характеристику 0x2A19 из сервиса 0x180F через ble_client.
# Работает по уведомлениям (notify), без активного опроса.
# Если устройство не подключено или данные пустые → возвращает 0.0.
# Значение в процентах (%), отображается иконкой батареи.
  - platform: ble_client
    type: characteristic
    ble_client_id: fit_smart
    name: "Battery Level"
    id: battery_level_sensor
    service_uuid: "180F"
    characteristic_uuid: "2A19"
    notify: true
    update_interval: never  # Отключаем активный опрос
    lambda: |-
      if (!id(fit_smart).connected()) {
        return 0.0;  // Изменено с NAN на 0.0
      }
      if (x.size() < 1) return 0.0;  // Изменено с NAN на 0.0
      uint8_t battery_level = x[0];
      return (float)battery_level;
    unit_of_measurement: "%"
    icon: "mdi:battery"


# esp32_ble_tracker — включает активное сканирование BLE‑устройств.
# При необходимости можно задать параметры интервала и окна (закомментированы).
esp32_ble_tracker:
  scan_parameters:
    #interval: 1100ms
    #window: 300ms
    active: true


# ble_client (fit_smart)
# 1. Подключается к устройству с MAC‑адресом C9:5A:91:C1:92:58.
# 2. При подключении (on_connect):
#    - Публикует статус "Подключен".
#    - Запрашивает модель устройства (name_bt_sensor.update()).
#    - Принудительно обновляет уровень батареи.
#    - Устанавливает hr=1 (флаг подключения пульсометра) и обновляет статус на дисплее Nextion.
#    - Если активна главная страница (mainPage.state):
#        * Показывает сообщение об успешном подключении (p_error).
#        * Через 3 секунды скрывает его и активирует элементы интерфейса (bhr_zone, bhiit).
# 3. При отключении (on_disconnect):
#    - Сбрасывает сенсор пульса (heart_rate_sensor = 0).
#    - Обновляет дисплей Nextion:
#        * hr=0 (отключено).
#        * Сбрасывает отображение батареи, bpm и имени устройства.
#        * Меняет иконки и прозрачность элементов на главной странице.
#    - Публикует battery_level_sensor = 0.
#    - Публикует статус "Отключено".
ble_client:
  - mac_address: "C9:5A:91:C1:92:58"
    id: fit_smart
    on_connect:
      - text_sensor.template.publish:
          id: connection_status
          state: "Подключен"
      - delay: 20ms 
      - lambda: |-
          id(name_bt_sensor).update();   // запросить модель

          ESP_LOGI("ble_client", "Connected to fit_smart");
          // Принудительное чтение батареи при подключении
          id(battery_level_sensor).update();
          // Устанавливаем значение hr в 1 (подключено)
          id(display_nextion).send_command_printf("hr=1");
          ESP_LOGI("Nextion", "Sending command for hr=1");
          id(display_nextion).set_component_text("bluetooth.status_bt", "connected");
      - if:
          condition:
            lambda: 'return id(current_page) == 0;'
          then:
            - lambda: |-
                id(display_nextion).send_command_printf("p_error.pic=15");
                id(display_nextion).send_command_printf("vis p_error,1");
                ESP_LOGI("Nextion", "Sending command for p_error.pic and vis p_error 1");
            - delay: 3000ms  # Задержка 3 секунды
            - lambda: |-
                id(display_nextion).send_command_printf("vis p_error,0");
                id(display_nextion).send_command_printf("mainPage.bhr_zone.aph=127"); 
                id(display_nextion).send_command_printf("mainPage.bhiit.aph=127"); 
                ESP_LOGI("Nextion", "Sending command for vis p_error 0 and mainPage.bhr_zone.aph=127 and mainPage.bhiit.aph=127");

                //id(display_nextion).send_command_printf("mainPage.bfit_test.aph=127"); 
    on_disconnect:
      - sensor.template.publish:
          id: heart_rate_sensor
          state: 0 # !lambda 'return NAN;'
      - lambda: |-
          if (id(current_page) == 1) {
            id(display_nextion).set_component_text("b0", "-"); // Устанавливаем строку на дисплей
            id(display_nextion).send_command_printf("b0.pic=7");
            ESP_LOGI("Nextion", "Sending command for b0.pic=7");
          }

          // Устанавливаем значение hr в 0 отключено
          id(display_nextion).send_command_printf("hr=0");
          ESP_LOGI("Nextion", "Sending command for hr=0");
          // Если сейчас на главной — затемняем кнопки программ
          if (id(current_page) == 0) {
            id(display_nextion).send_command_printf("mainPage.bhr_zone.aph=80"); 
            id(display_nextion).send_command_printf("mainPage.bhiit.aph=80"); 
            ESP_LOGI("Nextion", "Sending command for mainPage.bhr_zone.aph=80 and mainPage.bhiit.aph=80");
            //id(display_nextion).send_command_printf("mainPage.bfit_test.aph=80"); 
          }
          id(display_nextion).set_component_text("bluetooth.battery", "-");
          id(display_nextion).set_component_text("bluetooth.bpm", "");
          id(display_nextion).set_component_text("bluetooth.name_bt", "-");
          id(display_nextion).set_component_text("bluetooth.status_bt", "disconnected");
      - sensor.template.publish:
          id: battery_level_sensor
          state: 0 # !lambda 'return NAN;'
      - text_sensor.template.publish:
          id: connection_status
          state: "Отключено"

