# ============================
# interval 4s — регулировка скорости по пульсу (обычные программы)
# ----------------------------
# ВАЖНО:
# - Этот интервал работает ТОЛЬКО для обычных пульсовых программ
#   (Pulse Zone, Fat Burn, Recovery run).
# - Для HIIT используется отдельный интервал и скрипт interval_training.
#
# Логика работы:
# 1. Запускается каждые 4 секунды (частота проверки фиксирована).
# 2. Если активна разминка:
#    - Условие: не ручной режим, warm_up_active=true, время разминки вышло,
#      и текущая скорость совпадает с целевой.
#    - Если пульс ниже зоны 1 (50% HRmax) и прошло ≥10 секунд с последнего изменения:
#        * Увеличивает скорость на +0.5 км/ч (до лимита 18.0 км/ч).
# 3. Если идёт основная программа (Pulse Zone, Fat Burn, Recovery run):
#    - Условие: не ручной режим, auto_mode=true, разминка завершена,
#      заминка ещё не началась.
#    - Каждые ≥N секунд (N задаётся параметром Pulse Adjust Interval)
#      вызывает скрипт adjust_speed_by_pulse_normal для коррекции скорости.
# 4. Ведётся логирование всех изменений скорости.
# ============================
  - interval: 4s
    then:
      - if:
          # Проверяем, что мотор запущен
          condition:
            lambda: 'return id(motor_running);'
          then:
            - lambda: |-
                // --- Локальные переменные для контроля времени ---
                static unsigned long last_adjust_ms = 0;   // когда последний раз меняли скорость
                unsigned long now = millis();              // текущее время в миллисекундах
                float heart_rate = id(heart_rate_sensor).state; // текущий пульс

                // --- Этап разминки ---
                // Условие: не ручной режим, разминка активна, время разминки вышло,
                // и текущая скорость совпадает с целевой (т.е. нет других изменений).
                if (id(control_mode) != 1 && id(warm_up_active) && id(remaining_warm_up_time) <= 0 && id(target_speed) == id(target_speed_goal)) {
                  float zone_1_min = id(max_heart_rate) * 0.5; // нижняя граница зоны 1 (50% от maxHR)

                  // Если пульс есть, он ниже зоны 1, и прошло хотя бы 10 секунд с последнего изменения
                  if (!isnan(heart_rate) && heart_rate < zone_1_min && (now - last_adjust_ms) >= 10000) {
                    if (id(target_speed_goal) < 180) {
                      id(target_speed_goal) += 5;   // Увеличиваем скорость на 0.5 км/ч
                      last_adjust_ms = now;         // Запоминаем время изменения
                      ESP_LOGI("Interval", "Warm-up: Waiting for pulse, increase speed by 0.5, target_speed_goal=%d", id(target_speed_goal));
                    }
                  }
                }

                // --- Основная программа (обычные пульсовые) ---
                // Условие: не ручной режим, включён auto_mode, разминка уже не активна,
                // и заминка ещё не началась.
                else if (id(control_mode) != 1 && id(auto_mode) && !id(warm_up_active) && id(remaining_cool_down_time) <= 0) {
                  // Берём интервал из параметра Pulse Adjust Interval (по умолчанию 4 секунды)
                  int adjust_interval_ms = (int)(id(pulse_adjust_interval).state * 1000);
                  if ((now - last_adjust_ms) >= adjust_interval_ms) {
                    id(adjust_speed_by_pulse_normal).execute(); // вызываем скрипт мягкой коррекции
                    last_adjust_ms = now;                       // обновляем время последнего изменения
                  }
                }


  # Проверяем входящий UART‑буфер каждые 100 мс.
  # Почему именно 100 мс:
  #   • Плата дорожки шлёт пакеты примерно раз в 200 мс.
  #   • Если опрашивать реже (200 мс и больше), то в буфере может накопиться сразу несколько пакетов,
  #     и они будут обработаны с задержкой.
  #   • 100 мс — это вдвое чаще среднего интервала прихода пакетов, поэтому мы гарантированно
  #     успеваем вычитать данные до переполнения и обрабатываем их почти в реальном времени.
  #   • Такой период не создаёт заметной нагрузки на контроллер, но обеспечивает стабильный приём.
  - interval: 200ms
    then:
      - lambda: |-
          char message[64] = {0};
          int len = 0;

          // читаем всё, что есть в RX за этот вызов
          while (id(uart_bus).available() && len < 63) {
            uint8_t c;
            if (id(uart_bus).read_byte(&c)) {
              if (c != 0x00) {
                message[len++] = (char)c;
              }
            }
          }

          if (len > 0) {
            ESP_LOGD("UART", "Получено: %s", message);

            const char* start = strchr(message, '[');
            const char* end   = strchr(message, ']');
            if (start && end && end > start) {
              const char* colon = strchr(start + 1, ':');
              if (colon && colon < end) {
                char cmd[16] = {0};
                char val[16] = {0};
                memcpy(cmd, start + 1, colon - (start + 1));
                memcpy(val, colon + 1, end - (colon + 1));

                if (strcmp(cmd, "SETSPD") == 0) {
                  int speed = atoi(val);
                  id(treadmill_speed_feedback) = speed;
                  //ESP_LOGI("UART", "Скорость обновлена: %d", speed);
                } else if (strcmp(cmd, "SETINC") == 0) {
                  int incline = atoi(val);
                  if (incline <= 1) incline = 0;
                  id(treadmill_incline_feedback) = incline;
                  //ESP_LOGI("UART", "Наклон обновлен: %d", incline);
                } else {
                  ESP_LOGW("UART", "Неизвестная команда: %s=%s", cmd, val);
                }
              }
            }
          }


# interval 1s — отправка данных FTMS.
# Логика работы:
# 1. Каждую секунду проверяет, есть ли BLE‑подключение (ble_client_connected).
# 2. Если подключение активно → выполняет скрипт send_treadmill_data
#    для отправки текущих данных дорожки по BLE.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(ble_client_connected);'
          then:
            - script.execute: send_treadmill_data
       

# interval 1s — управление разминкой.
# Логика работы:
# 1. Каждую секунду проверяет, что мотор работает и разминка активна.
# 2. Если осталось время разминки:
#    - уменьшает счётчик remaining_warm_up_time на 1 сек.
#    - каждые 60 секунд обновляет ползунок set_warm_up_time в интерфейсе.
# 3. Независимо от времени вызывает скрипт warm_up,
#    который управляет скоростью и контролем пульса.
  - interval: 1s
    then:
      - if:
          condition:
            # Проверяем, что мотор работает и разминка активна
            lambda: 'return id(motor_running) && id(warm_up_active);'
          then:
            - lambda: |- 
                if (id(remaining_warm_up_time) > 0) {                               // Если осталось время разминки
                  id(remaining_warm_up_time)--;                                     // Уменьшаем оставшееся время на 1 секунду
                  if (id(remaining_warm_up_time) % 60 == 0) {                       // Каждые 60 секунд обновляем ползунок
                    int remaining_minutes = id(remaining_warm_up_time) / 60;        // Вычисляем оставшиеся минуты
                    id(set_warm_up_time).publish_state((float)remaining_minutes);   // Обновляем ползунок разминки в интерфейсе
                  }
                }
                // Выполняем скрипт разминки для управления скоростью и пульсом
                id(warm_up).execute();


# interval 1s — управление основной частью тренировки.
# Логика работы:
# 1. Каждую секунду проверяет условия:
#    - мотор работает (motor_running = true),
#    - осталось время тренировки (remaining_run_time > 0),
#    - разминка завершена (remaining_warm_up_time <= 0 и warm_up_active = false).
# 2. Если условия выполняются:
#    - запускает скрипт run_program,
#      который отслеживает время тренировки и переводит её в фазу заминки.
  - interval: 1s
    then:
      - if:
          condition:
            # Проверяем, что мотор работает, есть время тренировки, разминка завершена
            lambda: 'return id(motor_running) && id(remaining_run_time) > 0 && id(remaining_warm_up_time) <= 0 && !id(warm_up_active);'
          then:
            # Выполняем скрипт основной программы для отслеживания времени и перехода к заминке
            - script.execute: run_program


# interval 1s — управление заминкой.
# Логика работы:
# 1. Каждую секунду проверяет условия:
#    - мотор работает (motor_running = true),
#    - идёт заминка (remaining_cool_down_time > 0),
#    - основное время тренировки закончилось (remaining_run_time <= 0).
# 2. Если условия выполняются:
#    - уменьшает счётчик remaining_cool_down_time на 1 сек.
#    - каждые 60 секунд обновляет ползунок set_cool_down_time в интерфейсе.
#    - вызывает скрипт cool_down для плавного снижения скорости и завершения тренировки.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(motor_running) && id(remaining_cool_down_time) > 0 && id(remaining_run_time) <= 0;'
          then:
            - lambda: |-
                if (id(remaining_cool_down_time) > 0) {
                  id(remaining_cool_down_time)--; // Уменьшаем время
                  if (id(remaining_cool_down_time) % 60 == 0) { // Каждые 60 секунд
                    int remaining_minutes = id(remaining_cool_down_time) / 60;
                    id(set_cool_down_time).publish_state((float)remaining_minutes); // Обновляем ползунок
                  }
                }
            - script.execute: cool_down                        



