# ***************** Скрипты *****************
script:
  # pause_training — ставит тренировку на паузу:
  # сохраняет текущие цели скорости/наклона, фиксирует время, сбрасывает их в 0 и отправляет команду на остановку.
  - id: pause_training
    then:
      - lambda: |-
          // Отправляем команду немедленно
          id(uart_bus)->write_str("[SETSPD:000]");
          id(uart_bus)->write_str("[SETINC:000]");

          // Сохраняем текущие цели
          id(saved_speed)   = id(target_speed_goal);
          id(saved_incline) = id(target_incline_goal);

          // Фиксируем время паузы
          id(pause_time_sec) = id(treadmill_time_sec).state;

          // Ставим флаги
          id(pause_active)  = true;
          id(motor_running) = false;

          // Ставим цели в 0
          id(target_speed_goal)   = 0;
          id(target_incline_goal) = 0;

          ESP_LOGI("PAUSE", "Training paused at %.0f sec", id(pause_time_sec));

          // --- Отправляем FTMS статус: Paused (0x02)
          id(ftms_status_char).set_value({0x02, 0x01});
          id(ftms_status_char).notify();
          id(last_ftms_status) = {0x02, 0x01};
          id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x02));
          ESP_LOGI("FTMS", "Отправлено уведомление: Paused (0x02)");

          // Сохраняем текущий статус программы
          id(saved_program_status) = id(program_status).state;

          // --- Выводим на дисплей Nextion статус "PAUSE"
          id(program_status).publish_state("Pause");
          id(display_nextion).set_component_text("speed.tstatus", "Pause");


          if (id(current_page) != 25) {
            id(display_nextion).goto_page("pause");
            ESP_LOGI("treadmill", "Nextion Page Pause");
          }

  # resume_training — возобновляет тренировку:
  # снимает флаг паузы, восстанавливает время и сохранённые значения скорости/наклона.
  - id: resume_training
    then:
      - lambda: |-
          // Снимаем флаг паузы
          id(pause_active) = false;

          // Восстанавливаем время на дисплее
          id(treadmill_time_sec).publish_state(id(pause_time_sec));

          // Восстанавливаем сохранённые цели
          id(target_speed) = 0; // база с нуля
          id(target_speed_goal) = id(saved_speed);
          id(target_speed_goal_float) = 0.0f; 
          
          //id(target_speed_goal)   = id(saved_speed);
          id(target_incline_goal) = id(saved_incline);

          // Но target_speed сбрасываем в 0, как при новой тренировке
          //id(target_speed) = 0;

          // Плавающая цель тоже сбрасывается
          //id(target_speed_goal_float) = id(target_speed_goal) / 10.0f;


          // Включаем мотор снова
          id(motor_running) = true;

          // Отправляем команды немедленно
          char cmd[20];
          sprintf(cmd, "[SETSPD:%03d]", id(target_speed_goal));
          id(uart_bus)->write_str(cmd);

          sprintf(cmd, "[SETINC:%03d]", id(target_incline_goal));
          id(uart_bus)->write_str(cmd);

          ESP_LOGI("PAUSE", "Training resumed at %.0f sec, speed=%d, incline=%d",
                   id(pause_time_sec), id(target_speed_goal), id(target_incline_goal));

          // --- Восстанавливаем статус программы
          if (id(saved_program_status).size() > 0) {
            id(program_status).publish_state(id(saved_program_status).c_str());
            if (id(current_page) == 1) {
              id(display_nextion).set_component_text("speed.tstatus", id(saved_program_status).c_str());
            }
          }

          // --- Отправляем FTMS статус: Resumed (0x04)
          id(ftms_status_char).set_value({0x04});
          id(ftms_status_char).notify();
          id(last_ftms_status) = {0x04};
          id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x04));
          ESP_LOGI("FTMS", "Отправлено уведомление: Resumed (0x04)");

          if (id(current_page) == 25) {
            id(display_nextion).goto_page("speed");
            ESP_LOGI("treadmill", "Nextion Page speed");
          }

# --- Сброс всех данных тренировки ---
  - id: reset_workout_data
    mode: queued
    then:
      - lambda: |-
          // --- Сброс накопителей ---
          id(total_distance_km) = 0.0;
          id(total_speed_sum) = 0.0;
          id(speed_count) = 0;
          id(total_incline_sum) = 0.0;
          id(incline_count) = 0;
          id(total_heart_rate_sum) = 0.0;
          id(heart_rate_count) = 0;
          id(max_heart_rate_total) = 0.0;
          id(zone1_time) = 0;
          id(zone2_time) = 0;
          id(zone3_time) = 0;
          id(zone4_time) = 0;
          id(zone5_time) = 0;

          // --- Сброс итоговых глобалов ---
          id(last_time_stored) = 0.0f;
          id(last_distance_stored) = 0.0f;
          id(last_calories_stored) = 0.0f;
          id(avg_speed_stored) = 0.0f;
          id(avg_incline_stored) = 0.0f;
          id(avg_heart_rate_stored) = 0.0f;
          id(max_heart_rate_stored) = 0.0f;
          id(last_training_date_stored) = "";

          // --- Сброс новых метрик ---
          id(fat_grams_stored) = 0.0f;
          id(avg_vo2_stored) = 0.0f;
          id(avg_met_stored) = 0.0f;
          id(avg_pace_stored) = 0.0f;

          // --- Обнуление сенсоров в HA ---
          id(last_time).publish_state(0.0f);
          id(last_distance).publish_state(0.0f);
          id(last_calories).publish_state(0.0f);
          id(last_avg_speed).publish_state(0.0f);
          id(last_avg_incline).publish_state(0.0f);
          id(last_avg_hr).publish_state(0.0f);
          id(last_max_hr).publish_state(0.0f);
          id(last_fat).publish_state(0.0f);
          id(last_vo2).publish_state(0.0f);
          id(last_met).publish_state(0.0f);
          id(last_pace).publish_state(0.0f);
          id(last_training_date).publish_state("");


  # start_manual — запуск беговой дорожки в ручном режиме:
  # включает мотор, задаёт минимальную скорость (если не задана),
  # публикует параметры на дисплей, сбрасывает таймеры,
  # устанавливает режим Manual Mode и отправляет статусы FTMS/Training.
  - id: start_manual
    mode: restart
    then:
      - script.execute: reset_workout_data
      - lambda: |-
          id(motor_running) = true;
          id(manual_stop) = false;

          // Если цель ещё не задана — ставим минимальную (2.5 км/ч = 25)
          if (id(target_speed_goal) == 0) {
            id(target_speed_goal) = 25;
          }

          // Сохраняем дату/время начала тренировки
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            auto snapshot = now.strftime("%Y-%m-%d %H:%M:%S");
            id(start_training_date_stored) = snapshot;
            id(start_training_date).publish_state(snapshot);
          }

          // Публикуем цель на дисплей
          id(set_speed).publish_state(id(target_speed_goal) / 10.0);


          id(remaining_warm_up_time) = 0;
          float run_time = id(set_run_time).state;
          id(remaining_run_time) = (run_time > 0) ? run_time * 60 : 0;
          id(remaining_cool_down_time) = 0;
          id(program_status).publish_state("Manual Mode");
          id(display_nextion).set_component_text("speed.tstatus", "Manual Mode");
          id(control_mode) = 0;  // Ручной режим
          id(auto_mode) = false;
          ESP_LOGI("Manual", "Установлен ручной режим (control_mode = 0), иконка 62");

          // Fitness Machine Status: Started or Resumed (0x04)
          id(ftms_status_char).set_value({0x04});
          id(ftms_status_char).notify();
          id(last_ftms_status) = {0x04};
          id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x04));
          ESP_LOGI("FTMS", "Отправлено уведомление: Started or Resumed (0x04)");

          // Training Status: Manual Mode (0x0D)
          id(training_status_char).set_value({0x00, 0x0D});
          id(training_status_char).notify();
          id(last_training_status) = {0x00, 0x0D};
          id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x0D));
          ESP_LOGI("FTMS", "Отправлено уведомление: Manual Mode (0x0D)");

          if (id(current_page) != 1) {
            id(display_nextion).send_command_printf("page 1");
            ESP_LOGI("Nextion", "Переключение на страницу 1");
          }



  - id: start_program
    then:
      - lambda: |-
          id(motor_running) = true;
          id(manual_stop) = false;

          // Сохраняем дату/время начала тренировки
          auto now = id(sntp_time).now();
          if (now.is_valid()) {
            auto snapshot = now.strftime("%Y-%m-%d %H:%M:%S");
            id(start_training_date_stored) = snapshot;
            id(start_training_date).publish_state(snapshot);
          }

          // Если цель ещё не задана — ставим минимальную (2.5 км/ч = 25)
          if (id(target_speed_goal) == 0) {
            id(target_speed_goal) = 25;
          }

          // Публикуем цель на дисплей
          id(set_speed).publish_state(id(target_speed_goal) / 10.0);

          // Определяем программу
          std::string program = id(program_select).current_option();

          if (program == "Pulse Zone" || program == "Fat Burn" || program == "Recovery run") {
            id(control_mode) = 2;  // Управление по пульсу
            id(auto_mode) = true;
            id(display_nextion).send_command_printf("speed.p_icon_mode.pic=59");
            ESP_LOGI("Program", "Установлен режим управления по пульсу (control_mode = 2), иконка 59");

          } else if (program == "HIIT") {
            id(control_mode) = 0;  // HIIT управляется отдельным скриптом
            id(auto_mode) = false;
            id(display_nextion).send_command_printf("speed.p_icon_mode.pic=62");
            ESP_LOGI("Program", "Установлен HIIT (control_mode = 0), иконка 62");

            // Сброс счётчика и установка первой фазы HIIT
            id(start_hiit).execute();

            // --- Новый блок: выводим статус HIIT на дисплей ---
            int cycles = (int)id(hiit_cycles).state;
            std::string zone = id(zone_select).current_option();
            std::string short_zone = "Z" + zone;

            char buffer[50];
            snprintf(buffer, sizeof(buffer), "HIIT, %s: %.0f-%.0f bpm, Cycles: %d",
                    short_zone.c_str(),
                    id(target_heart_rate_min), id(target_heart_rate_max),
                    cycles);

            id(program_status).publish_state(buffer);
            id(display_nextion).set_component_text("speed.tstatus", buffer);
            ESP_LOGI("DEBUG", "Status updated: %s", buffer);

            // Training Status: High Intensity Interval (0x04)
            if (id(last_training_status)[1] != 0x04) {
              id(training_status_char).set_value({0x00, 0x04});
              id(training_status_char).notify();
              id(last_training_status) = {0x00, 0x04};
              id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x04));
              ESP_LOGI("FTMS", "Отправлено уведомление: High Intensity Interval (0x04)");
            }

          } else {
            id(control_mode) = 0;  // Ручной режим для остальных
            id(auto_mode) = false;
            id(display_nextion).send_command_printf("speed.p_icon_mode.pic=62");
            ESP_LOGI("Program", "Установлен ручной режим (control_mode = 0), иконка 62");
          }

          // Fitness Machine Status: Started or Resumed (0x04)
          if (id(last_ftms_status)[0] != 0x04) {
            id(ftms_status_char).set_value({0x04});
            id(ftms_status_char).notify();
            id(last_ftms_status) = {0x04};
            id(ftms_status_sensor).publish_state(id(ftms_status_to_string)(0x04));
            ESP_LOGI("FTMS", "Отправлено уведомление: Started or Resumed (0x04)");
          }

          float wu_time = id(set_warm_up_time).state;
          if (wu_time > 0) {
            id(warm_up_active) = true;
            id(remaining_warm_up_time) = wu_time * 60;
            int warm_up_minutes = id(remaining_warm_up_time) / 60;
            int warm_up_seconds = id(remaining_warm_up_time) % 60;
            char buffer[20];
            snprintf(buffer, sizeof(buffer), "Warm-up: (%d:%02d)", warm_up_minutes, warm_up_seconds);
            id(program_status).publish_state(buffer);
            id(display_nextion).set_component_text("speed.tstatus", buffer);
            ESP_LOGI("DEBUG", "Status updated: %s", buffer);

            // Training Status: Warming Up (0x02)
            if (id(last_training_status)[1] != 0x02) {
              id(training_status_char).set_value({0x00, 0x02});
              id(training_status_char).notify();
              id(last_training_status) = {0x00, 0x02};
              id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x02));
              ESP_LOGI("FTMS", "Отправлено уведомление: Warming Up (0x02)");
            }

          } else {
            id(warm_up_active) = false;
            id(remaining_warm_up_time) = 0;
            float run_time = id(set_run_time).state;
            id(remaining_run_time) = (run_time > 0) ? run_time * 60 : 0;

            if (program != "None" && id(remaining_run_time) > 0) {
              int remaining_minutes = id(remaining_run_time) / 60;
              int remaining_seconds = id(remaining_run_time) % 60;
              std::string zone = id(zone_select).current_option();
              char buffer[40];
              std::string short_zone = zone;
              if (zone == "1") short_zone = "Z1";
              else if (zone == "2") short_zone = "Z2";
              else if (zone == "3") short_zone = "Z3";
              else if (zone == "4") short_zone = "Z4";
              else if (zone == "5") short_zone = "Z5";

              if (program == "Pulse Zone") {
                snprintf(buffer, sizeof(buffer), "%s: %.0f-%.0f bpm (%d:%02d)",
                        short_zone.c_str(), id(target_heart_rate_min), id(target_heart_rate_max),
                        remaining_minutes, remaining_seconds);
              } else {
                snprintf(buffer, sizeof(buffer), "%s, %s: %.0f-%.0f, Run (%d:%02d)",
                        program.c_str(), short_zone.c_str(), id(target_heart_rate_min), id(target_heart_rate_max),
                        remaining_minutes, remaining_seconds);
              }
              id(program_status).publish_state(buffer);
              id(display_nextion).set_component_text("speed.tstatus", buffer);
              ESP_LOGI("DEBUG", "Status updated: %s", buffer);

              // Training Status в зависимости от программы
              uint8_t status_code;
              if (program == "Pulse Zone" || program == "Fat Burn" || program == "Recovery run") {
                status_code = 0x07; // Heart Rate Control
              } else if (program == "HIIT") {
                status_code = 0x04; // High Intensity Interval
              } else {
                status_code = 0x00; // Other
              }
              if (id(last_training_status)[1] != status_code) {
                id(training_status_char).set_value({0x00, status_code});
                id(training_status_char).notify();
                id(last_training_status) = {0x00, status_code};
                id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(status_code));
                ESP_LOGI("FTMS", "Отправлено уведомление: %s (0x%02X)",
                        id(training_status_to_string)(status_code).c_str(), status_code);
              }
            } else {
              // Только для НЕ-HIIT программ выводим "No duration"
              if (program != "HIIT") {
                id(program_status).publish_state("Program: No duration");
                id(display_nextion).set_component_text("speed.tstatus", "Program: No duration");
              }
            }
          }

          id(remaining_cool_down_time) = 0;
          id(warm_up_time) = 0;

          if (id(current_page) != 1) {
            id(display_nextion).send_command_printf("page 1");
            ESP_LOGI("Nextion", "Переключение на страницу 1");
          }


# warm_up — скрипт управления процессом разминки.
# Логика работы:
# 1. Каждую секунду увеличивает счётчик warm_up_time.
# 2. Если разминка активна и пульс ниже зоны 1:
#    - Каждые 10 секунд увеличивает скорость на 0.1 км/ч (до лимита 12.0 км/ч).
# 3. По завершении времени разминки:
#    - Если пульс достиг зоны 1 → разминка завершается:
#        * Обновляется статус ("Warm-up: Done").
#        * Если выбрана программа и задано время → формируется статус с зоной/пульсом и запускается run_program.
#        * Отправляется Training Status в зависимости от программы:
#            - HIIT → High Intensity Interval (0x04).
#            - Pulse Zone / Fat Burn / Recovery run → Heart Rate Control (0x07).
#            - Остальные → Other (0x00).
#        * Если программа не выбрана → статус Idle (0x01).
#    - Если пульс не определяется более 60 секунд → аварийная остановка:
#        * motor_running = false, цели скорости сбрасываются в 0.
#        * Статус "Warm-up: No pulse".
#        * Training Status = Idle (0x01).
#        * Выполняется stop_program.
# 4. Обновление дисплея:
#    - Пока разминка активна → отображает оставшееся время (мин:сек).
#    - После окончания времени:
#        * Если пульс не определяется → "Warm-up: Wait pulse".
#        * Если пульс ниже зоны 1 → "Warm-up: Need X bpm".
#    - Обновление статуса каждые 10 секунд.
  - id: warm_up
    then:
      - lambda: |-
          static int warm_up_time = 0;
          warm_up_time++;
          float heart_rate = id(heart_rate_sensor).state;
          float zone_1_min = id(max_heart_rate) * 0.5;

          // Увеличение скорости на 0.1 км/ч каждые 10 секунд во время разминки
          if (id(control_mode) != 1 && id(remaining_warm_up_time) > 0 &&
              warm_up_time % 10 == 0 && heart_rate < zone_1_min && !isnan(heart_rate)) {
            if (id(target_speed_goal) < 120) {
              id(target_speed_goal) += 1;
              id(set_speed).publish_state(id(target_speed_goal) / 10.0);
              ESP_LOGI("WarmUp", "Increased speed by 0.1 km/h: target_speed_goal=%d", id(target_speed_goal));
            }
          }

          // Проверка завершения времени разминки
          if (id(remaining_warm_up_time) <= 0) {
            if (heart_rate >= zone_1_min && !isnan(heart_rate)) {
              id(warm_up_active) = false;
              warm_up_time = 0;

              std::string program = id(program_select).current_option();
              if (program == "HIIT") {
                // --- Переход сразу в HIIT ---
                id(interval_time) = 0;
                id(interval_phase) = "high";
                id(auto_mode) = false;

                int cycles_left = (int)id(hiit_cycles).state;
                std::string zone = id(zone_select).current_option();
                std::string short_zone = "Z" + zone;

                char hiit_buf[60];
                snprintf(hiit_buf, sizeof(hiit_buf), "HIIT High %s %.0f-%.0f, C:%d",
                        short_zone.c_str(),
                        id(target_heart_rate_min), id(target_heart_rate_max),
                        cycles_left);

                id(program_status).publish_state(hiit_buf);
                id(display_nextion).set_component_text("speed.tstatus", hiit_buf);
                ESP_LOGI("DEBUG", "Status updated immediately after warm-up: %s", hiit_buf);

                // --- FTMS уведомление для HIIT ---
                uint8_t status_code = 0x04;
                if (id(last_training_status)[1] != status_code) {
                  id(training_status_char).set_value({0x00, status_code});
                  id(training_status_char).notify();
                  id(last_training_status) = {0x00, status_code};
                  id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(status_code));
                  ESP_LOGI("FTMS", "Отправлено уведомление: %s (0x%02X)",
                          id(training_status_to_string)(status_code).c_str(), status_code);
                }

                return; // <<< выходим, чтобы не обновился "Need …"
              }
              else {
                // Для остальных программ публикуем "Warm-up: Done"
                id(program_status).publish_state("Warm-up: Done");
                id(display_nextion).set_component_text("speed.tstatus", "Warm-up: Done");

                if (program != "None" && id(remaining_run_time) > 0) {
                  uint8_t status_code;
                  if (program == "Pulse Zone" || program == "Fat Burn" || program == "Recovery run") {
                    status_code = 0x07;
                    id(auto_mode) = true;
                  } else {
                    status_code = 0x00;
                  }
                  if (id(last_training_status)[1] != status_code) {
                    id(training_status_char).set_value({0x00, status_code});
                    id(training_status_char).notify();
                    id(last_training_status) = {0x00, status_code};
                    id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(status_code));
                    ESP_LOGI("FTMS", "Отправлено уведомление: %s (0x%02X)",
                            id(training_status_to_string)(status_code).c_str(), status_code);
                  }
                  id(run_program).execute();
                } else {
                  if (id(last_training_status)[1] != 0x01) {
                    id(training_status_char).set_value({0x00, 0x01});
                    id(training_status_char).notify();
                    id(last_training_status) = {0x00, 0x01};
                    id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x01));
                    ESP_LOGI("FTMS", "Отправлено уведомление: Idle (0x01)");
                  }
                }
              }
            }
            else if (warm_up_time >= 60 && isnan(heart_rate)) {
              // Аварийная остановка
              id(warm_up_active) = false;
              id(motor_running) = false;
              id(target_speed) = 0;
              id(target_speed_goal) = 0;
              id(set_speed).publish_state(0.0);
              id(treadmill_speed_goal_sensor).publish_state(0.0);
              id(program_status).publish_state("Warm-up: No pulse");
              id(display_nextion).set_component_text("speed.tstatus", "Warm-up: No pulse");
              warm_up_time = 0;
              if (id(last_training_status)[1] != 0x01) {
                id(training_status_char).set_value({0x00, 0x01});
                id(training_status_char).notify();
                id(last_training_status) = {0x00, 0x01};
                id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x01));
                ESP_LOGI("FTMS", "Отправлено уведомление: Idle (0x01)");
              }
              id(stop_program).execute();
              ESP_LOGI("WarmUp", "Stopped: No pulse detected for 60 seconds");
            }
          }

          // Обновление статуса дисплея (только если разминка активна)
          if (id(warm_up_active)) {
            char buffer[32];
            if (id(remaining_warm_up_time) > 0) {
              int remaining_minutes = id(remaining_warm_up_time) / 60;
              int remaining_seconds = id(remaining_warm_up_time) % 60;
              snprintf(buffer, sizeof(buffer), "Warm-up: (%d:%02d)", remaining_minutes, remaining_seconds);
            } else {
              if (isnan(heart_rate)) {
                snprintf(buffer, sizeof(buffer), "Warm-up: Wait pulse");
              } else {
                snprintf(buffer, sizeof(buffer), "Warm-up: Need %.0f bpm", zone_1_min);
              }
            }
            if (warm_up_time % 10 == 0) {
              id(program_status).publish_state(buffer);
              id(display_nextion).set_component_text("speed.tstatus", buffer);
              ESP_LOGI("DEBUG", "Status updated: %s, length: %d", buffer, strlen(buffer));
            }
          }

# cool_down — скрипт управления заминкой.
# Логика работы:
# 1. Проверка режима:
#    - Если активен Free Run (control_mode=1) → регулировка скорости не выполняется.
# 2. Определение параметров:
#    - Текущий пульс, верхняя граница зоны 1 (60% от max HR).
#    - Текущая скорость (через target_speed_goal).
#    - Минимальная скорость = 1.0 км/ч.
# 3. Постепенное снижение скорости:
#    - Каждые ~15 вызовов уменьшаем скорость.
#    - Если пульс выше зоны 1 +10 → уменьшаем на 0.5 км/ч.
#    - Если пульс выше зоны 1, но ≤+10 → уменьшаем на 0.1 км/ч.
#    - Если пульс не определяется → уменьшаем на 0.5 км/ч.
#    - Скорость не опускается ниже 1.0 км/ч.
# 4. Учёт времени на минимальной скорости:
#    - Если скорость ≤1.0 км/ч → увеличиваем счётчик min_speed_timer.
#    - Иначе сбрасываем его.
# 5. Обновление статуса:
#    - Каждые 10 секунд публикуется статус "Cool-down: (мин:сек)".
#    - Отправляется на дисплей Nextion.
# 6. Отправка FTMS статуса:
#    - Если ещё не установлен → публикуется Training Status: Cool Down (0x0B).
# 7. Условие завершения заминки:
#    - Если время заминки закончилось, либо
#    - Если пульс ≤ зоны 1 (или пульс отсутствует) и min_speed_timer ≥30 сек.
#    → мотор выключается, цели скорости сбрасываются в 0,
#      статус "Cool-down: Done", выполняется stop_program.
  - id: cool_down
    then:
      - lambda: |-
          if (id(control_mode) == 1) {
            ESP_LOGI("CoolDown", "Free Run активен, регулировка скорости приостановлена");
            return;
          }

          float heart_rate = id(heart_rate_sensor).state;
          float zone_1_max = id(max_heart_rate) * 0.6;
          float current_speed_kph = id(target_speed_goal) / 10.0;   // работаем через goal
          float target_min_speed = 3.0; //ниже шага не уйдет

          static int speed_adjust_timer = 0;
          static int min_speed_timer = 0;
          static float target_speed_kph = current_speed_kph;

          // каждые ~15 вызовов уменьшаем скорость
          speed_adjust_timer++;
          if (speed_adjust_timer >= 15 && current_speed_kph > target_min_speed) {
            float speed_step = 0.0;

            if (!isnan(heart_rate)) {
              if (heart_rate > zone_1_max + 10) {
                speed_step = 0.5;
                ESP_LOGI("CoolDown", "High HR (>10 above max), decrease speed by 0.5");
              } else if (heart_rate > zone_1_max && heart_rate <= zone_1_max + 10) {
                speed_step = 0.1;
                ESP_LOGI("CoolDown", "High HR (≤10 above max), decrease speed by 0.1");
              }
            } else {
              speed_step = 0.5;
              ESP_LOGI("CoolDown", "No HR, decrease speed by 0.5");
            }

            if (speed_step > 0.0) {
              target_speed_kph -= speed_step;
              if (target_speed_kph < target_min_speed) target_speed_kph = target_min_speed;
              id(target_speed_goal) = (int)(target_speed_kph * 10);
              speed_adjust_timer = 0;
              ESP_LOGI("CoolDown", "Decrease speed by %.1f: target_speed_goal=%d",
                      speed_step, id(target_speed_goal));
            }
          }

          // считаем время на минимальной скорости
          if (current_speed_kph <= target_min_speed) {
            min_speed_timer++;
          } else {
            min_speed_timer = 0;
          }

          // обновление статуса каждые 10 секунд
          if (id(remaining_cool_down_time) % 10 == 0) {
            int remaining_minutes = id(remaining_cool_down_time) / 60;
            int remaining_seconds = id(remaining_cool_down_time) % 60;
            char buffer[20];
            snprintf(buffer, sizeof(buffer), "Cool-down: (%d:%02d)", remaining_minutes, remaining_seconds);
            id(program_status).publish_state(buffer);
            id(display_nextion).set_component_text("speed.tstatus", buffer);
            ESP_LOGI("DEBUG", "Status updated: %s, length: %d", buffer, strlen(buffer));
          }

          // FTMS статус
          if (id(last_training_status)[1] != 0x0B) {
            id(training_status_char).set_value({0x00, 0x0B});
            id(training_status_char).notify();
            id(last_training_status) = {0x00, 0x0B};
            id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(0x0B));
            ESP_LOGI("FTMS", "Отправлено уведомление: Cool Down (0x0B)");
          }

          // условие завершения заминки
          bool pulse_ok = isnan(heart_rate) || heart_rate <= zone_1_max;
          if (id(remaining_cool_down_time) <= 0 || (pulse_ok && min_speed_timer >= 30)) {
            id(motor_running) = false;
            id(target_speed_goal) = 0;   // только goal, target_speed подтянется интервалом
            id(set_speed).publish_state(0.0);
            id(treadmill_speed_goal_sensor).publish_state(0.0);
            id(program_status).publish_state("Cool-down: Done");
            id(display_nextion).set_component_text("speed.tstatus", "Cool-down: Done");
            id(stop_program).execute();
            ESP_LOGI("CoolDown", "Cool-down completed");
          }

  - id: start_hiit
    then:
      - lambda: |-
          id(interval_cycle_count) = 0;
          id(interval_phase) = "high";   // начинаем с работы
          id(interval_time) = 0;         // сброс времени
          ESP_LOGI("HIIT", "HIIT стартовал, цикл счётчик сброшен");


# ============================
# interval_training — логика интервальной тренировки (HIIT)
# ----------------------------
# 1. Управляет фазами "high" (работа) и "low" (отдых).
# 2. В фазе high:
#    - Вызывает update_heart_rate_zones для пересчёта target_heart_rate_min/max.
#    - Каждые 4 секунды вызывает adjust_speed_by_pulse_hiit.
# 3. В фазе low:
#    - Работает на фиксированной скорости hiit_low_speed.
#    - В статусе отображается как "Recovery".
# 4. Переключение фаз по времени (hiit_high_duration / hiit_low_duration).
# 5. После каждого полного цикла уменьшается hiit_cycles.
# 6. Когда hiit_cycles = 0 → тренировка завершается.
# 7. При каждой смене фазы обновляется статус на дисплее и отправляется FTMS.
# ============================
  - id: interval_training
    then:
      - lambda: |-
          if (id(control_mode) == 1) {
            ESP_LOGI("IntervalTraining", "Free Run активен, регулировка скорости по пульсу приостановлена");
            return;
          }

          id(interval_time)++;
          const char* phase = id(interval_phase).c_str();

          // Длительность текущей фазы
          int phase_duration = (strcmp(phase, "high") == 0) 
                                ? (int)id(hiit_high_duration).state 
                                : (int)id(hiit_low_duration).state;

          // --- Фаза high ---
          if (strcmp(phase, "high") == 0) {
            // Пересчитываем зоны по выбранному zone_select
            id(update_heart_rate_zones).execute();

            ESP_LOGI("IntervalTraining", "High phase: target zone %s (%.0f–%.0f bpm)",
                    id(zone_select).current_option(),
                    id(target_heart_rate_min), id(target_heart_rate_max));

            if (id(interval_time) % 4 == 0) {
              id(adjust_speed_by_pulse_hiit).execute();
            }

          } else {
            // --- Фаза low ---
            int rest_speed = (int)(id(hiit_low_speed).state * 10.0f);
            if (id(target_speed_goal) != rest_speed) {
              id(target_speed_goal) = rest_speed;
              id(set_speed).publish_state(id(hiit_low_speed).state);
              ESP_LOGI("IntervalTraining", "Low phase: set fixed speed %.1f km/h", id(hiit_low_speed).state);
            }
          }

          // --- Переключение фаз ---
          if (id(interval_time) >= phase_duration) {
            id(interval_time) = 0;

            if (strcmp(phase, "high") == 0) {
              id(interval_phase) = "low";
            } else {
              id(interval_phase) = "high";
              id(interval_cycle_count)++; // завершённый цикл
              id(hiit_cycles).publish_state(id(hiit_cycles).state - 1);

              id(update_heart_rate_zones).execute();
              id(adjust_speed_by_pulse_hiit).execute();
              ESP_LOGI("IntervalTraining", "Начало High: мгновенная корректировка скорости по пульсу");
            }

            // Проверка завершения
            if ((int)id(hiit_cycles).state <= 0) {
              ESP_LOGI("IntervalTraining", "HIIT завершён: выполнено %d циклов", id(interval_cycle_count));
              id(motor_running) = false;
              return;
            }
          }

          // --- Обновляем статус на дисплее каждую секунду ---
          int cycles_left = (int)id(hiit_cycles).state;
          std::string phase_str = id(interval_phase);
          std::string phase_label;
          std::string zone_label;

          // вычисляем оставшееся время
          int remaining = phase_duration - id(interval_time);
          if (remaining < 0) remaining = 0;
          int rem_min = remaining / 60;
          int rem_sec = remaining % 60;

          char buffer[80];
          if (phase_str == "high") {
            phase_label = "High";
            zone_label = std::string("Z") + id(zone_select).current_option();
            snprintf(buffer, sizeof(buffer), "%s %s %.0f-%.0f, C:%d (%d:%02d)",
                    phase_label.c_str(),
                    zone_label.c_str(),
                    id(target_heart_rate_min), id(target_heart_rate_max),
                    cycles_left,
                    rem_min, rem_sec);
          } else {
            phase_label = "Recovery";
            float rest_speed = id(hiit_low_speed).state;
            snprintf(buffer, sizeof(buffer), "%s %.1f km/h, C:%d (%d:%02d)",
                    phase_label.c_str(),
                    rest_speed,
                    cycles_left,
                    rem_min, rem_sec);
          }

          id(program_status).publish_state(buffer);
          id(display_nextion).set_component_text("speed.tstatus", buffer);
          ESP_LOGI("DEBUG", "Status updated: %s", buffer);

          // --- Отправляем Training Status FTMS ---
          uint8_t status_code = (phase_str == "high") ? 0x04 : 0x03;  // 0x04 High Intensity, 0x03 Low Intensity (по спецификации FTMS)
          id(training_status_char).set_value({0x00, status_code});
          id(training_status_char).notify();
          id(last_training_status) = {0x00, status_code};
          id(ftms_training_status_sensor).publish_state(id(training_status_to_string)(status_code));
          ESP_LOGI("FTMS", "Отправлено уведомление: Training Status %s (0x%02X), remaining cycles: %d",
                  id(training_status_to_string)(status_code).c_str(), status_code, cycles_left);

