# interval 1s — накопление статистики тренировки.
# Логика работы:
# 1. Запускается каждую секунду, пока работает мотор.
# 2. Сохраняет:
#    - Общую дистанцию (treadmill_distance_km).
# 3. Накопление статистики:
#    - Средняя скорость: суммирует значения и считает количество измерений.
#    - Средний наклон: суммирует значения и считает количество измерений.
#    - Пульс: суммирует значения, считает количество измерений, фиксирует максимальный пульс.
# 4. Расчёт MET:
#    - Использует скорость и наклон для вычисления VO₂ и MET.
#    - Накопленные значения позволяют рассчитать средний MET.
# 5. Учёт времени в пульсовых зонах:
#    - Увеличивает счётчик времени для текущей зоны (1–5).
# 6. Если мотор остановлен:
#    - текущая зона сбрасывается в 0.
  - interval: 1s
    then:
      - lambda: |-
          if (id(motor_running)) {
            // --- Дистанция
            float current_distance = id(treadmill_distance_km).state;
            if (current_distance > 0) id(total_distance_km) = current_distance;

            // --- Текущие значения
            float current_speed = id(treadmill_speed_goal_sensor).state;
            float current_incline = id(treadmill_incline_goal_sensor).state;
            float current_heart_rate = id(heart_rate_sensor).state;

            // --- Средняя скорость
            if (current_speed > 0) {
              id(total_speed_sum) += current_speed;
              id(speed_count)++;
            }

            // --- Средний наклон
            if (current_incline >= 0) {
              id(total_incline_sum) += current_incline;
              id(incline_count)++;
            }

            // --- Пульс
            if (current_heart_rate > 0 && !isnan(current_heart_rate)) {
              id(total_heart_rate_sum) += current_heart_rate;
              id(heart_rate_count)++;
              if (current_heart_rate > id(max_heart_rate_total)) {
                id(max_heart_rate_total) = current_heart_rate;
              }
            }

            // --- Расчёт MET
            if (current_speed > 0 && current_incline >= 0) {
              float real_incline = current_incline / 3.0f;
              float speed_m_per_min = current_speed * 1000.0f / 60.0f;
              float grade = real_incline / 100.0f;
              float vo2 = 0.1f * speed_m_per_min + 1.8f * speed_m_per_min * grade + 3.5f;
              float met = vo2 / 3.5f;
              id(total_met_sum) += met;
              id(met_count)++;
            }

            // --- Время в зонах
            int zone = id(current_zone);
            if (zone == 1) id(zone1_time)++;
            else if (zone == 2) id(zone2_time)++;
            else if (zone == 3) id(zone3_time)++;
            else if (zone == 4) id(zone4_time)++;
            else if (zone == 5) id(zone5_time)++;
          } else {
            id(current_zone) = 0;
          }


# interval 5s — обновление наклона по выбранной карте.
# Логика работы:
# 1. Каждые 5 секунд проверяет, что мотор работает.
