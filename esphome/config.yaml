  - platform: template
    name: "Treadmill Time"
    id: treadmill_time_sec
    lambda: |-
      uint32_t now = millis();
      static uint32_t elapsed_ms = 0;

      if (!id(motor_running) && !id(pause_active)) {
        elapsed_ms = 0;
        id(treadmill_time_last) = 0;
        return 0;
      }

      if (id(motor_running) && !id(pause_active)) {
        if (id(treadmill_time_last) != 0) {
          uint32_t diff = now - id(treadmill_time_last);
          elapsed_ms += diff;   // накапливаем миллисекунды
        }
      }

      id(treadmill_time_last) = now;

      return elapsed_ms / 1000;  // наружу — секунды
    update_interval: 1s
    unit_of_measurement: "s"
    accuracy_decimals: 0
    icon: "mdi:timer-play-outline"
    on_value:
      - component.update: total_calories
      - lambda: |-
          int total = (int)x;
          int hours = total / 3600;
          int minutes = (total % 3600) / 60;
          int seconds = total % 60;

          char buffer[9];
          sprintf(buffer, "%02d:%02d:%02d", hours, minutes, seconds);
          //id(treadmill_time_formatted).publish_state(buffer);

          if ((id(motor_running) || id(pause_active)) && (id(current_page) == 1)) {
            char time_str[6];
            sprintf(time_str, "%02d:%02d", minutes, seconds);
            id(display_nextion).set_component_text("t3", time_str);
          }
