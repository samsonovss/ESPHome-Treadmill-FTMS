#    - запускает скрипт update_incline_by_map,
#      который подбирает наклон по текущей дистанции и профилю маршрута.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(motor_running);'
          then:
            - script.execute: update_incline_by_map



