# Smart treadmill base configuration.
# Functional logic is grouped into packages below.
packages:
  00_startup: !include packages/00-startup.yaml
  10_hardware: !include packages/10-hardware.yaml
  20_globals: !include packages/20-globals.yaml
  30_scripts: !include packages/30-scripts.yaml
  40_intervals: !include packages/40-intervals.yaml
  50_buttons: !include packages/50-buttons.yaml
  60_sensors: !include packages/60-sensors.yaml
  70_ble_ftms: !include packages/70-ble-ftms.yaml
  80_binary_text: !include packages/80-binary-text.yaml
  90_controls: !include packages/90-controls.yaml
  95_nextion: !include packages/95-nextion.yaml

esphome:
  name: treadmill
  friendly_name: treadmill
  platformio_options:
    board_build.arduino.memory_type: qio_opi
  includes:
    - incline_profiles.h

external_components:
  - source: github://mrtoy-me/esphome-vl53l1x@main
    components: [vl53l1x]
    refresh: 0s

  # ESPHome 2026.5.3 downgrades indications to unconfirmed notifications.
  # Zwift requires confirmed FTMS Control Point responses to pair CONTROLLABLE.
  - source:
      type: local
      path: components
    components: [esp32_ble_server]

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      # Performance
      COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_32B: "y"

      # Octal PSRAM for data
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "n"
      CONFIG_SPIRAM_RODATA: "n"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"

      # LVGL is not used
      CONFIG_LV_MEM_CUSTOM: "n"
      CONFIG_LV_MEMCPY_MEMSET_STD: "n"
      CONFIG_LV_ATTRIBUTE_FAST_MEM: "n"

esp32_ble:
  # GAP advertising name used by the KICKR RUN compatibility profile.
  name: "KICKR RUN"
  max_connections: 3

psram:
  mode: octal
  speed: 80MHz

safe_mode:
  num_attempts: 1

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# Local status and control interface. Web OTA is intentionally disabled.
web_server:
  port: 80

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: "Treadmill Fallback Hotspot"
    password: !secret fallback_ap_password

captive_portal:
